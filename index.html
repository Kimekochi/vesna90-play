Object.assign(VO_LINES,{"rin|Ты написал про меня сцену? Я... Можно я сыграю её сама? С тобой.": "bd_rin_1", "wei|Ты съела его?! Всё, ты почётный житель Чэнду. Без визы.": "bd_wei_1", "aigerim|Ты расписал мне пожелания до конца года? Это самое организованное признание в моей жизни.": "bd_aigerim_1", "mira|Ты попал мне в волосы! Война! ...Это лучший день рождения в моей жизни.": "bd_mira_1", "dana|...Ты заметил? Я никому не говорила. Спасибо. Правда.": "bd_dana_1", "lilia|На сцене? ...С тобой — может быть. Это самый страшный и лучший подарок.": "bd_lilia_1", "arman|Открываю приложение, а там торт и твоё имя? Ты разобралась в моём коде?! Это лучший коммит в истории.": "bd_arman_1", "timur|Ты сняла рекламу?! Сто лайков за час! Мама тоже лайкнула, но остальные — не мама!": "bd_timur_1", "daniyar|Ты слушала мои записи? Все? ...Я думал, этого никто не замечает.": "bd_daniyar_1", "sanzhar|«Пекарня Доюна». Ты написала это так, будто она уже есть. Может, и будет.": "bd_sanzhar_1", "emma|Меня никто не снимает, я всегда за камерой. Этот кадр будет у меня в рамке.": "bd_emma_1", "nari|Весь экран в тортиках! Ты взломал мой чат? Я тебя обожаю.": "bd_nari_1", "lucas|Joyeux anniversaire... с твоим акцентом. Я сейчас растаю, как масло.": "bd_lucas_1", "junso|Бабушка скажет, что это лучший букет в её жизни. И что ты ей нравишься.": "bd_junso_1", "rin|Прости, я вслух? Я пишу диалог и проверяю, как он звучит. Звучит плохо.": "rin_n1", "rin|Сато Рин. Из Киото, по обмену. Учусь на кинофакультете и пишу сценарий про Сеул.": "rin_n2", "rin|Можно я иногда буду записывать, что ты говоришь? Ты разговариваешь как герой фильма. В хорошем смысле.": "rin_n3", "wei|Не испугалась? Отлично! Значит, у тебя крепкие нервы. Нам такие нужны.": "wei_n1", "wei|Ли Вэй. Из Чэнду, по обмену. Учу экономику днём, а вечером танцую здесь. Ну, в основном танцую.": "wei_n2", "wei|Хочешь попробовать? Первое движение бесплатно. Второе тоже. Дальше — ужин из хого на всю команду.": "wei_n3", "aigerim|Не подкрадывайся так, пожалуйста.": "aigerim_n1", "aigerim|Юна. Международные отношения, второй курс. Если ищешь розетку — она под столом. Все ищут розетку.": "aigerim_n2", "mira|Это ты, когда заходил. Нахмуренный такой.": "mira_n1", "mira|Я Харин. Бариста, художница и главный враг скучных лиц. Заходи ещё — следующий кот будет добрее.": "mira_n2", "dana|Реакция есть. Уже неплохо.": "dana_n1", "dana|Минджи, волейбол, второй курс. Нам на пробежке не хватает людей, которые не ноют. Ты не ноешь?": "dana_n2", "lilia|Чэвон. Пишу музыку, которую пока никто не понимает. Ключевое слово — «пока».": "lilia_n1", "arman|А? Это не мой. Просто не могу пройти мимо синего экрана.": "arman_n1", "arman|Джиху. Если что-то сломается — я рядом. В смысле... с компьютером. Ну и вообще.": "arman_n2", "timur|Привет! Сыграем один на один? Я поддамся. Чуть-чуть.": "timur_n1", "timur|Тэян. Баскетбол, экономфак и лучшие шутки на этом берегу Хангана.": "timur_n2", "daniyar|Если пришла слушать — садись. Если болтать — дверь там.": "daniyar_n1", "daniyar|...Шучу. Наполовину. Хёну. Юрфак днём, гитара ночью. Угадай, что из этого я люблю.": "daniyar_n2", "sanzhar|Это был живот или гром? Держи круассан, он кривой, его всё равно не продать.": "sanzhar_n1", "sanzhar|Я Доюн. Пеку здесь по утрам, учусь на технолога. Вкусно — главная наука.": "sanzhar_n2", "emma|Ой! Прости. Ты не знаешь, как попасть в Хондэ? Мой корейский... пока только «аннёнхасэё» и «ещё одну порцию».": "emma_n1", "emma|Я Эмма. Из Стокгольма. Приехала по обмену на семестр и уже третий раз еду не в ту сторону.": "emma_n2", "emma|Если покажешь дорогу, я сфотографирую тебя на плёнку. Это высшая награда в моей стране.": "emma_n3", "nari|Ты... слышал? Это не я. Это мой персонаж.": "nari_n1", "nari|Нари. Стримлю по вечерам. Офлайн я не такая громкая. Офлайн я вообще не очень.": "nari_n2", "nari|Садись. Посмотрим, как ты играешь.": "nari_n3", "lucas|Пардон. Ты не знаешь, как по-корейски «можно ещё один круассан, но настоящий»?": "lucas_n1", "lucas|Шучу. Местные круассаны прекрасны. Почти.": "lucas_n2", "lucas|Я Лукас. Из Лиона. Архитектура, обмен, вечная потерянность в метро.": "lucas_n3", "junso|Ой. Здравствуйте. То есть привет. Я не слышал колокольчик.": "junso_n1", "junso|Я Джунсо. Это бабушкина лавка. Она теперь на пенсии, а я... поливаю.": "junso_n2", "junso|Первый цветок — бесплатно. Ромашка значит «невинность». Или «тебе здесь рады». Выбирай сама.": "junso_n3", "rin|Ты написал «я тебя люблю, давай есть рамён». Смешно. Но оставлю для комедии.": "rin_n4", "rin|Финал вышел странный: все поют. Но жюри может понравиться. Наверное.": "rin_n5", "wei|Ты упала. Красиво! Почти как я в первый день.": "wei_n4", "wei|Держи молоко. И салфетку. И ещё молоко. Ты молодец.": "wei_n5", "wei|Мы писали час и всё стёрли. Но теперь я хотя бы знаю, что хочу сказать.": "wei_n6", "wei|Ты сбилась на шестом такте, но зал хлопал громче всего. Это тоже победа.": "wei_n7", "emma|Подожди... «пудинг» точно не значит «острый суп»? Ладно, всё равно спасибо.": "emma_n4", "emma|Хм. Редактор вернул половину. Но мы старались, правда.": "emma_n5", "nari|Ты... нажал не ту кнопку. Трижды. Ладно, рамён за тобой.": "nari_n4", "nari|Подсказка не сработала... Но я всё равно рада, что ты был рядом.": "nari_n5", "lucas|Это... очень смелая перспектива. Почти кубизм. Мне нравится.": "lucas_n4", "lucas|Крыша съехала... Но мы спасли фасад. И это уже победа.": "lucas_n5", "junso|Ну... это смелый букет. Как будто подрались весна и осень. Мне нравится.": "junso_n4", "junso|Ты пришла сонная и чуть не уснула в ведре с тюльпанами. Но пришла.": "junso_n5", "rin|Сборник сценариев старого кино! Я искала его два года. Ты читаешь мысли.": "rin_n6", "rin|Спасибо. Это очень внимательно.": "rin_n7", "rin|Мышка... игровая? Я буду ею листать сценарии. Очень быстро.": "rin_n8", "wei|Билеты на концерт?! Это та самая группа! Танцуем у сцены, договорились?": "wei_n8", "wei|Спасибо! Приятно.": "wei_n9", "wei|Суккулент... Я его засушу за неделю. Но буду стараться.": "wei_n10", "aigerim|Скетчбук? Тот самый, с плотной бумагой? Ты... внимательный. Спасибо.": "aigerim_n3", "aigerim|Спасибо. Очень мило.": "aigerim_n4", "aigerim|Концерт? Там же шумно... Ну, спасибо.": "aigerim_n5", "mira|Котик-брелок! Повешу на скетчбук. Навсегда!": "mira_n3", "mira|Спасибо! Мне приятно.": "mira_n4", "mira|Книга... Использую как подставку для красок. В хорошем смысле!": "mira_n5", "dana|Шоколадка! Ты знаешь путь к сердцу спортсменки.": "dana_n3", "dana|О, спасибо!": "dana_n4", "dana|Цветы? И куда я их дену в раздевалке?..": "dana_n5", "lilia|Билеты на тот самый концерт? Ты... слушаешь меня. По-настоящему.": "lilia_n2", "lilia|Спасибо.": "lilia_n3", "lilia|Брелок-котик. Мне не двенадцать.": "lilia_n4", "arman|Та самая книга по алгоритмам? С пометками? Ты... невероятная.": "arman_n3", "arman|Спасибо, мне очень приятно.": "arman_n4", "arman|Концерт? Там же люди. Много людей. Ну... спасибо.": "arman_n5", "timur|Шоколадка! После тренировки — то, что надо. Ты лучшая!": "timur_n3", "timur|О, спасибо! Приятно.": "timur_n4", "timur|Книга? Эм... я прочитаю. Обложку точно.": "timur_n5", "daniyar|Билеты на них? Я мечтал. Откуда ты знала?": "daniyar_n3", "daniyar|Спасибо. Правда.": "daniyar_n4", "daniyar|Брелок-котик. Повешу на гитару. Иронично.": "daniyar_n5", "sanzhar|Котик! Повешу над духовкой. Будет охранять тесто.": "sanzhar_n3", "sanzhar|Спасибо! Ты чудо.": "sanzhar_n4", "sanzhar|Шоколадка... Я сам такие делаю. Но спасибо, правда.": "sanzhar_n5", "emma|Плёнка! Настоящая цветная плёнка! Первый кадр — твой.": "emma_n6", "emma|Спасибо! Это очень мило.": "emma_n7", "emma|Книга... на корейском? Я буду читать её до пенсии. Спасибо.": "emma_n8", "nari|Это та самая мышка с боковыми кнопками?! Ты разбираешься! Я тебя... очень уважаю.": "nari_n6", "nari|О, спасибо! Неожиданно.": "nari_n7", "nari|Цветы? Они же умрут. Ну, спасибо. Поставлю у монитора.": "nari_n8", "lucas|Макаруны? Корейские макаруны... Они идеальны. Не говори моей бабушке.": "lucas_n6", "lucas|Спасибо, это очень мило.": "lucas_n7", "lucas|Игровая мышь? Я... буду ей рисовать. Наверное.": "lucas_n8", "junso|Суккулент в маленьком горшке... Я буду поливать его раз в неделю и думать о тебе каждый день.": "junso_n6", "junso|Спасибо. Это очень мило.": "junso_n7", "junso|Концерт? Там же громко... Но спасибо, правда.": "junso_n8", "rin|Кино! Последний ряд, старый фильм и ты. Идеальный кадр.": "rin_n9", "rin|Хорошо. Но в кино я бы молчала увереннее.": "rin_n10", "wei|Парк! Музыка, огни, место, где мы познакомились. Ты помнишь!": "wei_n11", "wei|Классно! Но в парке я бы ещё и станцевал.": "wei_n12", "aigerim|Тихое кафе с книжными полками. Пахнет корицей. Идеально.": "aigerim_n6", "aigerim|Неплохо. Хотя я бы взяла с собой книгу.": "aigerim_n7", "mira|Закат у реки! Не двигайся, я хочу тебя нарисовать.": "mira_n6", "mira|Весело! Но я бы лучше порисовала у реки.": "mira_n7", "dana|Аттракционы! Спорим, я не закричу на американских горках? Спорим, закричишь ты?": "dana_n6", "dana|Неплохо, но я бы лучше подвигалась.": "dana_n7", "lilia|Странное кино на последнем ряду. Ты понимаешь меня лучше, чем я думала.": "lilia_n5", "lilia|Нормально. Но я бы лучше в кино.": "lilia_n6", "arman|Тихое кафе, где можно говорить и не перекрикивать музыку. Ты угадала.": "arman_n6", "arman|Хорошо. Хотя мне уютнее, где потише.": "arman_n7", "timur|Аттракционы! Держись за меня на горках. Или я за тебя. Посмотрим.": "timur_n6", "timur|Прикольно! Но я бы лучше чем-то активным занялся.": "timur_n7", "daniyar|Странное кино на последнем ряду. Ты знаешь толк.": "daniyar_n6", "daniyar|Неплохо. Но кино было бы лучше.": "daniyar_n7", "sanzhar|Пикник у реки! Я, конечно, взял булочки.": "sanzhar_n6", "sanzhar|Здорово! Хотя я бы лучше у реки погулял.": "sanzhar_n7", "emma|Набережная! Ветер, огни, лучший свет для съёмки. Ты знал!": "emma_n9", "emma|Хорошо! Но на реке свет был бы лучше.": "emma_n10", "nari|Кино! Это та самая аниме-премьера? Ты гений.": "nari_n9", "nari|Норм. Но в кино было бы лучше. Там темно, и никто не смотрит.": "nari_n10", "lucas|Кофейня у окна, дождь и ты. Это кадр из французского фильма.": "lucas_n9", "lucas|Хорошо. Хотя я бы выбрал кафе: там можно говорить часами.": "lucas_n10", "junso|Парк вечером. Тут цветёт вишня, и ты рядом. Больше ничего не нужно.": "junso_n9", "junso|Хорошо. Хотя в парке было бы тише.": "junso_n10", "rin|Привет. Я как раз писала сцену, где кто-то заходит. Это ты.": "rin_n11", "rin|А, это ты. Садись, я дочитаю абзац.": "rin_n12", "rin|Привет! Сегодня я написала три страницы. Это рекорд.": "rin_n13", "rin|Привет... Я ждала тебя. Для сценария, конечно. Не только.": "rin_n14", "rin|Мой главный герой пришёл. Можно начинать.": "rin_n15", "wei|Эй! Готова к тренировке?": "wei_n13", "wei|О, ты! Я как раз придумал новое движение. Смотри!": "wei_n14", "wei|Привет-привет! Сегодня ужин из хого, ты в списке.": "wei_n15", "wei|Привет... Я тебя высматривал. Просто так. Не просто так.": "wei_n16", "wei|Моя любимая партнёрша по танцам! Иди сюда.": "wei_n17", "aigerim|Привет. Место напротив свободно.": "aigerim_n8", "aigerim|О, это ты. Я как раз хотела сделать перерыв.": "aigerim_n9", "aigerim|Привет. Я... надеялась, что ты зайдёшь.": "aigerim_n10", "aigerim|Привет. Иди сюда, покажу новую страницу. Только тебе.": "aigerim_n11", "aigerim|Привет. Я скучала. Тсс, тут все работают.": "aigerim_n12", "mira|Привет! Латте с котом?": "mira_n8", "mira|О, мой любимый посетитель!": "mira_n9", "mira|Привет! Я как раз про тебя думала. В смысле — про твой заказ.": "mira_n10", "mira|Привет... Я нарисовала тебя на салфетке. Не смотри!": "mira_n11", "mira|Привет, мой человек. Садись у окна.": "mira_n12", "dana|А, это ты. Разминаться будешь?": "dana_n8", "dana|О, привет! Побегаем?": "dana_n9", "dana|Привет! Сегодня я бегу медленнее. Ради тебя. Не привыкай.": "dana_n10", "dana|Привет. Я... рада тебя видеть. Не смейся.": "dana_n11", "dana|Мой человек! Иди сюда.": "dana_n12", "lilia|...Привет.": "lilia_n7", "lilia|А, это ты. Послушай новый бит.": "lilia_n8", "lilia|Привет. Садись. Ты не мешаешь.": "lilia_n9", "lilia|Привет. Я написала куплет. Кажется, про тебя.": "lilia_n10", "lilia|Ты пришёл. Хорошо. Без тебя не пишется.": "lilia_n11", "arman|Привет. Я тут... компилирую.": "arman_n8", "arman|Привет! Я занял тебе розетку.": "arman_n9", "arman|Привет. Я сделал тебе ярлык на рабочем столе. Ну, в смысле, твоим конспектам.": "arman_n10", "arman|Привет. У меня баг, но я увидел тебя и забыл, какой.": "arman_n11", "arman|Привет. Я скучал. Это не баг.": "arman_n12", "timur|О, привет! Сыграем?": "timur_n8", "timur|Привет! Я как раз про тебя думал.": "timur_n9", "timur|Привет! Я придумал новую шутку. Она про тебя. Она хорошая!": "timur_n10", "timur|Привет... Ты сегодня очень красивая. Ой, вслух сказал.": "timur_n11", "timur|Моя болельщица номер один!": "timur_n12", "daniyar|...Привет.": "daniyar_n8", "daniyar|А, ты. Послушай риф.": "daniyar_n9", "daniyar|Привет. Садись ближе, отсюда лучше слышно.": "daniyar_n10", "daniyar|Привет. Весь день играл одну мелодию. Она похожа на тебя.": "daniyar_n11", "daniyar|Ты пришла. Теперь можно играть.": "daniyar_n12", "sanzhar|Привет! Голодная?": "sanzhar_n8", "sanzhar|Привет! Я испёк булочку с корицей. Тебе.": "sanzhar_n9", "sanzhar|Привет! Попробуешь новый рецепт? Честно, он не страшный.": "sanzhar_n10", "sanzhar|Привет... Я сделал пирожное. Розовое. Как ты, когда краснеешь.": "sanzhar_n11", "sanzhar|Моя любимая! Держи, ещё тёплое.": "sanzhar_n12", "emma|Хей! Ой, то есть аннён!": "emma_n11", "emma|Привет! Смотри, я выучила новое слово: «пэкопа». Я голодная!": "emma_n12", "emma|Хей, мой гид! Куда сегодня?": "emma_n13", "emma|Привет... Я как раз думала о тебе. Случайно. Постоянно.": "emma_n14", "emma|Мой любимый человек в Сеуле! Иди сюда.": "emma_n15", "nari|А, привет. Садись, только не трогай мою мышку.": "nari_n11", "nari|О, ты! Есть свободный комп рядом.": "nari_n12", "nari|Привет! Я сегодня взяла пять побед подряд. Сиди и восхищайся.": "nari_n13", "nari|Привет... Я тебя ждала. В смысле, у меня матч, а ты мой талисман.": "nari_n14", "nari|Мой дуэт пришёл! Всё, сервер наш.": "nari_n15", "lucas|Бонжур. Ой, то есть аннён.": "lucas_n11", "lucas|Привет! Я нарисовал эту кофейню уже шесть раз. Седьмой — с тобой.": "lucas_n12", "lucas|Привет! Садись, я угощаю. Не спорь, во Франции так принято.": "lucas_n13", "lucas|Привет... Ты сегодня как акварель. Мягкая и светлая.": "lucas_n14", "lucas|Мон шер. Я ждал тебя весь день.": "lucas_n15", "junso|Привет. Колокольчик звенит, значит, ты пришла.": "junso_n11", "junso|Привет. Сегодня привезли сирень. Понюхай.": "junso_n12", "junso|Привет! Я отложил для тебя самую красивую ветку.": "junso_n13", "junso|Привет... Знаешь, какой цветок означает «скучал»? Я тоже не знаю. Но скучал.": "junso_n14", "junso|Ты пришла. Лавка сразу светлее.": "junso_n15", "rin|Хорошая реплика. Записываю.": "rin_n16", "rin|Ты сейчас сказал что-то очень точное.": "rin_n17", "rin|Понятно.": "rin_n18", "rin|Интересно. Наверное.": "rin_n19", "rin|Слишком громко для меня.": "rin_n20", "rin|Это звучит как реклама энергетика.": "rin_n21", "wei|Ха! Огонь!": "wei_n18", "wei|Вот это настрой! Мне нравится.": "wei_n19", "wei|Окей, принято.": "wei_n20", "wei|Ну, неплохо.": "wei_n21", "wei|Это звучит как лекция по экономике.": "wei_n22", "wei|Ой, слишком серьёзно.": "wei_n23", "aigerim|Хм. С тобой интересно.": "aigerim_n13", "aigerim|Неожиданно хороший ответ.": "aigerim_n14", "aigerim|Понятно.": "aigerim_n15", "aigerim|Ну, допустим.": "aigerim_n16", "aigerim|Можно без этого?": "aigerim_n17", "aigerim|Серьёзно? Ладно.": "aigerim_n18", "mira|Ха-ха, ты смешной!": "mira_n13", "mira|Оу. Это мило.": "mira_n14", "mira|Ага.": "mira_n15", "mira|Интересно... наверное.": "mira_n16", "mira|Звучит как лекция.": "mira_n17", "mira|Скууучно.": "mira_n18", "dana|Ха! По-нашему.": "dana_n13", "dana|Нормально сказал. Уважаю.": "dana_n14", "dana|Окей.": "dana_n15", "dana|Ну, допустим.": "dana_n16", "dana|Без соплей, пожалуйста.": "dana_n17", "dana|Ты слишком много думаешь.": "dana_n18", "lilia|Хм. Ты не такой, как все.": "lilia_n12", "lilia|Вот это честно.": "lilia_n13", "lilia|Может быть.": "lilia_n14", "lilia|Угу.": "lilia_n15", "lilia|Ты как ведущий на корпоративе.": "lilia_n16", "arman|О. Логично.": "arman_n13", "arman|Это очень мило. Сохраню в памяти.": "arman_n14", "arman|Принято.": "arman_n15", "arman|Хм, допустим.": "arman_n16", "arman|Это было... громко.": "arman_n17", "arman|Я не очень понимаю такие шутки.": "arman_n18", "timur|Ха! Ты огонь.": "timur_n13", "timur|Вот это по-нашему!": "timur_n14", "timur|Ага.": "timur_n15", "timur|Окей-окей.": "timur_n16", "timur|Слишком умно для меня до обеда.": "timur_n17", "timur|Ты как будто лекцию читаешь.": "timur_n18", "daniyar|Неплохо сказано. Можно в песню.": "daniyar_n13", "daniyar|Хм. Ты интересная.": "daniyar_n14", "daniyar|Ну.": "daniyar_n15", "daniyar|Возможно.": "daniyar_n16", "daniyar|Слишком мило. Меня сейчас стошнит радугой.": "daniyar_n17", "daniyar|Звучит как статус в соцсетях.": "daniyar_n18", "sanzhar|Ха, ты классная!": "sanzhar_n13", "sanzhar|Это так мило, что я сейчас сожгу круассаны.": "sanzhar_n14", "sanzhar|Ага.": "sanzhar_n15", "sanzhar|Интересно!": "sanzhar_n16", "sanzhar|Сложно. Я думаю тестом, а не формулами.": "sanzhar_n17", "sanzhar|Звучит как контрольная.": "sanzhar_n18", "emma|Ха! Ты смешной. По-хорошему.": "emma_n16", "emma|О, это смело! Мне нравится.": "emma_n17", "emma|Окей!": "emma_n18", "emma|Интересно, наверное.": "emma_n19", "emma|Это как лекция по налогам.": "emma_n20", "emma|Звучит скучно, прости.": "emma_n21", "nari|Ха, жиза!": "nari_n16", "nari|О, умно. Я бы так и сыграла.": "nari_n17", "nari|Ну норм.": "nari_n18", "nari|Ага, понятно.": "nari_n19", "nari|Кринж. Прости, но кринж.": "nari_n20", "nari|Слишком сладко, у меня сахар подскочил.": "nari_n21", "lucas|Ты удивительная.": "lucas_n16", "lucas|О-ля-ля. В хорошем смысле.": "lucas_n17", "lucas|Понимаю.": "lucas_n18", "lucas|Хм, интересно.": "lucas_n19", "lucas|Это была шутка? Я не понял, прости.": "lucas_n20", "lucas|Слишком громко для меня.": "lucas_n21", "junso|Ты… очень хорошо это сказала.": "junso_n16", "junso|Мне нравится, как ты думаешь.": "junso_n17", "junso|Угу.": "junso_n18", "junso|Понятно.": "junso_n19", "junso|Это... слишком резко для меня.": "junso_n20", "junso|Ой. Ладно.": "junso_n21"});

Object.assign(VO_LINES,{"aigerim|Если староста отметит, что меня нет, это будет первая «н» за два года. Я сейчас упаду в обморок.": "aigerim_k1", "aigerim|Мы продали всё! Двадцать из двадцати! Ради этого стоило получить «н».": "aigerim_k2", "aigerim|Ты подумала даже об этом. Теперь я прогуливаю с чистой совестью.": "aigerim_k3", "aigerim|Да... Правильно. Ярмарка будет в следующем году. Наверное.": "aigerim_k4", "aigerim|Хочу, чтобы ты проверила. Я впервые оставила в плане пустые места. На всякий случай.": "aigerim_k5", "aigerim|Пункт семь: «Подруга». Срок — бессрочно. Утверждено.": "aigerim_k6", "aigerim|Он горит красиво. Четырнадцатилетняя я бы закричала. А мне легко.": "aigerim_k7", "aigerim|Хм. Нет, пустые места оставлю. Там будет то, чего я пока не знаю.": "aigerim_k8", "aigerim|С тобой интересно. Я даже забыла заглянуть в план.": "aigerim_k9", "aigerim|Это был хороший вечер. Записываю в планер: «повторить».": "aigerim_k10", "aigerim|Неплохо. Мне понравилось.": "aigerim_k11", "aigerim|Можно помедленнее? Я не успеваю за тобой.": "aigerim_k12", "mira|Десять мольбертов. Ноль людей. Может, рисовать хочу только я.": "mira_k1", "mira|Ты привела двенадцать человек! Даже охранника из банка напротив! Он рисует кота!": "mira_k2", "mira|Ты нарисовала… это лошадь? Неважно. Люди увидели, что тут не страшно, и зашли.": "mira_k3", "mira|Спасибо. В следующий раз повесим объявление пораньше.": "mira_k4", "mira|Я знаю, что работы там хорошие. В этом и проблема.": "mira_k5", "mira|Я посмотрела всё. Хорошие. А потом подумала: у меня тоже будут. Спасибо, что не дала сбежать.": "mira_k6", "mira|Двенадцать салфеток — двенадцать картин. Первую выставку я устрою вот такой. Шучу. Или нет.": "mira_k7", "mira|Да… Можно. Но тогда я буду бояться ещё год.": "mira_k8", "mira|Ахаха, это лучший вечер за месяц!": "mira_k9", "mira|Ты такая милая, что я нарисую этот вечер на стене.": "mira_k10", "mira|Было здорово!": "mira_k11", "mira|Звучит как лекция. Давай лучше поедим?": "mira_k12", "dana|Не дрейфь. Ты подаёшь, я делаю всё остальное. План гениальный.": "dana_k1", "dana|Ты прыгала как сумасшедшая! Мы вышли в полуфинал! Ты мой напарник навсегда.": "dana_k2", "dana|Ты так их заболтала, что они проиграли три мяча подряд. Нечестно. Гениально.": "dana_k3", "dana|Замена? Ладно. Но я запомню.": "dana_k4", "dana|Месяц! Я с ума сойду. Я не умею не тренироваться.": "dana_k5", "dana|Плавание, растяжка, тактика… Это скучно. Но это план. Спасибо, что не сказала «отдыхай».": "dana_k6", "dana|Мы разобрали все игры сборной. Я теперь знаю, где ошибалась. Месяц прошёл не зря.": "dana_k7", "dana|Не говори так. Никогда.": "dana_k8", "dana|Ха! Вот это по-нашему.": "dana_k9", "dana|Нормально так. Повторим в субботу.": "dana_k10", "dana|Окей, было неплохо.": "dana_k11", "dana|Без соплей, ладно? Мы же не в дораме.": "dana_k12", "lilia|Ищем то, что никто не слышит. Скрип, шаги, чужой смех.": "lilia_k1", "lilia|Ты нашла звук, который я искала полгода. Он будет в начале трека.": "lilia_k2", "lilia|Чужой смех в ре миноре. Идеально. Ты слышишь как я.": "lilia_k3", "lilia|На записи только твой голос. Ладно. Тоже звук.": "lilia_k4", "lilia|Я не выйду. Там люди. Они будут смотреть.": "lilia_k5", "lilia|Я смотрела только на тебя. Десять минут. И они хлопали. Мне хлопали.": "lilia_k6", "lilia|Я услышала, что это хорошая музыка. Даже если я боюсь. Пошла.": "lilia_k7", "lilia|Нет. Если уйду сейчас, буду уходить всегда.": "lilia_k8", "lilia|Хм. Хороший вечер. Это редкость.": "lilia_k9", "lilia|Ты говоришь мало, но точно. Как я.": "lilia_k10", "lilia|Нормально.": "lilia_k11", "emma|Они должны быть пышные. Почему они плоские? Почему они чёрные снизу?": "emma_k1", "emma|Вторая партия — как у мамы в Стокгольме! Вся кухня пахнет домом.": "emma_k2", "emma|Это лучшая фика в истории! Люди смеялись и ели. Даже чёрные.": "emma_k3", "emma|Корейские булки с кремом. Не фика, но вкусно.": "emma_k4", "emma|Через месяц семестр кончается. Мне кажется, я уеду, а Сеул забудет, что я тут была.": "emma_k5", "emma|Обложка — мы. Сеул нас не забудет. Я подаю заявку остаться ещё на год.": "emma_k6", "emma|Я всегда за камерой. Первый раз в кадре. Это и будет последняя страница.": "emma_k7", "emma|Красиво. Как открытка. Наверное, этого и не хватает — нас.": "emma_k8", "emma|Это было смело! Обожаю такие вечера!": "emma_k9", "emma|Ха! Ты лучшая подруга в Сеуле.": "emma_k10", "emma|Окей! Было мило.": "emma_k11", "emma|Это как лекция по налогам. Пойдём лучше гулять.": "emma_k12", "nari|Онлайн я весёлая. А тут они увидят, что я обычная.": "nari_k1", "nari|Ты говорила за меня первые пять минут, а потом я разошлась. Они классные. Обычные. Как я.": "nari_k2", "nari|Мы проиграли сорок раз подряд, и это был лучший час в моей жизни.": "nari_k3", "nari|Спасибо… Но мне стыдно. Они ведь ждали.": "nari_k4", "nari|Ты не обязана быть смешной. Просто будь. Ну, и не кидай гранаты в своих.": "nari_k5", "nari|Чат в шоке: «Кто эта машина?» Ты — моя напарница. Официально.": "nari_k6", "nari|Ты назвала мой промах «стратегическим отступлением». Это теперь мем канала.": "nari_k7", "nari|Чат пишет «гостья милая». Ты милая. И очень тихая.": "nari_k8", "nari|Жиза! Это лучше любого стрима.": "nari_k9", "rin|Одна реплика. Три секунды. Если ты моргнёшь, будет дубль сорок.": "rin_k1", "rin|Дубль один! Ты сыграла лучше, чем было написано. Я перепишу сцену под тебя.": "rin_k2", "rin|Твоя лучше. Опять. Ты мой консультант по живой речи, помнишь?": "rin_k3", "rin|Ладно, прохожая убежала. Это тоже сюжет.": "rin_k4", "rin|Сейчас будет сцена, над которой смеялись. Я закрою глаза.": "rin_k5", "rin|В этот раз никто не смеялся. А в конце хлопали. Ты видела? Они хлопали.": "rin_k6", "rin|Ты пересказала мой фильм лучше меня. Я наконец поняла, что он про надежду.": "rin_k7", "rin|Спасибо… Но я так и не узнаю, что они почувствовали.": "rin_k8", "rin|Записываю. Это готовая сцена.": "rin_k9", "rin|С тобой вечер длиннее. В хорошем смысле.": "rin_k10", "rin|Хорошо посидели.": "rin_k11", "rin|Слишком громко для меня. Давай потише в следующий раз.": "rin_k12", "arman|Это просто. Почти. Смотри, тут скобка, тут ещё скобка, а тут всё ломается.": "arman_k1", "arman|Бот работает! Он уже напомнил коменданту про стирку. Мы легенды.": "arman_k2", "arman|Он теперь пишет «Брат, носки сами себя не постирают». Общага в восторге.": "arman_k3", "arman|Ладно. Но учиться было веселее.": "arman_k4", "arman|Я умею писать код. Я не умею рассказывать, что умею писать код.": "arman_k5", "arman|Ты спросил самое страшное, и я ответил. Значит, и там отвечу. Спасибо, бро.": "arman_k6", "arman|Точно. Я просто расскажу про бабушку. Это я умею.": "arman_k7", "arman|Наверное. Но мне всё равно страшно.": "arman_k8", "arman|Логично и весело. Редкое сочетание, бро.": "arman_k9", "arman|Это было круто. Сохраню в памяти. В настоящей, не в компьютере.": "arman_k10", "arman|Нормально посидели.": "arman_k11", "arman|Это было… громко. Давай в следующий раз потише.": "arman_k12", "timur|Дело на час. Ну, на три. Кимпаб за мой счёт.": "timur_k1", "timur|Мы разгрузили за два часа! Ты машина. Кимпаб двойной.": "timur_k2", "timur|Отец посмотрел и сказал: «Кто это придумал? Пусть приходит ещё». Ха!": "timur_k3", "timur|Понял. Сам справлюсь.": "timur_k4", "timur|Сценарий такой: ты покупаешь рамён и ОЧЕНЬ радуешься. Всё. Гениально же.": "timur_k5", "timur|Сто лайков за час! Мама тоже лайкнула, но остальные — не мама!": "timur_k6", "timur|Пять серий! Люди пишут, где этот магазин. Брат, ты продюсер.": "timur_k7", "timur|Ладно, снимем руки. Руки тоже продают рамён. Наверное.": "timur_k8", "timur|Ха! Брат, ты огонь.": "timur_k9", "timur|Вот это вечер! Повторим!": "timur_k10", "timur|Окей-окей, неплохо.": "timur_k11", "timur|Слишком умно для меня. Давай лучше в баскет.": "timur_k12", "daniyar|«Кислые сливы» — нет. «Юрфак» — точно нет. Помоги, или мы будем называться никак.": "daniyar_k1", "daniyar|«Второй куплет». Подходит. Песня, которую мы ещё не допели. Ты понял лучше нас.": "daniyar_k2", "daniyar|Победило «Сломанный медиатор». Ужасно. Нам нравится.": "daniyar_k3", "daniyar|Спасибо. Очень помог.": "daniyar_k4", "daniyar|Подпишу — и отец узнает. Не подпишу — и узнаю я. Что я трус.": "daniyar_k5", "daniyar|Подписал. Руки трясутся. Но я это сделал. Спасибо, что был рядом.": "daniyar_k6", "daniyar|Я позвонил. Он молчал минуту. Потом сказал: «Приду на концерт». Ты понимаешь? Он придёт.": "daniyar_k7", "daniyar|Конца года... Да. Ещё полгода юрфака. Ладно.": "daniyar_k8", "daniyar|Неплохо. Можно в песню.": "daniyar_k9", "daniyar|Хм. С тобой не скучно. Не говори никому.": "daniyar_k10", "daniyar|Ну. Нормально.": "daniyar_k11", "sanzhar|Это… кирпич. Отличный кирпич. Из него можно построить вторую пекарню.": "sanzhar_k1", "sanzhar|Вторая буханка поднялась! Корочка трещит! Ты прирождённый пекарь, брат.": "sanzhar_k2", "sanzhar|«Первый хлеб. Не есть». Это теперь талисман пекарни.": "sanzhar_k3", "sanzhar|Магазинный. Ладно. Я сделаю вид, что не видел.": "sanzhar_k4", "sanzhar|Если сгорит — всё. Я опять буду пекарем «для своих».": "sanzhar_k5", "sanzhar|Ни одной горелой! Второе место! Брат, это ты держал жар.": "sanzhar_k6", "sanzhar|Жюри попросило рецепт. Бабушкин рецепт! Я чуть не расплакался прямо на сцене.": "sanzhar_k7", "sanzhar|Брат, тише. Я и так на взводе.": "sanzhar_k8", "sanzhar|Брат, это так весело, что я забыл про тесто!": "sanzhar_k9", "sanzhar|Лучший вечер! Завтра принесу тебе булку.": "sanzhar_k10", "sanzhar|Было здорово!": "sanzhar_k11", "lucas|Тут поле. И одна курица. Я не шучу. Где я?": "lucas_k1", "lucas|Я дома! Ты спас иностранца из корейского поля. Я нарисую тебе медаль.": "lucas_k2", "lucas|Ты приехал за мной в два ночи. Во Франции так делают только лучшие друзья. Здесь, видимо, тоже.": "lucas_k3", "lucas|Хорошо. Буду ждать с курицей. Мы уже подружились.": "lucas_k4", "lucas|Покажи мне свой Сеул. Без музеев. С тем, что любишь ты.": "lucas_k5", "lucas|Тётушка накормила нас и не взяла денег, потому что я «худой француз». Это на карту!": "lucas_k6", "lucas|Самая красивая точка Сеула — над комнатой 413. Кто бы мог подумать.": "lucas_k7", "lucas|Красиво. Но это есть в путеводителе.": "lucas_k8", "lucas|Formidable! Лучший вечер в Сеуле.": "lucas_k9", "lucas|Ты хороший друг. Во Франции бы сказали — «копэн».": "lucas_k10", "lucas|Хорошо. Мне понравилось.": "lucas_k11", "junso|Выбирай пионы по запаху, а не по цвету. И не торгуйся с бабушкой Ли, она всё равно победит.": "junso_k1", "junso|Ты сбил цену на тысячу вон! Бабушка Ли сказала, что ты хороший мальчик. Это высшая награда.": "junso_k2", "junso|Ты молчишь, как цветы. Мне с тобой спокойно.": "junso_k3", "junso|Ты спал час. Тюльпаны не против. Я тоже.": "junso_k4", "junso|Я знаю всё про цветы. Но не знаю, как говорить с двенадцатью людьми.": "junso_k5", "junso|Ты спрашивал, я отвечал, и они слушали. Будто я говорил с тобой одним.": "junso_k6", "junso|Я начал с ромашки и не заметил, как прошёл час. Все записались на следующий.": "junso_k7", "junso|Спасибо… Но это была моя лавка. Я хотел сам.": "junso_k8", "junso|Тихий хороший вечер. Как полив на закате.": "junso_k9", "junso|Угу. Было хорошо.": "junso_k10", "junso|Это… слишком резко для меня.": "junso_k11", "wei|Главное — уважать перец. Перец чувствует неуважение.": "wei_k1", "wei|Острота идеальная! Мама сказала бы: «Этот парень готов к Чэнду».": "wei_k2", "wei|Ничья! Мы оба плачем и смеёмся. Это и есть хого.": "wei_k3", "wei|Брат… Вся общага кашляет. Охранник пришёл с огнетушителем.": "wei_k4", "wei|Брат, покажем им, как танцуют в Сеуле. Восемь тактов. Ты знаешь их.": "wei_k5", "wei|Они орут в телефон! Капитан сказал: «Теперь у тебя две команды». И одна из них — ты.": "wei_k6", "wei|Ты выучил «привет» по-сычуаньски. Они тебя уже обожают.": "wei_k7", "wei|Отличный ракурс. Но в следующий раз танцуешь ты.": "wei_k8", "wei|Ха! Огонь! Брат, ты лучший.": "wei_k9", "wei|Вот это настрой! Ещё раз в пятницу?": "wei_k10", "wei|Окей, было неплохо.": "wei_k11", "wei|Ой, слишком серьёзно. Давай попроще.": "wei_k12"});

/* ================= v1.23: settings, save transfer, ending hints, album, lanterns, trips, friendship, dorm stories ================= */

/* ---------- iPhone / PWA audio fallback ---------- */
const AAC_MODE=!!window.PWA&&(()=>{try{return !new Audio().canPlayType('audio/webm; codecs="opus"')}catch(e){return false}})();

/* ---------- settings ---------- */
const SET_KEY='vesna90-set';
function getSet(){try{return Object.assign({fs:1,spd:'norm',theme:'auto',mus:1,vo:1},JSON.parse(localStorage.getItem(SET_KEY)||'{}'))}catch(e){return {fs:1,spd:'norm',theme:'auto',mus:1,vo:1}}}
function applySet(){const s=getSet();const r=document.documentElement;
  r.style.setProperty('--fs',s.fs);
  window.__tspd=s.spd==='fast'?5:2;window.__noType=s.spd==='inst';
  if(s.theme==='auto')delete r.dataset.theme;else r.dataset.theme=s.theme;
  window.__mvol=s.mus;window.__vvol=s.vo;try{MUS.setVol&&MUS.setVol(s.mus)}catch(e){}}
function saveSet(p){try{localStorage.setItem(SET_KEY,JSON.stringify(Object.assign(getSet(),p)))}catch(e){}applySet()}
applySet();
function modal(title,sub,body,onMount){return new Promise(res=>{const w=document.createElement('div');w.className='pnwrap';w.setAttribute('role','dialog');w.setAttribute('aria-label',title);
  w.innerHTML=`<div class="pn"><div class="pnh"><div><small>${esc(sub)}</small><b>${esc(title)}</b></div><button type="button" class="pnx" aria-label="Закрыть">✕</button></div><div class="pnb">${body}</div><button type="button" class="pnok">Готово</button></div>`;
  document.body.appendChild(w);const prev=window.appBack;const close=()=>{w.remove();window.appBack=prev;res()};window.appBack=()=>{close();return true};
  w.querySelector('.pnx').onclick=close;w.querySelector('.pnok').onclick=close;w.addEventListener('click',e=>{if(e.target===w)close()});
  if(onMount)onMount(w,close)})}
function showSettings(){const s=getSet();
  const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button type="button" data-v="${v}" class="${String(s[k])===String(v)?'on':''}">${t}</button>`).join('')}</div>`;
  const body=`<div class="setl">
   <label>Размер текста</label>${seg('fs',[[0.9,'Мелкий'],[1,'Обычный'],[1.15,'Крупный'],[1.3,'Очень крупный']])}
   <label>Скорость текста</label>${seg('spd',[['norm','Обычная'],['fast','Быстрая'],['inst','Сразу']])}
   <label>Тема</label>${seg('theme',[['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']])}
   <label>Громкость музыки <em data-o="mus">${Math.round(s.mus*100)}%</em></label><input type="range" min="0" max="100" value="${Math.round(s.mus*100)}" data-r="mus">
   <label>Громкость голосов <em data-o="vo">${Math.round(s.vo*100)}%</em></label><input type="range" min="0" max="100" value="${Math.round(s.vo*100)}" data-r="vo">
   <p class="ptip">Звук целиком включается и выключается кнопкой в углу сцены.</p></div>`;
  return modal('Настройки','Удобство',body,w=>{
    w.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=g.dataset.k;let v=b.dataset.v;if(k==='fs')v=+v;saveSet({[k]:v});g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}));
    w.querySelectorAll('[data-r]').forEach(r=>r.oninput=()=>{const k=r.dataset.r;const v=r.value/100;saveSet({[k]:v});w.querySelector(`[data-o="${k}"]`).textContent=r.value+'%'})})}

/* ---------- save transfer ---------- */
async function packCode(obj){const txt=JSON.stringify(obj);try{if(window.CompressionStream){const cs=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return 'V90Z:'+btoa(s)}}catch(e){}
  return 'V90J:'+btoa(unescape(encodeURIComponent(txt)))}
async function unpackCode(code){code=String(code).trim().replace(/\s+/g,'');
  if(code.startsWith('V90Z:')){const bin=atob(code.slice(5));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
  if(code.startsWith('V90J:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
  throw new Error('bad')}

  const sl=[1,2,3].map(n=>{try{return JSON.parse(localStorage.getItem(slotKey(n))||'null')}catch(e){return null}});

   <h3 class="trh">Сохранить</h3><div class="trs">${sl.map((s,i)=>`<button type="button" class="trb" data-exp="${i+1}" ${s&&s.day?'':'disabled'}>Слот ${i+1}${s&&s.day?`: ${esc(s.name)}, ${esc(dateOf(s.day))}`:': пусто'}</button>`).join('')}</div>
   <textarea class="trt" id="trOut" readonly placeholder="Здесь появится код"></textarea><button type="button" class="trb alt" id="trCopy" disabled>Скопировать код</button>
   <h3 class="trh">Загрузить</h3><textarea class="trt" id="trIn" placeholder="Вставь код сюда"></textarea>
   <div class="trs">${[1,2,3].map(n=>`<button type="button" class="trb" data-imp="${n}">В слот ${n}</button>`).join('')}</div><p class="ptip" id="trMsg"></p>`;
  return modal('Перенос сохранений','Между устройствами',body,w=>{
    const out=w.querySelector('#trOut'),cp=w.querySelector('#trCopy'),msg=w.querySelector('#trMsg');
    w.querySelectorAll('[data-exp]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.exp;out.value='…';out.value=await packCode({v:VER,s:sl[n-1],m:loadMeta()});cp.disabled=false;out.select()});
    cp.onclick=async()=>{try{await navigator.clipboard.writeText(out.value);cp.textContent='Скопировано ✓'}catch(e){out.focus();out.select();try{document.execCommand('copy');cp.textContent='Скопировано ✓'}catch(e2){cp.textContent='Выдели код и скопируй вручную'}}};
    w.querySelectorAll('[data-imp]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.imp;try{const d=await unpackCode(w.querySelector('#trIn').value);if(!d||!d.s||!d.s.day)throw 0;
      if(sl[n-1]&&sl[n-1].day&&!confirmOverwrite(b))return;
      localStorage.setItem(slotKey(n),JSON.stringify(d.s));
      if(d.m){const m=loadMeta();for(const k of ['cg','endings','ach','words'])m[k]=Object.assign({},m[k]||{},d.m[k]||{});m.runs=Math.max(m.runs||0,d.m.runs||0);if(d.m.card)m.card=1;saveMeta(m)}
      msg.textContent=`Готово! Весна «${d.s.name}» загружена в слот ${n}. Выбери этот слот на главном экране.`;msg.style.color='var(--good)'}catch(e){msg.textContent='Код не подошёл. Проверь, что он скопирован целиком.';msg.style.color='var(--bad)'}})})}

const ARC_GAP=5,CONF_DAY=30,FR_GAP=4;
const dayWord=n=>n%10===1&&n%100!==11?'день':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'дня':'дней';
function arcWaitDays(id){const r=S.rel[id];if(!r||r.arc===0)return 0;let w=ARC_GAP-(S.day-(r.arcDay||-99));if(r.arc===4)w=Math.max(w,CONF_DAY-S.day);return Math.max(0,w)}
function arcReady(id){const r=S.rel[id];return r.arcDay!==S.day&&arcWaitDays(id)<=0}
function arcWait(id){const n=arcWaitDays(id);return n>0?`нужно время: ещё ${n} ${dayWord(n)}`:'доступно: поговори'}
function frWaitDays(id){const a=(S.farc&&S.farc[id])||0;if(!a)return 0;const d=(S.farcD&&S.farcD[id]);if(d==null)return 0;return Math.max(0,FR_GAP-(S.day-d))}
function frArcReady(id){return frWaitDays(id)<=0}
function frArcWait(id){const n=frWaitDays(id);return n>0?`нужно время: ещё ${n} ${dayWord(n)}`:'доступно: поговори'}
// Daily soft cap: after +10 in one day with the same person, further gains count only a third.
const DAY_CAP=10;
function capGain(kind,id,n){if(!(n>0)||!S)return n;S.gain=S.gain||{};const k=kind+':'+id;const g=S.gain[k]&&S.gain[k].d===S.day?S.gain[k]:(S.gain[k]={d:S.day,s:0});
  const room=Math.max(0,DAY_CAP-g.s);const full=Math.min(n,room);const rest=n-full;const out=full+(rest>0?Math.max(1,Math.round(rest/3)):0);g.s+=out;return out}

function groupActs(key,list){const G=LOC_GROUPS[key];if(!G)return list;const used=new Set();const out=[];
  for(const a of list){const gi=G.findIndex(g=>g.ts.some(t=>a.t.startsWith(t)));if(gi<0){out.push(a);continue}
    if(used.has(gi))continue;used.add(gi);const members=list.filter(b=>G[gi].ts.some(t=>b.t.startsWith(t))&&!actAvail(b).hide);if(!members.length)continue;
    if(members.length<2){out.push(...members);continue}
    const grp={t:G[gi].g+' ›',h:G[gi].h,free:1,run:async()=>{grp.free=1;
      const av=members.map(b=>({b,v:actAvail(b)})).filter(x=>!x.v.hide);
      const i=await ask(G[gi].g+'.',[...av.map(({b,v})=>({t:b.t,h:actHint(b),dis:v.dis,why:v.why})),{t:'Назад',cls:'back'}],{who:null});
      if(i>=av.length)return;const b=av[i].b;if(b.money){window.__mtag=b.t;money(-b.money);window.__mtag=null}if(b.e)S.energy-=b.e;await b.run();grp.free=!!b.free}};
    out.push(grp)}

shop=async function(){

    const cats=[{k:'cons',t:'Кофе и энергетики',h:'быстро вернуть силы'},{k:'gift',t:'Подарки',h:'для друзей и не только'},

    const c=await ask(`Торговый центр. На карте ${fmt(S.money)}. Что смотрим?`,[...cats,{t:'Хватит покупок',cls:'back'}],{who:null,scroll:false});
    if(c===cats.length)return;const K=cats[c].k;
    for(;;){
      let opts=[];
      if(K==='cons')opts=[{t:'Кофе с собой',h:'4 500 ₩ · +2 энергии',k:'c:coffee',p:900},{t:'Энергетик',h:'7 500 ₩ · +4 энергии, настроение −5',k:'c:drink',p:1500}];
      else if(K==='gift')opts=Object.keys(GIFTS).filter(k=>GIFTS[k].p>0).map(k=>({t:GIFTS[k].n,h:`${fmt(GIFTS[k].p)}${S.gifts[k]?` · в сумке: ${S.gifts[k]}`:''}`,k:'g:'+k,p:GIFTS[k].p}));
      else{const sl=K.slice(2);opts=Object.keys(ITEMS).filter(id=>!S.owned.includes(id)&&ITEMS[id].slot===sl).sort((a,b)=>ITEMS[a].p-ITEMS[b].p).map(id=>({t:ITEMS[id].n,h:`${fmt(ITEMS[id].p)} · ${ITEMS[id].d}`,k:'i:'+id,p:ITEMS[id].p}))}
      if(!opts.length)break;
      opts.forEach(o=>{o.dis=S.money<o.p;o.why='Не хватает денег'});
      const i=await ask(`${cats[c].t}. На карте ${fmt(S.money)}.`,opts.concat([{t:'Назад',cls:'back'}]),{who:null,scroll:false});

      else{S.owned.push(k);if(!S.equip[ITEMS[k].slot])S.equip[ITEMS[k].slot]=k;chip(`Куплено: ${ITEMS[k].n}`,'pos');break}
    }

};

/* ================= v1.33: short transfer codes that fit in one message, tolerant import ================= */
// The code is gzip packed into CJK characters (14 bits per character, U+4E00..U+8DFF): about 3.5 times shorter than base64,
// so a whole spring fits into one Telegram message. On import every character outside that range is ignored,
// so chat headers like "[15.10.2026 19:12] Имя:", spaces and line breaks do no harm.
const H14=0x4E00;
function enc14(u8){const n=u8.length;let out=String.fromCharCode(H14+(n>>>14&0x3FFF),H14+(n&0x3FFF)),acc=0,bits=0;
  for(let i=0;i<n;i++){acc=(acc<<8|u8[i])&0x3FFFFF;bits+=8;if(bits>=14){bits-=14;out+=String.fromCharCode(H14+(acc>>>bits&0x3FFF))}}
  if(bits>0)out+=String.fromCharCode(H14+(acc<<(14-bits)&0x3FFF));return out}
function dec14(s){const v=[];for(const ch of s){const c=ch.charCodeAt(0)-H14;if(c>=0&&c<0x4000)v.push(c)}
  if(v.length<3)throw new Error('short');const n=v[0]<<14|v[1];const u=new Uint8Array(n);let acc=0,bits=0,j=0;
  for(let i=2;i<v.length&&j<n;i++){acc=(acc<<14|v[i])&0x3FFFFFF;bits+=14;while(bits>=8&&j<n){bits-=8;u[j++]=acc>>>bits&0xFF}}
  if(j<n)throw new Error('cut');return u}
async function gzipU8(u8,mode){const s=new Blob([u8]).stream().pipeThrough(mode==='d'?new DecompressionStream('gzip'):new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
// Lighter save for transfer: weather is rebuilt from its seed, only recent chat and diary lines travel.
const SLIM=[[5,20,20],[2,8,8],[1,3,3]];
function slimSave(s,lv){if(!s)return s;const [m,d,w]=SLIM[lv||0];const o=JSON.parse(JSON.stringify(s));delete o.wx;delete o.pres;
  if(o.msgs)for(const k of Object.keys(o.msgs))o.msgs[k]=o.msgs[k].slice(-m);
  if(o.diary)o.diary=o.diary.slice(-d);if(o.wal)o.wal=o.wal.slice(-w);return o}
{const _pc=packCode;packCode=async function(obj){try{if(window.CompressionStream&&window.DecompressionStream&&obj&&obj.s){let c='';for(let lv=0;lv<SLIM.length;lv++){const o=Object.assign({},obj,{s:slimSave(obj.s,lv)});
  c='V90H:'+enc14(await gzipU8(new TextEncoder().encode(JSON.stringify(o))));if(c.length<=4000)break}return c}}catch(e){}return _pc.apply(this,arguments)}}

// ---- old base64 codes: strip chat headers, and repair a character lost where a messenger split a long message ----
const B64A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const CHAT_HDR=/\[\s*\d{1,2}[./]\d{1,2}[./]\d{2,4}[ ,]+\d{1,2}:\d{2}(?::\d{2})?\s*\][^:\n]{0,60}:|\d{1,2}[./]\d{1,2}[./]\d{2,4},? \d{1,2}:\d{2}(?: [AP]M)? - [^:\n]{0,60}:/g;
const b64u8=b=>{const t=atob(b);const u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
async function inflProgress(u8){// how many bytes inflate before the stream breaks
  const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();const r=ds.readable.getReader();let n=0,ok=false;
  const feed=(async()=>{try{for(let i=0;i<u8.length;i+=48)await w.write(u8.subarray(i,i+48));await w.close()}catch(e){}})();
  try{for(;;){const {done,value}=await r.read();if(done){ok=true;break}n+=value.length}}catch(e){}
  try{await feed}catch(e){}return [n,ok]}
async function tryB64(b){try{const u=b64u8(b+'='.repeat((4-b.length%4)%4));const t=new TextDecoder().decode(await gzipU8(u,'d'));const d=JSON.parse(t);return d&&d.s?d:null}catch(e){return null}}
async function repairB64(parts){// parts: pieces of base64 as separate messages; one char may be missing at each join
  const joins=parts.length-1;if(joins<1||joins>3)return null;
  async function rec(pre,k){const rest=parts.slice(k+1).join('');
    if(k===joins-1){for(const c of ['',...B64A]){const d=await tryB64(pre+c+rest);if(d)return d}return null}
    const sc=[];for(const c of ['',...B64A]){const s=pre+c+rest;const [n]=await inflProgress(b64u8(s.slice(0,s.length>>2<<2)));sc.push([n,c])}
    sc.sort((x,y)=>y[0]-x[0]);for(const [,c] of sc.slice(0,10)){const d=await rec(pre+c+parts[k+1],k+1);if(d)return d}return null}
  return rec(parts[0],0)}
{const _uc=unpackCode;unpackCode=async function(code){code=String(code||'');
  const cjk=(code.match(/[\u4E00-\u8DFF]/g)||[]).length;
  if(code.includes('V90H')||cjk>20){const p=code.indexOf('V90H');const u=dec14(p>=0?code.slice(p+4):code);return JSON.parse(new TextDecoder().decode(await gzipU8(u,'d')))}
  const i=code.indexOf('V90');if(i>0)code=code.slice(i);
  const parts=code.split(CHAT_HDR).map(p=>p.replace(/\s+/g,'')).filter(Boolean);
  const flat=parts.join('');
  try{return await _uc.call(this,flat)}catch(e){
    if(flat.startsWith('V90Z:')&&window.DecompressionStream){parts[0]=parts[0].replace(/^V90Z:/,'');const d=await repairB64(parts.map(p=>p.replace(/[^A-Za-z0-9+/]/g,'')));if(d)return d}
    throw e}}}

// ---------- which scene is playing ----------
const ARR_KEY=new Map();
function indexArrs(){
  for(const id of Object.keys(ROM)){if(ROM[id].intro)ARR_KEY.set(ROM[id].intro,id+'|intro');(ROM[id].arcs||[]).forEach((a,i)=>ARR_KEY.set(a,id+'|arc'+(i+1)));
    [CHEV,typeof CHEV2!=='undefined'?CHEV2:{},typeof CHEV3!=='undefined'?CHEV3:{}].forEach((E,i)=>{if(E&&E[id]&&E[id].steps)ARR_KEY.set(E[id].steps,id+'|ev'+(i+1))})}
  for(const id of Object.keys(FRIEND))(FRIEND[id].arcs||[]).forEach((a,i)=>ARR_KEY.set(a,id+'|farc'+(i+1)))}

// ---------- every story choice is shuffled and remembered ----------
{const _st=steps;steps=async function(id,arr){if(!Array.isArray(arr))return _st.apply(this,arguments);
  if(!ARR_KEY.has(arr))indexArrs();const key=ARR_KEY.get(arr);
  const RW=(key&&typeof REW!=='undefined'&&REW[key])||null;let nN=0,nQ=0;
  const cs=[];const copy=arr.map(s=>{if(s[0]==='n'){const t=RW&&RW['N'+nN];nN++;return t?['n',t]:s}
    if(s[0]==='c'&&Array.isArray(s[2])){const q=nQ++;const sh=s[2].length>1?shuffle(s[2].slice()):s[2].slice();const c=[s[0],s[1],sh,...s.slice(3)];cs.push({q:s[1],orig:s[2],shown:sh,nq:RW&&RW['Q'+q],no:RW&&RW['O'+q]});return c}return s});
  const prev=window.__stK;window.__stK=key?{key,cs,n:0}:null;
  try{return await _st.call(this,id,copy)}finally{window.__stK=prev}}}

  if(K&&K.n<K.cs.length&&K.cs[K.n].q===text){const c=K.cs[K.n],n=K.n++;
    if(c.nq)text=c.nq;if(c.no&&Array.isArray(opts))opts=opts.map((x,i)=>{const oi=c.orig.indexOf(c.shown[i]);return oi>=0&&c.no[oi]?Object.assign({},x,{t:c.no[oi]}):x});
    return _ask.call(this,text,opts,o).then(i=>{try{const oi=c.orig.indexOf(c.shown[i]);if(oi>=0){S.ch=S.ch||{};S.ch[K.key+'.'+n]=oi}}catch(e){}return i})}
  return _ask.apply(this,arguments)}}

// ---------- runner for new (unvoiced) scenes ----------
// steps: ['n',text] narration · [exp,text] character line · ['me',text] hero line · ['say',who,exp,text] someone else
// ['bg',key,tod] · ['if',fn,stepsA,stepsB] · ['set',k,v] · ['mood',n] · ['fn',fn] · ['c',question,[{t,h,d,e,r,set,st,m,then,if}]]
async function runBeat(id,arr){for(const s of arr||[]){const t=s[0];
  if(t==='n')await narr(s[1]);
  else if(t==='bg')setScene(s[1],s[2]||'eve');
  else if(t==='if'){const b=s[1]()?s[2]:s[3];if(b)await runBeat(id,b)}
  else if(t==='set')setSF(id,s[1],s[2]);
  else if(t==='mood')mood(s[1]);
  else if(t==='fn')await s[1]();
  else if(t==='me')await say(s[1],ME(),s[2]||'n');
  else if(t==='say')await line(s[1],s[2],s[3]);
  else if(t==='c'){const os=shuffle(s[2].filter(o=>!o.if||o.if()));
    const i=await ask(s[1],os.map(o=>({t:o.t,h:o.h})),{who:id,exp:'n'});const o=os[i];
    if(o.d){if(S.rel&&S.rel[id])aff(id,o.d);else fr(id,Math.round(o.d*0.7))}
    if(o.set)for(const [k,v] of Object.entries(o.set))setSF(id,k,v);
    if(o.st)stat(o.st,2);if(o.m)mood(o.m);
    if(o.r)await line(id,o.e||'h',o.r);if(o.then)await runBeat(id,o.then)}
  else await line(id,t,s[1])}}

'lilia|arc3':{N0:'Открытый микрофон. Чэвон объявляют следующей. За кулисами у неё трясутся руки так, что стучит браслет.',Q0:'Ведущий второй раз называет её имя.',O0:['«Играй для одного человека. Для меня»','Встать рядом и держать её за руку','Предложить уйти, пока не поздно']},
'lilia|arc4':{N0:'Чэвон говорит ровным голосом, будто читает прогноз погоды: летом семья переезжает в Пусан. И, может быть, она бросит музыку.',Q0:'Синтезатор выключен. В студии непривычно тихо.',O0:['«Я буду приезжать на твои концерты»','«В Пусане тоже есть сцены. Не бросай»','Промолчать']},
'lilia|arc5':{N0:'После последнего сеанса вы сидите на ступеньках кинотеатра. Чэвон крутит в пальцах медиатор, хотя играет не на гитаре.',Q0:'Чэвон не поднимает глаз. Медиатор замер.'},
'lilia|ev1':{N0:'Студия в неоновом свете. Чэвон нажимает «плей». Музыка медленная, как дыхание спящего.',Q0:'Трек доигрывает до места, где должен вступать голос. Тишина.',O0:['Помочь с текстом на английском','Предложить ускорить бит','Сказать, что голос здесь лишний']},
'lilia|ev2':{N0:'Студия в полумраке, мигают индикаторы пульта. Чэвон снимает наушники и протягивает их тебе.',Q0:'Припев звучит в третий раз.',O0:['Предложить переписать мелодию припева','Помочь с английским текстом','Честно сказать, что пока звучит пусто']},
'lilia|ev3':{N0:'За кулисами душно и темно. Чэвон сжимает микрофон, у неё дрожат пальцы.',Q0:'Со сцены машут: пора.',O0:['Держать её за руку до самого выхода','Пообещать смотреть только на неё','Рассмешить её глупой шуткой']},
/* ---------- Джиху ---------- */
'arman|arc1':{N0:'Твой ноутбук зависает посреди курсовой. Джиху молча забирает его, что-то быстро набирает — и всё работает. Даже то, что раньше не работало.',Q0:'Джиху возвращает ноутбук и смотрит в пол.',O0:['Попросить научить так же','Купить ему кофе в благодарность','Подколоть: «Ну и зануда»']},
'arman|arc2':{N0:'Джиху показывает приложение: огромные кнопки, яркие цвета, ничего лишнего.',N1:'«Это для бабушки. Она путает таблетки. Тут напоминания голосом. Моим голосом».',Q0:'Приложение говорит: «Бабушка, пора принять таблетку». Голосом Джиху.',O0:['«Это самое доброе приложение на свете»','Предложить дать его бабушкиным подругам','Найти три бага подряд, раз уж он просил']},
'arman|arc3':{N0:'Ночь хакатона. До сдачи шесть часов, код не собирается. Джиху смотрит в одну строчку, не моргая.',Q0:'На экране мигает красная ошибка.',O0:['Сесть рядом и проверять каждую строчку','Принести еду и заставить поесть','Сказать, что пора остановиться и поспать']},
'arman|arc4':{N0:'Джиху пришло письмо от крупной компании: они хотят купить приложение и сделать его платным.',Q0:'Джиху держит курсор над кнопкой «Ответить».',O0:['«Не продавай. Ищи социальный грант»','«Продай, но с бесплатной версией»','«Бери деньги. Ты заслужил»']},
'arman|arc5':{N0:'Крыша общаги. Джиху собрал телескоп сам и уже полчаса настраивает его, хотя всё давно настроено.',Q0:'Джиху перестаёт крутить колёсико телескопа.'},
'arman|ev1':{N0:'Три ноутбука, банки энергетиков, гирлянда из стикеров. Джиху почти подпрыгивает перед экраном.',Q0:'Джиху нажимает на кнопку. Приложение падает.',O0:['Искать баг вместе','Приготовить ему нормальный ужин вместо энергетиков','Уснуть у него на плече']},
'arman|ev2':{N0:'Ночной коворкинг, пустые банки, мерцает экран. Джиху смотрит в код, не моргая уже минут десять.',Q0:'До демо двенадцать часов.',O0:['Протестировать приложение, нажимая всё подряд','Уложить его поспать на час','Нарисовать красивые иконки']},
'arman|ev3':{N0:'Крыша, телескоп на штативе, два пледа. Джиху смотрит не на небо, а на тебя.',Q0:'В небе вспыхивает первый метеор.',O0:['Загадать желание вслух','Попросить объяснить, откуда берутся метеоры','Положить голову ему на плечо']},
/* ---------- Тэян ---------- */
'timur|arc1':{N0:'Вы играете один на один. Тэян комментирует каждый твой бросок, как спортивный диктор финала.',Q0:'«Мяч у претендентки! Зал замер!» — орёт Тэян.',O0:['Играть всерьёз и обыграть его','Смеяться над его комментариями','Бросить мяч: «Мне скучно»']},
'timur|arc2':{N0:'Тэян засыпает прямо на скамейке у площадки. Из рюкзака торчит светоотражающий жилет грузчика.',Q0:'Тэян застёгивает рюкзак, чтобы жилета не было видно.',O0:['Пообещать молчать и спросить, чем помочь','Принести кофе и бутерброд','Посоветовать бросить баскетбол и выспаться']},
'timur|arc3':{N0:'В выходной ты заходишь в магазин родителей Тэяна. Покупателей нет. Его мама угощает тебя чаем и смотрит так, будто всё про вас уже поняла.',Q0:'Мама Тэяна подливает чай и тяжело вздыхает, глядя на пустой прилавок.',O0:['Завести магазину страницу в соцсетях','Помочь разобрать товар на складе','Тихо допить чай и не вмешиваться']},
'timur|arc4':{N0:'Тэян проиграл важный матч — выдохся после ночной смены. Сидит один на трибуне. Улыбки нет.',Q0:'Тэян даже не поднимает голову, когда ты садишься рядом.',O0:['«Ты был лучшим на площадке. Я видела»','Сесть рядом и помолчать','«Это просто игра»']},
'timur|arc5':{N0:'Вечером вы гуляете по набережной. Тэян непривычно молчит уже четыреста метров.',Q0:'Тэян останавливается у перил и не знает, куда деть руки.'},
'timur|ev1':{N0:'Сумерки, фонари над площадкой. Тэян протягивает тебе мяч и ухмыляется.',Q0:'Тэян встаёт в защиту и раскидывает руки.',O0:['Играть в полную силу','Отвлекать его разговорами','Сесть на лавку и болеть']},
'timur|ev2':{N0:'Площадка под фонарём, мяч стучит по асфальту. Тэян стоит под кольцом и бросает тебе мяч.',Q0:'Подходят ребята с соседней площадки: два на два?',O0:['Играть всерьёз и бросать трёхочковые','Отвлекать соперников шутками','Сесть на скамейку и болеть']},
'timur|ev3':{N0:'Тэян сидит в общаге с ногой на подушке и смотрит запись матча, который не сыграет.',Q0:'На экране его команда забивает. Без него.',O0:['Составить план восстановления вместе','Сказать, что он больше, чем баскетбол','Устроить вечер фильмов про спорт']},
/* ---------- Хёну ---------- */
'daniyar|arc1':{N0:'Перед репетицией у Хёну лопается струна. Он ругается сквозь зубы — на юридическом языке, длинно и витиевато.',Q0:'До начала пять минут. Запасной струны нет.',O0:['Помочь натянуть новую','«Сыграешь и на пяти»','Пошутить про знак свыше']},
'daniyar|arc2':{N0:'Хёну показывает сообщение от отца: «Сессия по праву важнее твоих концертов». Без точки в конце. Отец никогда не ставит точек.',Q0:'Хёну блокирует экран и кладёт телефон экраном вниз.',O0:['«Играй. Я буду в первом ряду»','Предложить совмещать','Признать, что отец по-своему прав']},
'daniyar|arc3':{N0:'Концерт в маленьком баре. Перед последней песней Хёну смотрит прямо на тебя.',N1:'«Эта — новая. Пока без названия».',Q0:'Последний аккорд. Свет гаснет.',O0:['После концерта предложить название','Просто улыбнуться ему со своего места','Уйти до конца — завтра контрольная']},
'daniyar|arc4':{N0:'Хёну держит телефон с заявлением о переводе в музыкальный колледж. Палец над кнопкой «Отправить» уже минуту.',Q0:'Экран телефона гаснет. Хёну снова его включает.',O0:['Предложить сначала вместе поговорить с отцом','Сказать, что поддержишь любое его решение','Нажать «отправить» за него']},
'daniyar|arc5':{N0:'После концерта вы сидите на крыше. Город светится внизу, гитара лежит между вами.',Q0:'Хёну перебирает струны без звука.'},
'daniyar|ev1':{N0:'Пустой клуб, один прожектор. Хёну стоит с гитарой и смотрит только на тебя.',N1:'Он играет песню, которую ты раньше не слышала. Слишком тихую для рок-группы.',Q0:'Последний аккорд гаснет. Хёну ждёт.',O0:['Подпеть вторым голосом в припеве','Посоветовать образ для сцены','Просто аплодировать']},
'daniyar|ev2':{N0:'Крыша дома в Хондэ, гирлянды, гости сидят на подушках. Хёну настраивает гитару и ищет тебя взглядом.',Q0:'Первые аккорды новой песни. Гости затихают.',O0:['Подпевать припев, который он тебе показывал','Снимать выступление для его группы','Слушать с закрытыми глазами']},
'daniyar|ev3':{N0:'Пустая репетиционная. Хёну сидит на усилителе. Рядом лежит контракт с лейблом, не подписанный.',Q0:'Хёну подвигает контракт к тебе.',O0:['«Пой своё. Те, кто нужен, услышат»','Помочь составить лейблу встречное предложение','Попросить сыграть самую свою песню']},
/* ---------- Доюн ---------- */
'sanzhar|arc1':{N0:'Доюн экспериментирует с рецептом и просит тебя стать дегустатором. Булочка зелёная. Он говорит, что так задумано.',Q0:'Доюн смотрит, как ты откусываешь, и не дышит.',O0:['Съесть всё с улыбкой','Честно сказать, что пересолено','Отказаться: зелёный хлеб — это слишком']},
'sanzhar|arc2':{N0:'Доюн обжёг руку о противень и прячет её за спиной, улыбаясь чуть шире, чем нужно.',Q0:'На полу у его ног — уроненная прихватка.',O0:['Перевязать и отругать','Подуть на ожог','«До свадьбы заживёт»']},
'sanzhar|arc3':{N0:'Доюна позвали печь на кулинарный конкурс весеннего фестиваля. Он уже напечатал письмо с отказом и держит палец над кнопкой.',Q0:'Палец над кнопкой «Отправить».',O0:['Пойти с ним помощницей','«Твои круассаны лучшие в городе»','Согласиться: там будут профессионалы']},
'sanzhar|arc4':{N0:'Доюн показывает объявление: в старом квартале Ыльчиро сдаётся крохотное помещение под пекарню. Он уже сфотографировал витрину со всех сторон.',Q0:'Доюн держит телефон с номером арендодателя.',O0:['«Получится. Я буду первой покупательницей»','Начать с продаж через соцсети','Отговорить: слишком рискованно']},
'sanzhar|arc5':{N0:'Доюн принёс на набережную корзинку. Внутри — пирожное в форме сердца, чуть кривое с одного бока.',Q0:'Доюн держит корзинку обеими руками, как будто она может убежать.'},
'sanzhar|ev1':{N0:'Пекарня, мука в воздухе, тёплый свет. У Доюна мука на щеке и противень румяного хлеба в руках.',Q0:'Ярмарка завтра в восемь. Работы — до полуночи.',O0:['Раскатать тесто самой','Подписывать ценники для ярмарки','Съесть половину противня']},
'sanzhar|ev2':{N0:'Пекарня закрыта, но внутри горит свет. Доюн выстроил на столе семь странных булочек.',Q0:'Доюн вручает тебе нож для дегустации.',O0:['Придумать свой рецепт вместе','Честно оценить каждую булочку','Нарисовать этикетки для новинок']},
'sanzhar|ev3':{N0:'Пекарня, тишина, на столе старая тетрадь с рецептами. Почерк бабушки, масляные пятна, засушенный листик мяты между страницами.',Q0:'Доюн открывает тетрадь на странице с загнутым уголком.',O0:['Испечь торт строго по тетради вместе','Попросить рассказать про бабушку','Написать в тетради новый рецепт вдвоём']},
/* ---------- Эмма ---------- */
'emma|arc1':{N0:'Эмма ловит тебя у кафетерия. В руках меню, полностью на корейском, и красное от острого лицо.',Q0:'Очередь за вами нетерпеливо вздыхает.',O0:['Прочитать меню и объяснить блюда','Заказать ей то же, что себе','Посмеяться: острое — это просто опыт']},
'emma|arc2':{N0:'Эмма раскладывает на столе проявленные снимки: рынки, переулки, бабушки с тележками.',Q0:'Эмма заряжает в камеру новую плёнку и смотрит на тебя.',O0:['В старый квартал Ыльчиро с типографиями','На крышу общаги на закате','В торговый центр: там удобно']},
'emma|arc3':{N0:'Поздний вечер. Эмма сидит на ступеньках общежития иностранцев и смотрит видео из дома, где все танцуют вокруг шеста с цветами.',Q0:'В видео все поют. Эмма выключает звук.',O0:['Устроить ей праздник: цветы, музыка, танцы','Просто сесть рядом и слушать','«Зато у нас тут кимчи»']},
'emma|arc4':{N0:'Сеульский журнал хочет опубликовать фото Эммы. Нужны подписи на корейском — к утру.',Q0:'На столе двенадцать фотографий и ни одной подписи.',O0:['Сесть и перевести подписи вместе','Найти знакомого переводчика','«Оставь как есть, с ошибками даже мило»']},
'emma|arc5':{N0:'Закат над Ханганом. Эмма опускает фотоаппарат и долго смотрит на тебя без него.',Q0:'Эмма прячет камеру в сумку. Впервые за весну.'},
'emma|ev1':{N0:'Набережная, ветер, Эмма смеётся и щёлкает затвором старой плёночной камеры.',Q0:'На плёнке остались три кадра.',O0:['Позировать ей как модель','Научить её паре фраз по-корейски для подписи','Сфотографировать её саму']},
'emma|ev2':{N0:'Рынок Кванджан шумит и пахнет жареными пирожками. Эмма снимает всё подряд и смеётся.',Q0:'Продавщица у котла подозрительно смотрит на камеру.',O0:['Договориться с продавцами о съёмке по-корейски','Попробовать всё самое странное вместе с ней','Носить за ней сумку с плёнками']},
'emma|ev3':{N0:'Маленькая галерея, белые стены, тёплый свет. Эмма подводит тебя к последней фотографии в зале.',Q0:'У снимка останавливаются посетители и смотрят то на него, то на тебя.',O0:['Сказать, что это лучшее фото на выставке','Попросить снимок себе на память','Сфотографировать её рядом со снимком']},
/* ---------- Нари ---------- */
'nari|arc1':{N0:'Нари зовёт тебя в дуэт на рейтинговую игру. Сама подтягивает твой стул ближе.',Q0:'Таймер: десять секунд до начала матча.',O0:['Играть всерьёз, по её подсказкам','Шутить в голосовом весь матч','Сдаться на десятой минуте: шансов нет']},
'nari|arc2':{N0:'Вечерний стрим. Кто-то пишет в чат гадости — много и долго. Нари делает вид, что не видит, но руки дрожат на клавиатуре.',Q0:'Сообщения в чате идут одно за другим.',O0:['Спокойно и по делу ответить в чате','Предложить ей сделать паузу','Сказать, что в интернете так всегда']},
'nari|arc3':{N0:'Нари показывает письмо: киберспортивная команда зовёт её на отбор. Офлайн, в зале, со зрителями.',Q0:'Нари трижды открывает форму ответа и трижды закрывает.',O0:['Тренироваться при публике в ПК-бане','«Ты лучшая. Пусть они тебя боятся»','Посоветовать не ходить, если так страшно']},
'nari|arc4':{N0:'Финал отборочного турнира. Последний раунд. Нари поворачивается к залу и находит тебя глазами.',Q0:'Пауза между раундами. Тридцать секунд.',O0:['Подсказать ей тактику','Кричать громче всех','Уйти до конца — нервы не выдерживают']},
'nari|arc5':{N0:'Ночь, крыша, внизу шумит город. Нари снимает наушники — впервые при тебе.',Q0:'Нари держит наушники в руках, будто не знает, куда их деть.'},
'nari|ev1':{N0:'ПК-бан, неон, финальный раунд. Нари вскидывает руки в победной позе ещё до того, как экран показывает счёт.',Q0:'Следующий раунд — решающий.',O0:['Взять последний раунд на себя','Стримить вашу игру с комментариями','Следить, чтобы она поела']},
'nari|ev2':{N0:'Маленькая комната Нари: гирлянда, плакаты, два геймпада на диване. Камера стрима выключена и отвёрнута к стене.',Q0:'Нари протягивает тебе второй геймпад и сразу передумывает. Потом протягивает снова.',O0:['Пройти с ней сложного босса','Приготовить ей ночной рамён','Попросить научить тебя играть']},

 mira:[
  {at:0,q:'Кофе или чай? Отвечай быстро, от этого зависит, какого кота я тебе нарисую.',o:[['«Кофе. Чёрный, как моя сессия»','fun','Ха! Тогда кот будет в чёрных очках. И с зачёткой.'],['«Что посоветуешь ты»','sweet','Доверяешь баристе? Это опасно и очень мило.'],['Рассказать про разницу между арабикой и робустой','smart','...Ты знаешь, что это первый урок у бариста? Ладно, ты молодец. Скучный, но молодец.']]},
  {at:15,q:'Владелец говорит, что котики на пенке — несерьёзно. Что ему ответить?',o:[['«Котики — это маркетинг. Посчитай, сколько людей приходит ради них»','smart','Хм. Посчитаю. Если цифра большая, я ему её распечатаю и повешу на дверь.'],['«Ответь котиком на его эспрессо»','fun','Ты злой гений. Завтра у него на кофе будет кот с его лицом.'],['«Серьёзное — это скучно. Ты не скучная»','sweet','...Это лучше любой рецензии. Спасибо.']]},
  {at:30,q:'Я ушла с худграфа на третьем курсе. Иногда думаю: может, надо было дотерпеть?',o:[['«Ты не сбежала. Ты выбрала себя»','sweet','Выбрала себя... Мне никто так не говорил. Только «зря ты».'],['«Хочешь вернуться? Можно и через год»','smart','Вернуться... Не знаю. Но то, что можно, уже легче.'],['«Терпеть — для чашек. Не для тебя»','fun','Для чашек! Ха. Я запомню и нарисую это на стене.']]},
  {at:45,need:()=>known('sanzhar'),q:'Доюн опять поставил круассаны прямо перед моей витриной. Люди смотрят на них, а не на котов!',o:[['«Сделайте общую витрину: кот плюс круассан»','smart','Комбо «кот и круассан»... Это же гениально. Только не говори ему, что это твоя идея.'],['«Нарисуй кота, который ест его круассан»','fun','Ха! Война котами! Он будет в ярости. Нет — он засмеётся. Он всегда смеётся.'],['«Ты просто ревнуешь к круассанам»','bold','Я? К круассанам? ...Немножко. Они пахнут лучше меня.']]},
  {at:60,q:'Если бы у меня была своя студия, что бы ты там делал{|а}?',o:[['«Сидел{|а} бы на подоконнике и смотрел{|а}, как ты рисуешь»','sweet','Подоконник будет широкий. Специально.'],['«Был{|а} бы твоим первым натурщиком»','bold','Первым и единственным. Придётся сидеть неподвижно. Часами.'],['«Мыл{|а} бы кисти и варил{|а} кофе»','fun','Ты будешь варить кофе бариста? Это наглость. Ты принят{|а}.']]}],
 dana:[
  {at:0,q:'Сколько отжиманий ты сделаешь прямо сейчас?',o:[['Упасть и начать отжиматься','bold','Пятнадцать! Неплохо. Ещё пять — и ты в моей команде.'],['«Сколько ты скажешь, тренер»','fun','Подлиза. Двадцать. И без улыбочек.'],['«Ноль. Я берегу запястья»','sweet','Беречь — это хорошо. Только не прячься за этим.']]},
  {at:15,q:'Меня в команде называют «Танк». Это обидно или круто?',o:[['«Круто. Танки не сдаются»','bold','Вот! И я так думаю. Остальные просто завидуют.'],['«Ты не танк. Ты ракета»','fun','Ракета? Ха. Надо сказать тренеру, пусть переименует.'],['«Если тебе обидно, значит обидно»','sweet','...Мне не обидно. Наверное. Ладно, немного.']]},
  {at:30,q:'Я с девяти лет на площадке. Иногда думаю: а кто я без волейбола? Не отвечай сразу.',o:[['«Человек, который не сдаётся. Это не про мяч»','bold','Не про мяч... Ты сейчас сказал{|а} то, что я хотела услышать десять лет.'],['«Давай узнаем. Сходим туда, где нет мячей»','fun','Где нет мячей? Таких мест не бывает. ...Ладно, проверим.'],['«Ты не обязана знать это прямо сейчас»','sweet','Не обязана... Звучит странно. Но легче.']]},
  {at:45,need:()=>known('timur'),q:'Тэян опять сказал, что волейбол — это «баскетбол для тех, кто боится кольца». Я его убью.',o:[['«Сыграйте один на один. В волейбол»','bold','В волейбол! На моей площадке! Ты гений. Он проиграет и будет плакать.'],['«Он шутит, потому что ты ему нравишься. Как соперник»','fun','Как соперник... Ладно. Это я принимаю.'],['«Не обращай внимания»','sweet','Не обращать? Это не про меня. Но спасибо, что пытаешься.']]},
  {at:60,q:'После сборов мне придётся уехать на всё лето. Ты будешь... ну. Отвечать на сообщения?',o:[['«Каждое утро — «Ты целая?»»','sweet','«Ты целая?» Да. Каждый раз буду отвечать «да». Обещаю.'],['«Я приеду на твой первый матч. Сам{|а}»','bold','Сам{|а}? Через всю страну? ...Буду искать тебя на трибуне.'],['«Буду слать тебе мемы про волейбол»','fun','Только хорошие! Плохие я и сама найду.']]}],
 lilia:[
  {at:0,q:'Что ты слушаешь, когда никто не видит?',o:[['«Старые баллады. Мамины»','sweet','...Мамины баллады. Это не стыдно. Это честно.'],['«Тишину. Иногда она лучше любого трека»','smart','Тишина — тоже трек. Самый сложный для сведения.'],['«Трот на полной громкости»','fun','Трот? Ты... Ладно. Это смело. Не говори мне, что ты танцуешь.']]},
  {at:15,q:'Почему все хотят, чтобы песни были весёлыми?',o:[['«Потому что грустные — про правду. А её боятся»','smart','...Да. Ты понимаешь.'],['«Мне нравятся твои грустные»','sweet','Нравятся? Правда? Не из вежливости?'],['Предложить написать одну весёлую назло всем','fun','Весёлую? Это не мой жанр. ...Может, одну. Шуточную.']]},
  {at:30,q:'Мама говорит, что музыка — это хобби. Хобби, на которое я трачу всю жизнь.',o:[['«Хобби — это то, что можно бросить. А ты можешь?»','smart','Не могу. Поэтому это не хобби. Надо сказать ей так же.'],['«Сыграй ей. Один трек. Свой»','bold','Сыграть маме? Свой? ...Ты не знаешь, о чём просишь. Но, может, ты прав{|а}.'],['«Это твоя жизнь, не её»','sweet','Моя... Да. Только не говори это при ней.']]},
  {at:45,need:()=>known('daniyar'),q:'Хёну опять занял студию в пятницу. Сидел там с гитарой четыре часа. Я слышала через стену. Он хорошо играет. Бесит.',o:[['«Предложи ему записать что-нибудь вместе»','bold','Вместе? С ним? ...Его гитара и мой бас. Хм. Это может быть интересно.'],['«Составьте расписание студии»','smart','Расписание. Таблица. Он будет в бешенстве. Мне нравится.'],['«Бесит, потому что нравится?»','fun','Что? Нет. ...Его музыка нравится. Не он. Не смотри так.']]},
  {at:60,q:'Если я уеду в Пусан, ты будешь... приезжать?',o:[['«Буду. Даже на последней электричке»','sweet','На последней... Тогда я буду встречать тебя на вокзале. Каждый раз.'],['«Я выучу все электрички наизусть»','smart','Ты построишь график. Это так в твоём стиле. Мне нравится твой стиль.'],['«А если я поеду с тобой?»','bold','С тобой? ...Не говори так, если не уверен{|а}. Потому что я соглашусь.']]}],
 emma:[
  {at:0,q:'Как по-корейски сказать «я опять заблудилась»? Мне нужно это каждый день.',o:[['Научить её фразе и произношению','smart','«Кирыль ирхоссоёё». Я запишу это на руке. Навсегда.'],['«Скажи просто — и покажи на меня»','bold','На тебя? Ты будешь моим навигатором? Ладно, ты сам{|а} предложил{|а}.'],['«Ты не заблудилась. Ты исследуешь»','fun','Исследую! Да! Я исследовательница! Мама будет гордиться.']]},
  {at:15,q:'Почему в Сеуле все так спешат? В Стокгольме мы ходим медленно. Даже на работу.',o:[['«У нас много дел и мало времени»','smart','Мало времени... А у вас есть «фика»? Перерыв на кофе с булочкой. Нужно ввести.'],['«Давай пройдёмся медленно. По-шведски»','bold','По-шведски! Самый медленный марш в истории Сеула. Пошли.'],['«Мы спешим, чтобы успеть на перерыв»','fun','Ха! Тогда я научу вас фике. Это революция.']]},
  {at:30,q:'Иногда я фотографирую, чтобы не разговаривать. Камера — как стена. Ты заметил{|а}?',o:[['«Заметил{|а}. Можно со мной без стены»','bold','Без стены... Страшно. Но я попробую. Держи камеру.'],['«Ты разговариваешь снимками. Это тоже разговор»','smart','...Ты прав{|а}. Только люди не всегда понимают мой язык.'],['«Тогда я буду позировать, а ты рассказывать»','fun','Сделка. Ты позируешь — я рассказываю. Начинаю: в восемь лет я разбила окно...']]},
  {at:45,need:()=>known('lucas'),q:'Лукас уверен, что мой корейский хуже его. Мне нужен независимый судья.',o:[['«Устроим экзамен. Я спрошу вас обоих»','smart','Экзамен! С баллами! Он проиграет. Ну, может, не проиграет.'],['«Вы оба говорите как дедушки из дорам»','fun','Как дедушки? Мы?! ...Ладно, это справедливо.'],['«Сначала вы оба мне что-нибудь скажете. Красиво»','bold','Красиво? Хм. Тогда я выиграю. У меня есть фраза. Слушай.']]},
  {at:60,q:'Если я останусь ещё на год, ты покажешь мне Сеул, которого я ещё не видела?',o:[['«Покажу. Начнём с рассвета на Намсане»','bold','Рассвет! В пять утра! Это ужасно и романтично.'],['«Мы найдём то, чего не видел никто. Даже я»','smart','Даже ты? Это вызов. Камера уже заряжена.'],['«Сеул без тебя — я и сам{|а} его не видел{|а}»','sweet','...Ты сказал{|а} это так, что я сейчас заплачу. Подожди, я сфотографирую закат, чтобы не плакать.']]}],
 nari:[
  {at:0,q:'Какая у тебя любимая игра? Это важный вопрос. От него зависит наша дружба.',o:[['«Тетрис. Классика»','smart','Тетрис?! Ты из тех, кто складывает всё ровно. Я так и думала.'],['«Та, где ты меня обыграешь»','fun','Ха! Тогда — любая. Готовь рамён.'],['«Я играю только с теми, кто мне нравится»','sweet','...Это нечестный ответ. Я не знаю, что на него сказать. Ничего не скажу.']]},
  {at:15,q:'Чат придумал мне прозвище «Котлета». Потому что я злая и горячая. Это мило или ужасно?',o:[['«Мило. Я бы взял{|а} Котлету в команду»','fun','В команду Котлет? Это будет лучшая команда в мире.'],['«Скорее мило. Значит, тебя любят»','smart','Любят... Странно так думать о чате. Но, наверное, да.'],['«Хочешь, придумаю тебе прозвище получше?»','sweet','Получше? ...Только не сладкое. Не вздумай.']]},
  {at:30,q:'Офлайн я не умею разговаривать. Я придумываю ответы заранее, как макросы. Это заметно?',o:[['«Немного. Но мне нравятся твои макросы»','fun','Правда? У меня есть макрос на этот случай: «Спасибо. Отстань». ...Шучу. Спасибо.'],['«Давай без макросов. Я подожду, пока ты подумаешь»','smart','Подождёшь? ...Обычно никто не ждёт. Ладно. Сейчас подумаю.'],['«Со мной не нужно. Я не судья»','sweet','...Не судья. Это хорошо. Можно я буду говорить ерунду?']]},
  {at:45,need:()=>known('wei'),q:'Вэй вызвал меня на танцевальный баттл. На улице. Без экрана. Он с ума сошёл?',o:[['«Соглашайся. Покажи ему, что ты не только онлайн»','fun','Не только онлайн... Ладно. Но ты будешь стоять рядом. Как стратег.'],['«Предложи ему встречную игру. По твоим правилам»','smart','По моим правилам! Он даже кнопки не найдёт. Ха!'],['«Боишься — так и скажи»','bold','Я не боюсь! ...Я очень боюсь. Не говори ему.']]},
  {at:60,q:'Можно я назову свой стрим в честь тебя? Без имени. Просто чтобы ты знал{|а}.',o:[['«Назови «Дуэт»»','sweet','«Дуэт»... Да. Это ровно то. Только мы будем знать.'],['«Назови «Секретный персонаж»»','fun','Секретный персонаж! Чат сойдёт с ума. Мне нравится.'],['«Если будешь честной с чатом — да»','smart','Честной... Хорошо. Скажу, что это в честь важного человека. И всё.']]}],
 arman:[
  {at:0,q:'Ты держишь сорок вкладок в браузере? Только честно. Я не буду осуждать. Буду.',o:[['«Сорок одну»','fun','Сорок одну! Это... это преступление. Ладно, покажи, я наведу порядок.'],['«Три. Остальное в закладках»','smart','Три? ...Ты лучший человек, которого я встречал.'],['«Почисти мне браузер. Пожалуйста»','sweet','Пожалуйста? Тебе — всегда. Давай ноутбук.']]},
  {at:15,q:'Бабушка спросила, как работает интернет. Я объяснял час. Она сказала: «Понятно, это волшебство». Она права?',o:[['«Права. Ты — волшебник»','sweet','Волшебник... Никто так не говорил. Я покраснел. Не смотри.'],['Объяснить ей вместе с ним — на пальцах','smart','На пальцах! Да! Она поняла про пакеты данных! Ты гений педагогики.'],['«Скажи бабушке, что это голуби. Очень быстрые»','fun','Голуби! Ха! Она поверит. Она уже кормит голубей.']]},
  {at:30,q:'Я не умею говорить с людьми. Я умею с компьютерами. С тобой почему-то получается. Это баг?',o:[['«Это фича»','fun','Фича! Хороший ответ. Я задокументирую.'],['«Может, я просто не похож{|а} на людей»','smart','На людей ты похож{|а}. Но тебя легче понимать. Ты не врёшь.'],['«Это не баг. Это ты»','sweet','...Я сейчас перезагружусь. Секунду.']]},
  {at:45,need:()=>known('nari'),q:'Нари попросила нового бота для стрима. После прошлого бота меня все зовут «отец картофелин». Мне соглашаться?',o:[['«Соглашайся. Но протестируй на мне»','smart','На тебе? Ты будешь чатом? Ты будешь ругать бота? Это идеальный тест.'],['«Сделай бота, который хвалит картофелин»','fun','Бот-болельщик картофелин! Нари умрёт от смеха. Делаю.'],['«Не позволяй ей вешать на тебя ярлыки»','bold','Ярлыки... Мне нравится ярлык. «Отец». Звучит солидно.']]},
  {at:60,q:'Я посчитал вероятность, что через год мы всё ещё будем... ну. Вместе. Хочешь знать цифру?',o:[['«Нет. Давай проверим опытным путём»','smart','Опытным путём. Да. Это самый научный ответ. И самый страшный.'],['«Скажи. Я не боюсь»','bold','...Сто процентов. Я подогнал формулу. Не говори научному руководителю.'],['«Не надо цифр. Просто будь рядом»','sweet','Без цифр... Я попробую. Это для меня сложнее, чем код.']]}],
 timur:[
  {at:0,q:'Лучшая шутка, которую ты знаешь? У меня соревнование с самим собой.',o:[['Рассказать самую глупую шутку на свете','fun','Ха-ха-ха! Это ужасно! Это моя новая любимая шутка!'],['«Ты и есть шутка. Лучшая»','bold','Ауч. И одновременно приятно. Как это у тебя получается?'],['Рассказать про юмор как защитную реакцию','smart','...Ты сейчас меня {раскусил|раскусила} или просто читаешь умные книжки?']]},
  {at:15,q:'Мама говорит, что я слишком громкий. Учительница в школе говорила то же. Это неисправимо?',o:[['«Громкий — значит живой»','bold','Живой! Ха! Скажу маме. Она скажет «живой, но громкий».'],['«Можешь быть громким со мной. Я не против»','sweet','Не против? Обычно все просят потише. ...Я даже растерялся.'],['«Неисправимо. Смирись и наслаждайся»','fun','Смирился! Наслаждаюсь! ГРОМКО!']]},
  {at:30,q:'Иногда я шучу, чтобы никто не спрашивал, как у меня дела. Ты {заметил|заметила}?',o:[['«{Заметил|Заметила}. Как у тебя дела?»','bold','...Плохо. Спасибо, что {спросил|спросила} по-настоящему.'],['«Можешь не шутить со мной. Я никуда не уйду»','sweet','Никуда? ...Ладно. Без шуток. Это страшнее, чем матч.'],['«Тогда пошути про то, как у тебя дела»','fun','Дела как у мяча: всё время пинают. ...Видишь? Даже это смешно. Почти.']]},
  {at:45,need:()=>known('daniyar'),q:'Хёну со мной не разговаривает со школы. Из-за выпускного. Я до сих пор не знаю, что сказать.',o:[['«Скажи, что скучаешь. Это правда»','sweet','Скучаю... Да. Мы играли в одной команде. Я скучаю по его дурацким песням.'],['«Позови его сыграть на площадке. Без разговоров»','bold','Без разговоров... Мяч и гитара. Может, это и есть разговор.'],['«Спроси, что тогда случилось на самом деле»','smart','На самом деле... Я боюсь узнать, что виноват я. ...Ладно. Спрошу.']]},
