<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="90 дней весны">
<meta name="theme-color" content="#F4EEF5"><link rel="manifest" href="manifest.webmanifest">

</head><body>
<title>90 дней весны</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-sized game column (D-day header, illustrated scene, story panel with choices) beside a "профиль" side panel; on phones the panel becomes a sheet. */
:root{
  --bg:#efe9f1; --bg2:#e3ecf6; --surface:#ffffff; --surface2:#f6f3f8; --ink:#1d1b2e; --muted:#665f7a; --line:#e2dbe7;
  --accent:#e2557e; --accent-ink:#ffffff; --gold:#e8a800; --love:#d9467a; --good:#24935f; --bad:#cf4b45;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif; --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111c;--bg2:#101523;--surface:#1d1928;--surface2:#272233;--ink:#efeaf5;--muted:#a69db8;--line:#352e44;--accent:#ff7a9f;--accent-ink:#2a0812;--gold:#f2c23a;--love:#ff7aa3;--good:#4cc48a;--bad:#ef6f69;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111c;--bg2:#101523;--surface:#1d1928;--surface2:#272233;--ink:#efeaf5;--muted:#a69db8;--line:#352e44;--accent:#ff7a9f;--accent-ink:#2a0812;--gold:#f2c23a;--love:#ef6b97;--good:#4cc48a;--bad:#ef6f69;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100%;color:var(--ink);font:15px/1.5 var(--f-body)}
.app{display:flex;gap:20px;justify-content:center;align-items:flex-start;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px}
.game{flex:1 1 460px;max-width:500px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:clip;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 24px 60px -20px rgba(60,20,70,.35);display:flex;flex-direction:column;overflow:clip}
.hud{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;padding:12px 16px 10px}
.heroav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--surface2);box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent)}
.heroav img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.heroav svg{width:100%;height:auto}
.heroav:empty,.money:empty{visibility:hidden}
.logo{position:absolute;z-index:2;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 4px 20px rgba(40,10,40,.6);pointer-events:none}
.logo b{font:800 clamp(30px,8.5vw,46px)/1 var(--f-display);letter-spacing:-.03em;text-align:center}
.logo span{font:600 13px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;opacity:.92}
.logo[hidden]{display:none}
.dday{font:800 24px/1 var(--f-display);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dday small{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
.date{min-width:0;line-height:1.25}
.date b{display:block;font-weight:700}
.date span{font-size:13px;color:var(--muted)}
.money{font-weight:700;font-size:13.5px;padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 12px}
.meter .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:linear-gradient(180deg,#ffd45c,var(--gold))}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.stage{position:relative;flex-shrink:0;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:#222}
.stage .scene,.stage .scene svg,.stage .scene img{position:absolute;inset:0;width:100%;height:100%}
.stage .scene img{object-fit:cover;display:block;animation:bgin .5s ease-out}
@keyframes bgin{from{opacity:.4;transform:scale(1.03)}}
.stage .scene .tint{position:absolute;inset:0;pointer-events:none}
.tint.day{background:linear-gradient(180deg,rgba(150,200,255,.16),rgba(255,255,255,.04));mix-blend-mode:soft-light}
.tint.eve{background:linear-gradient(180deg,rgba(150,90,200,.22),rgba(255,120,110,.18));mix-blend-mode:multiply}
.tint.night{background:linear-gradient(180deg,rgba(25,30,90,.72),rgba(10,10,40,.62));mix-blend-mode:multiply}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(10,5,20,.35)),linear-gradient(0deg,rgba(10,5,20,.35),transparent 30%)}
.stage .portrait{position:absolute;bottom:0;right:4%;width:46%;max-width:240px;aspect-ratio:3/4;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.stage .portrait svg{width:100%;height:100%;display:block}
.stage .portrait.photo{width:auto;height:88%;top:6%;bottom:auto;right:4%;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.92);filter:none;box-shadow:0 14px 30px rgba(10,5,25,.45),0 0 0 6px color-mix(in srgb,var(--pc,#fff) 35%,transparent);z-index:1}
.stage .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.stage .portrait.in{animation:pin .32s ease-out}
@keyframes pin{from{transform:translateY(6%);opacity:0}}
.loctag:empty{display:none}
.loctag{position:absolute;z-index:2;left:12px;top:12px;background:rgba(15,20,35,.62);color:#fff;font:600 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.toasts{position:absolute;z-index:2;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:52%}
.toast{background:rgba(255,255,255,.95);color:#1b2034;font:700 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;animation:tin 2.6s ease-out forwards;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.neg{color:#b33a35}
@keyframes tin{0%{transform:translateY(8px);opacity:0}10%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
.story{position:relative;margin-top:-14px;border-radius:20px 20px 0 0;background:var(--surface);z-index:3;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font:700 13.5px/1 var(--f-display);letter-spacing:.01em;padding:7px 12px;border-radius:999px;color:#fff!important;background:var(--pc,var(--accent));box-shadow:0 4px 12px -4px var(--pc,var(--accent))}
.who span{font-size:12px;color:var(--muted)}
.txt{margin:0;font-size:16px;line-height:1.55;text-wrap:pretty}
.txt.fade{animation:tf .25s ease-out}
@keyframes tf{from{opacity:0;transform:translateY(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.pos{color:var(--good)}.chip.neg{color:var(--bad)}.chip.love{color:var(--love)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;min-width:0;transition:border-color .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .t{font-weight:600;line-height:1.3}
.opt .h{font-size:12.5px;color:var(--muted);line-height:1.35}
.opt .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:color-mix(in srgb,var(--accent) 14%,transparent);font:700 11px/1 var(--f-display);color:var(--accent);margin-right:8px;vertical-align:1px}
.opt.next{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#8a5cf0));box-shadow:0 10px 22px -10px var(--accent);border-color:var(--accent);color:var(--accent-ink);align-items:center;text-align:center}
.opt.next .t{font-weight:700}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt.tile{min-height:96px;justify-content:flex-end;background-color:#2a2238;background-size:cover;background-position:center;color:#fff;border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 16px -10px rgba(30,10,40,.6);text-shadow:0 1px 6px rgba(0,0,0,.55)}
.opt.tile .t{font-weight:700}
.opt.tile .h{color:rgba(255,255,255,.86)}
.opt.tile .n{background:rgba(255,255,255,.24);color:#fff}
.opt.tile.dis{opacity:.55;filter:grayscale(.7) brightness(.8)}
.opt.tile:hover{border-color:transparent;box-shadow:inset 0 0 0 2px var(--accent),0 10px 22px -10px rgba(30,10,40,.7)}
.txt .ghost{opacity:0}
.opt.next .h{color:inherit;opacity:.85}
.pre .meters{display:none}
.pre .heroav:empty{display:none}
.phd{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.phd i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.phd i.past{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.phd i.now{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.stage{cursor:pointer}
.opt.person{border-color:color-mix(in srgb,var(--love) 45%,var(--line))}
.opt.person .t::before{content:"♥ ";color:var(--love)}
.opt.back{background:transparent}
.opt .faces{display:flex;gap:4px;margin-top:4px}
.opt .faces i{font-style:normal;font-size:11px;font-weight:700;color:#fff;padding:3px 7px;border-radius:999px}
.namein{display:flex;gap:8px}
.namein input{flex:1;min-width:0;font:500 16px var(--f-body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.namein button{font:700 14px var(--f-body);padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.profbtn{display:none}
.side{flex:0 1 380px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(20,30,60,.08)}
.side h2{font:700 13px/1.3 var(--f-display);margin:18px 0 10px;letter-spacing:.01em}
.side h2:first-child{margin-top:0}
.me{display:flex;gap:12px;align-items:center}
.me .av{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--surface2);flex:none;border:1px solid var(--line)}
.me .av svg{width:100%;height:auto;margin-top:-6px}
.me b{font:700 17px/1.2 var(--f-display)}
.me span{font-size:13px;color:var(--muted)}
.stat{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}
.stat .bar{height:7px}
.stat em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12.5px;padding:5px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);line-height:1.3}
.trait.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;min-width:0}
.slot span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.slot b{font-weight:600}
.inv{display:flex;flex-direction:column;gap:6px}
.inv .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.inv button{font:600 12px var(--f-body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.inv button:disabled{opacity:.45;cursor:default}
.inv button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rel .row{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.rel .av{grid-row:1/3;width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--surface2)}
.rel .av svg{width:100%;height:auto;margin-top:-3px}
.rel .nm{font-weight:600;font-size:14px}
.rel .st{font-size:12px;color:var(--muted);text-align:right}
.rel .st.pair{color:var(--love);font-weight:700}
.rel .bar{grid-column:2/4;height:5px}
.grades{width:100%;border-collapse:collapse;font-size:13.5px}
.grades td{padding:5px 0;border-bottom:1px solid var(--line)}
.grades td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ends{display:flex;flex-wrap:wrap;gap:6px}
.ends span{font-size:12px;padding:4px 8px;border-radius:7px;border:1px dashed var(--line);color:var(--muted)}
.ends span.got{border-style:solid;color:var(--ink);background:var(--surface2)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));display:flex;flex-direction:column;gap:8px}
.card .k{font:700 11px/1 var(--f-display);color:var(--accent);letter-spacing:.08em}
.card h3{margin:0;font:800 22px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0}
.closeprof{display:none}
@media (max-width:900px){
  .app{flex-direction:column;align-items:center}
  .game{flex:none;width:100%}
  .side{display:none;position:fixed;inset:0;z-index:20;border-radius:0;overflow:auto;max-width:none;padding-block:20px;padding-inline:16px}
  .side.open{display:block}
  .profbtn{display:inline-flex;align-items:center;font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
  .closeprof{display:inline-flex;float:right;font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
  .hud{grid-template-columns:auto auto 1fr auto auto}
}
@media (max-width:520px){
  .app{padding:0}
  .game{border-radius:0;border:0;box-shadow:none;min-height:100vh;min-height:100dvh;max-width:none}
  .hud{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .story{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));flex:1}
  .opt.tile{min-height:84px}
  .hud{grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"av dd date prof" "av dd money prof";row-gap:4px;column-gap:10px;padding:12px 14px 10px}
  .heroav{grid-area:av}.dday{grid-area:dd}.date{grid-area:date}.money{grid-area:money;justify-self:start;font-size:12.5px;padding:3px 9px}.profbtn{grid-area:prof}
  .date b{font-size:14px;line-height:1.2}.date span{font-size:12px}
  .profbtn{font-size:12px!important;padding:6px 10px!important}
  .dday{font-size:21px}
  .meters{padding-inline:14px}
  .story{padding:16px 14px 18px}
  .opts.grid{grid-template-columns:1fr}
}
@media (max-width:420px){.opts.grid{grid-template-columns:1fr 1fr}.txt{font-size:15.5px}.hud{gap:8px;padding-inline:12px}.dday{font-size:20px}}
@media (prefers-reduced-motion:reduce){.txt.fade,.toast,.stage .portrait.in{animation:none}}
.sndbtn{position:absolute;z-index:3;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(15,20,35,.55);color:#fff;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sndbtn.off{color:rgba(255,255,255,.6)}
.sndbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pnwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(12,8,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:pnin .2s ease-out}
@keyframes pnin{from{opacity:0}}
.pn{width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:0 24px 60px rgba(10,5,25,.45);overflow:hidden}
.pnh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.pnh small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pnh b{font:800 22px/1.1 var(--f-display);letter-spacing:-.02em}
.pnx{border:0;background:var(--surface2);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0}
.pnb{overflow-y:auto;padding:8px 20px 4px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.pnb section{padding:12px 0 2px;border-top:1px dashed var(--line)}
.pnb section:first-child{border-top:0}
.pnb h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:700 15px/1.2 var(--f-body)}
.pnb .pv{font:800 15px/1 var(--f-display);color:var(--accent)}
.pnb .pnew{font:700 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:999px}
.pnb em{margin-left:auto;font:500 12.5px/1 var(--f-body);color:var(--muted);font-style:normal}
.pnb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.pnb li{font-size:14px;line-height:1.45}
.pnb section:not(.new) li{color:var(--muted)}
.pnok{margin:12px 20px 18px;padding:12px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);cursor:pointer}
.prow{cursor:pointer;border-radius:12px;transition:background .15s}
.prow:hover,.prow:focus-visible{background:var(--surface2);outline:none}
.pn.prof .pfh{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 18%,var(--surface)),var(--surface))}
.pn.prof .pfh img,.pn.prof .pfsvg{width:96px;height:128px;object-fit:cover;border-radius:14px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px color-mix(in srgb,var(--pc) 55%,transparent)}
.pn.prof .pfsvg svg{width:100%;height:100%}
.pn.prof .pfh img.zoomable{cursor:zoom-in;transition:transform .15s}

   [['bg','park','night'],['n','Ночной парк, тихая музыка из колонки. Вэй протягивает тебе руку, как в первый вечер.'],['b','Я всегда танцую для толпы. А этот танец хочу станцевать для одного человека.'],['b','Я не умею говорить красиво, поэтому скажу прямо: ты мне очень нравишься. Станцуешь со мной?'],['c','Что ответишь?',[['«Станцую. И не только сегодня»','yes','b','Тогда держись крепче. Я поведу. Всю жизнь, если позволишь.'],['Взять его руку и сделать первый шаг','yes','b','Ты сама повела! Ладно, теперь я точно влюблён.'],['«Давай просто останемся друзьями»','no','s','Понял. Друзья. Это тоже хорошо. Наверное.']]]]],

let CH_BUF=[];
function chip(t,cls){CH_BUF.push([t,cls]);toast(t,cls==='neg')}
function toast(t,neg){const el=document.createElement('div');el.className='toast'+(neg?' neg':'');el.textContent=t;const box=$('#toasts');box.appendChild(el);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>el.remove(),2700)}
function stat(k,n){
  let m=1;for(const s of ['gadget','cloth','acc']){const it=eq(s);if(it?.m?.[k])m*=it.m[k]}
  if(k==='game'&&has('esports'))m*=1.15;if(k==='style'&&has('fashion'))m*=1.15;if(k==='charm'&&has('fashion'))m*=1.05;if(k==='lang'&&has('polyglot'))m*=1.15;
  if(k==='study'&&has('bald'))m*=1.1;if(k==='charm'&&has('bald'))m*=0.9;if(k==='charm'&&has('social'))m*=1.15;if(k==='art'&&has('artist'))m*=1.15;if(k==='study'&&has('bookworm'))m*=1.15;
  if(S.mood<25)m*=0.7;else if(S.mood>75)m*=1.15;
  if(S.st[k]>=80)m*=0.5;else if(S.st[k]>=60)m*=0.75;
  n=Math.max(1,Math.round(n*m));const before=S.st[k];S.st[k]=clamp(S.st[k]+n,0,100);const d=S.st[k]-before;if(d)chip(`+${d} ${STAT_N[k]}`,'pos');
}
function mood(n){if(n<0&&eq('acc')?.calm)n=Math.round(n/2);const b=S.mood;S.mood=clamp(S.mood+n,0,100);const d=S.mood-b;if(d)chip(`${d>0?'+':''}${d} настроение`,d>0?'pos':'neg')}
function energy(n){const b=S.energy;S.energy=clamp(S.energy+n,0,enMax());const d=S.energy-b;if(d>0)chip(`+${d} энергия`,'pos')}
function money(n){if(n>0&&has('worker'))n=Math.round(n*1.2);S.money+=n;chip(`${n>0?'+':'−'}${fmt(Math.abs(n))}`,n>0?'pos':'neg')}
function aff(id,n){if(n>0)S.seen[id]=S.day;const r=S.rel[id];const cap=S.partner&&S.partner!==id?45:100;const b=r.aff;r.aff=clamp(r.aff+n,0,cap);const d=r.aff-b;if(d)chip(`${d>0?'♥ +':'♥ '}${d} ${CH[id].n}`,d>0?'love':'neg');return d}
function fr(id,n){if(n>0)S.seen[id]=S.day;const b=S.fr[id];S.fr[id]=clamp(S.fr[id]+n,0,100);const d=S.fr[id]-b;if(d)chip(`${d>0?'+':''}${d} дружба: ${CH[id].n}`,d>0?'pos':'neg')}
function fam(n){S.family=clamp(S.family+n,0,100);chip(`${n>0?'+':''}${n} семья`,n>0?'pos':'neg')}
function subs(n){let m=eq('gadget')?.subs||1;n=Math.round(n*m);S.subs+=n;chip(`+${n.toLocaleString('ru-RU')} подписчиков`,'pos')}
function chance(k,dc){return clamp(0.5+(S.st[k]-dc)/50,0.05,0.95)}
function pct(k,dc){return Math.round(chance(k,dc)*100)+'%'}
function roll(k,dc){const ok=Math.random()<chance(k,dc);chip(`${STAT_N[k]}: ${ok?'успех':'неудача'}`,ok?'pos':'neg');return ok}
function addTrait(id){if(has(id))return false;S.traits.push(id);chip(`Новая черта: ${TRAITS[id].n}`,TRAITS[id].bad?'neg':'pos');return true}

function renderChips(){const c=$('#chips');c.innerHTML=CH_BUF.map(([t,cls])=>`<span class="chip ${cls||''}">${esc(t)}</span>`).join('');CH_BUF=[]}
let TYPE=null;
function typeText(el,txt){if(TYPE){clearInterval(TYPE.iv);TYPE=null}
  if(window.__noType||txt.length<3||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){el.textContent=txt;return}
  let i=0;el.textContent='';const sp=document.createElement('span');sp.className='ghost';sp.textContent=txt;el.appendChild(sp);const vis=document.createTextNode('');el.insertBefore(vis,sp);
  const fin=()=>{if(!TYPE)return;clearInterval(TYPE.iv);TYPE=null;el.textContent=txt};
  TYPE={fin,iv:setInterval(()=>{i=Math.min(txt.length,i+(window.__tspd||2));vis.data=txt.slice(0,i);sp.textContent=txt.slice(i);if(i>=txt.length)fin()},18)};
}
function ask(text,opts,o={}){
  return new Promise(res=>{
    if(o.who!==undefined)setWho(o.who,o.exp||'n');
    const t=$('#txt');typeText(t,fx(text));
    renderChips();
    const box=$('#opts');box.className='opts'+(o.grid?' grid':'');box.innerHTML='';
    opts.forEach((op,i)=>{
      if(typeof op==='string')op={t:op};
      const b=document.createElement('button');b.type='button';b.className='opt'+(op.cls?' '+op.cls:'')+(op.dis?' dis':'');
      b.innerHTML=`<span class="t">${opts.length>1&&!op.cls?.includes('next')?`<span class="n">${i+1}</span>`:''}${esc(fx(op.t))}</span>${op.h?`<span class="h">${esc(fx(op.h))}</span>`:''}${op.faces?`<span class="faces">${op.faces.map(id=>`<i style="background:${CH[id].col}">${esc(CH[id].n)}</i>`).join('')}</span>`:''}`;
      if(op.dis)b.setAttribute('aria-disabled','true');
      b.addEventListener('click',()=>{if(TYPE&&opts.length===1){TYPE.fin();return}if(op.dis){toast(op.why||'Сейчас недоступно',true);return}if(TYPE)TYPE.fin();if(pending!==res)return;pending=null;res(i)});
      box.appendChild(b);
    });
    pending=res;updHud();renderSide();
    if(window.innerWidth<700&&o.scroll!==false)$('.story').scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

  for(const [x,h] of B){s+=`<rect x="${x}" y="${y0-h}" width="26" height="${h}" fill="${bw}"/>`;for(let k=0;k<Math.floor(h/12);k++)if((x+k)%3)s+=`<rect x="${x+5+(k%2)*10}" y="${y0-h+6+k*11}" width="5" height="5" fill="${win}" opacity="${lit?.9:.6}"/>`}

}

/* ================= talk & romance ================= */
async function steps(id,arr){
  for(const s of arr){
    if(s[0]==='bg'){setScene(s[1],'night'===s[2]?'night':'eve');continue}
    if(s[0]==='cg'){setScene(s[1]);setWho(id,'h');continue}
    if(s[0]==='n'){await narr(s[1]);continue}
    if(s[0]==='say'){await line(s[1],s[2],s[3]);continue}
    if(s[0]==='c'){
      const i=await ask(s[1],s[2].map(o=>({t:o[0],h:[typeof o[4]==='number'?`−${fmt(o[4])}`:'',o[5]?`${STAT_N[o[5].k]}: шанс ${pct(o[5].k,o[5].dc)}`:''].filter(Boolean).join(' · ')})),{who:id,exp:'n'});const o=s[2][i];
      if(typeof o[4]==='number'){if(S.money>=o[4])money(-o[4]);else{await line(id,'s','Подожди, у тебя же нет столько денег... Ничего. Придумаем что-нибудь.');continue}}
      if(typeof o[4]==='string'&&STAT_N[o[4]])stat(o[4],3);
      if(typeof o[1]==='number'){let d=o[1],ex=o[2],tx=o[3];if(o[5]&&!roll(o[5].k,o[5].dc)){d=Math.min(d,2);ex=o[5].fail[0];tx=o[5].fail[1]}if(S.rel[id])aff(id,d);else fr(id,Math.round(d*0.7));if(o[6]&&o[6].b)for(const [bk,bv] of Object.entries(o[6].b))bump(bk,bv);if(tx)await line(id,ex,tx)}
      else if(o[1]==='yes'){S.partner=id;S.rel[id].aff=Math.max(S.rel[id].aff,90);mood(15);await line(id,o[2],o[3]);await narr('Теперь вы пара. По утрам будут приходить тёплые сообщения, а настроение станет держаться лучше.')}
      else{aff(id,-6);await line(id,o[2],o[3]);return 'no'}
      continue}
    await line(id,s[0],s[1]);
  }
}
function present(loc){
  if(!S)return [];const out=[];const sl=S.slot,we=isWeekend(S.day)||isHoliday(S.day);
  const ids=[...romIds(),...frIds()];
  for(const id of ids){const sch=(ROM[id]||FRIEND[id]).sched;
    if(sch.some(([l,t,w])=>l===loc&&(t==='any'&&sl<=3||t==='day'&&sl<=2||t==='eve'&&sl>=3)&&(w==='any'||(w==='wd'&&!we)||(w==='we'&&we))&&(l!=='uni'||classDay(S.day)))&&S.pres[id]<0.8)out.push(id)}
  if(loc==='river'&&we&&S.slot===3)for(const id of romIds())if(S.rel[id].met&&S.pres[id]>0.65&&!out.includes(id))out.push(id);
  return out.filter(id=>!S.talked[id]);
}
async function talkTo(id){
  S.talked[id]=true;
  if(FRIEND[id])return friendTalk(id);
  const R=ROM[id],r=S.rel[id];
  if(!r.met){r.met=true;await steps(id,R.intro);aff(id,5);await say('Вы обменялись номерами. Теперь можно писать с телефона.',id,'h');return}
  if(r.arc<5&&r.aff>=ARC_AT[r.arc]&&!(r.arc>=3&&S.partner&&S.partner!==id)&&r.arcDay!==S.day){
    r.arcDay=S.day;const prev=$('#scene').dataset.k;const res=await steps(id,R.arcs[r.arc]);if(res!=='no')r.arc++;
    if(prev)setScene(prev.replace(/(day|eve|night)$/,''),prev.match(/(day|eve|night)$/)[1]);return}
  const s=stage(id);
  for(;;){
    const opts=[{t:'Поболтать',h:'симпатия, настроение'},{t:'Подарить подарок',h:Object.keys(GIFTS).some(k=>S.gifts[k])?'из сумки':'в сумке пусто',dis:!Object.keys(GIFTS).some(k=>S.gifts[k]),why:'Подарки продаются в торговом центре'}];
    const canDate=r.aff>=30&&S.slot<=3;opts.push({t:'Позвать на прогулку',h:r.aff>=30?'займёт этот ход':'нужна симпатия 30',dis:!canDate,why:'Пока рано звать на свидание'});
    opts.push({t:'Попрощаться',cls:'back'});
    const i=await ask(R.greet[s],opts,{who:id,exp:s>=3?'b':'h'});
    if(i===0){await chat(id);return}
    if(i===1){await giveGift(id);return}
    if(i===2){await date(id);return 'date'}
    return;
  }
}
async function toneReact(id,tone,big){
  const R=ROM[id];let d,e,t;
  if(R.likes.includes(tone)){d=big;e='b';t=pick(R.react.good)}else if(R.dis===tone){d=-3;e='a';t=pick(R.react.bad)}else{d=2;e='n';t=pick(R.react.ok)}
  if(d>0&&S.st.charm>=40)d+=2;if(d>0&&S.st.style>=45)d+=1;if(d>0&&S.mood<25)d=Math.max(1,d-2);if(d>0&&eq('acc')===ITEMS.ring)d+=1;
  aff(id,d);await line(id,e,t);
}
async function chat(id){
  const r=S.rel[id];let pool=QS.map((q,i)=>i).filter(i=>!r.asked.includes(i));if(!pool.length){r.asked=[];pool=QS.map((q,i)=>i)}
  const qi=pick(pool);r.asked.push(qi);const q=QS[qi];
  const order=shuffle(['smart','fun','bold','sweet']);
  const i=await ask(q.q,order.map(t=>({t:q.a[t]})),{who:id,exp:'n'});
  await toneReact(id,order[i],5);mood(3);
}
async function giveGift(id){
  const R=ROM[id];const keys=Object.keys(GIFTS).filter(k=>S.gifts[k]);
  const i=await ask('Что подаришь?',keys.map(k=>({t:`${GIFTS[k].n} ×${S.gifts[k]}`})).concat([{t:'Передумать',cls:'back'}]),{who:id,exp:'n'});
  if(i===keys.length)return;const k=keys[i];S.gifts[k]--;
  if(k==='bento'&&R.gLike!==k){aff(id,9);await line(id,'b','Ты сам{|а} это приготовил{|а}? ...Это лучше любого магазина.'.replace('{|а}',S.pg==='f'?'а':'').replace('{|а}',S.pg==='f'?'а':''));return}
  if(R.gLike===k){aff(id,11);await line(id,'b',R.gift.like)}else if(R.gDis===k){aff(id,1);await line(id,'a',R.gift.bad)}else{aff(id,5);await line(id,'h',R.gift.ok)}
}
async function date(id){
  const R=ROM[id];const keys=Object.keys(DATES);
  const i=await ask('Куда пойдёте?',keys.map(k=>({t:DATES[k].n,h:DATES[k].p?fmt(DATES[k].p)+', 2 энергии':'бесплатно, 2 энергии',dis:S.money<DATES[k].p||S.energy<2,why:S.energy<2?'Нужно 2 энергии':'Не хватает денег'})).concat([{t:'Передумать',cls:'back'}]),{who:id,exp:'h'});
  if(i===keys.length)return;const D=DATES[keys[i]];
  if(D.p)money(-D.p);S.energy-=2;S.slot++;S.rel[id].dates++;
  setScene(D.bg,'eve');const fav=R.fav===keys[i];
  if(fav)aff(id,6);await line(id,fav?'b':'h',fav?R.date.fav:R.date.ok);
  if(S.st.style>=50){aff(id,2);await narr(pick(['Ты сегодня выглядишь особенно хорошо, и это замечают.','Твой образ явно попал в точку.']))}
  const o=shuffle(D.o);const k=await ask(D.q,o.map(x=>({t:x[0]})),{who:id,exp:'n'});
  if(o[k][2]&&S.rel[id].aff<45&&!R.likes.includes('bold')){aff(id,-3);await line(id,'a','Эм... не так быстро.')}
  else await toneReact(id,o[k][1],10);
  mood(12);await say('Вечер получился хорошим.',id,'h');
}
async function friendTalk(id){
  const F=FRIEND[id];if(!S.fmet[id]){S.fmet[id]=true;if(F.intro){await steps(id,F.intro);fr(id,6);await say('Вы обменялись номерами. Теперь можно писать с телефона.',id,'h');return}}
  const a=S.farc[id];
  if(a<F.arcs.length&&S.fr[id]>=FR_AT[a]){const res=await steps(id,F.arcs[a]);S.farc[id]++;return}
  await line(id,'h',pick(F.greet));if(S.mood<30){fr(id,1);await say('Разговор не клеится: ты слишком уставш{ий|ая}.',id,'n');return}fr(id,3);mood(4);
  await say(pick(F.chat||(id==='beka'?['Вы полчаса обсуждаете, почему у соседей сверху вечно что-то падает.','Чанмин показывает новый мем. Ты смеёшься так, что болит живот.','Пьёте чай из одной кружки — вторую кто-то унёс.']:['Суа пересказывает новости потока. Половина из них — правда.','Вы вместе ругаете расписание. Становится легче.'])),id,'l');
}

async function phoneMenu(){
  setScene('home');
  for(;;){
    const list=[...romIds().filter(id=>S.rel[id].met),...frIds().filter(id=>S.fmet[id]),'mom'];
    const i=await ask('Телефон. Кому написать?',list.map(id=>({t:CH[id].n,h:S.texted[id]?'уже переписывались сегодня':(S.rel[id]?STAGE_N[stage(id)]:id==='mom'?'позвонить':'написать')})).concat([{t:'Убрать телефон',cls:'back'}]),{who:null});
    if(i===list.length)return;

    if(id==='mom'){if(S.texted.mom){await say('Вы уже говорили сегодня.');continue}S.texted.mom=true;await momCall(false);continue}
    const opts=[{t:'Написать сообщение',dis:!!S.texted[id],why:'Уже переписывались сегодня'}];
    if(S.rel[id])opts.push({t:'Позвать гулять',h:S.rel[id].aff>=30?'займёт этот ход':'нужна симпатия 30',dis:S.rel[id].aff<30||S.slot>3,why:'Пока рано'});
    opts.push({t:'Назад',cls:'back'});
    const k=await ask(`Чат с ${INS[id]}.`,opts,{who:null});
    if(opts[k].t==='Назад')continue;
    if(opts[k].t==='Позвать гулять'){await line(id,'b','Давай! Куда пойдём?');await date(id);return 'date'}
    S.texted[id]=true;
    if(S.rel[id]){const o=shuffle(MSG_OPTS);const j=await ask('Что напишешь?',o.map(x=>({t:x[0]})));setWho(id,'n');const R=ROM[id];
      if(R.likes.includes(o[j][1])){aff(id,4);await line(id,'h',pick(R.texts))}else if(R.dis===o[j][1]){aff(id,-2);await line(id,'a',pick(R.react.bad))}else{aff(id,1);await line(id,'n',pick(R.react.ok))}}
    else{fr(id,1);await line(id,'h',pick(FRIEND[id].texts))}
  }
}
async function momCall(sunday){

function actAvail(a){

  if(a.wd&&!classDay(S.day))return {hide:true};
  if(a.req&&!a.req())return a.reqTxt?{dis:true,why:a.reqTxt}:{hide:true};
  if((a.e||0)>S.energy)return {dis:true,why:`Нужно ${a.e} энергии`};

/* ================= exams ================= */
function letter(s){return s>=90?'A':s>=75?'B':s>=60?'C':s>=50?'D':'F'}
function examScore(bonus){
  const att=S.att.total?S.att.went/S.att.total:1;const prep=S.studyDays.filter(d=>d>S.day-8).length;
  let sc=6+S.st.study*0.75+att*15+Math.min(prep,8)*1.8+bonus+(rnd(17)-8);if(has('skipper'))sc-=5;if(eq('gadget')?.m?.study)sc+=2;
  return clamp(Math.round(sc),0,100);
}
async function examMorning(title){
  setScene('exam','day');
  const i=await ask(`${title}. Как начнёшь утро?`,[{t:'Повторить конспект за завтраком',h:'+5 баллов, −2 энергии'},{t:'Спокойно выспаться',h:'+2 балла, настроение +'},{t:'Списать у соседа',h:`Обаяние: шанс ${pct('charm',50)}`}]);
  if(i===0){S.energy=Math.max(0,S.energy-2);return 5}
  if(i===1){mood(4);return 2}
  if(roll('charm',50)){await say('Сосед незаметно двигает листок ближе. Повезло.');return 10}
  mood(-10);await say('Преподаватель кашляет за твоей спиной. Работу забирают, придётся отвечать устно.');return -15;
}

  await say(`Результат рубежного контроля: ${s} баллов из 100. Оценка ${letter(s)}.`,ME(),s>=60?'h':s>=50?'n':'s');
  if(s>=85)await line('prof','h','Отличная работа. Так держать.');else if(s<50)await line('prof','a','Я жду от вас большего. Вы можете лучше.');

function computeEnding(){
  if(S.over==='burnout')return 'burnout';
  if(S.flags.expelled)return 'expelled';
  const avg=S.fin.length?S.fin.reduce((a,f)=>a+f.s,0)/S.fin.length:0;
  const c=[];
  if(S.flags.seoul)c.push('seoul');
  if(S.flags.stage&&S.st.art>=70)c.push('stage');
  if(S.flags.sport&&S.st.fit>=70)c.push('sport');
  if(S.money>=400000)c.push('business');
  if(S.st.lang>=80)c.push('polyglot');
  if(S.st.cook>=80)c.push('chef');
  if((S.flags.esports||0)>=3&&S.st.game>=75)c.push('esports');
  if(S.st.style>=80&&S.st.charm>=55)c.push('model');
  if(S.subs>=25000)c.push('blogger');
  if(avg>=85&&S.fin.length===3)c.push('grant');
  if(S.fr.beka>=70&&S.fr.kamila>=55)c.push('friends');
  return c.length?c:['ordinary'];
}

let MGAC=null;
function mgBeep(f,d,v){try{if(!MGAC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;MGAC=new C()}if(MGAC.state==='suspended')MGAC.resume();
  const t=MGAC.currentTime,o=MGAC.createOscillator(),g=MGAC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.connect(g);g.connect(MGAC.destination);o.start(t);o.stop(t+(d||.12)+.02)}catch(e){}}
function mgShell(title,sub){const w=document.createElement('div');w.className='mgwrap';w.setAttribute('role','dialog');w.setAttribute('aria-label',title);
  w.innerHTML=`<div class="mg"><div class="mgh"><div><small>${esc(sub)}</small><b>${esc(title)}</b></div><button type="button" class="mgx" aria-label="Закончить">✕</button></div><div class="mgb"></div></div>`;
  document.body.appendChild(w);return w}
function mgGrade(s){return s>=.9?'Идеально!':s>=.7?'Отлично':s>=.45?'Неплохо':'Не получилось'}

/* ---------- rhythm ---------- */
function rhythmGame(title,diff){return new Promise(res=>{
  if(window.__noType){res(Math.random());return}
  const w=mgShell(title,'Ритм-игра');const b=w.querySelector('.mgb');
  b.innerHTML=`<p class="mgtip">Жми на кнопку, когда нота входит в круг. Чем точнее, тем лучше.</p>
   <div class="rtrack"><div class="rring"></div><div class="rnotes"></div></div>
   <div class="rstat"><span class="rj"></span><span class="rc"></span></div>
   <button type="button" class="rtap">Старт</button>`;
  const notesEl=b.querySelector('.rnotes'),tap=b.querySelector('.rtap'),jEl=b.querySelector('.rj'),cEl=b.querySelector('.rc'),track=b.querySelector('.rtrack');
  const beat=60000/(diff==='hard'?118:100),lead=1700,N=20;let T=[],t=beat*2;
  for(let i=0;i<N;i++){T.push(t);t+=beat*(Math.random()<.3?0.5:(Math.random()<.2?1.5:1))}
  const notes=T.map(tt=>({t:tt,hit:null,el:null}));let t0=0,raf=0,score=0,combo=0,done=false,started=false;const PER=70,GOOD=150;
  const end=()=>{if(done)return;done=true;cancelAnimationFrame(raf);const s=Math.min(1,score/N);
    b.innerHTML=`<div class="mgres"><b>${mgGrade(s)}</b><span>Точность ${Math.round(s*100)}%</span></div><button type="button" class="rtap">Готово</button>`;
    const prev2=window.appBack;b.querySelector('.rtap').onclick=()=>{w.remove();window.appBack=prev;res(s)};window.appBack=()=>{w.remove();window.appBack=prev;res(s);return true}};
  const judge=()=>{const now=performance.now()-t0;let best=null,bd=1e9;for(const n of notes){if(n.hit!=null)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n}}
    if(best&&bd<=GOOD){best.hit=bd<=PER?1:.6;score+=best.hit;combo++;best.el&&best.el.classList.add('ok');mgBeep(best.hit===1?880:660,.1);jEl.textContent=best.hit===1?'Идеально':'Хорошо';jEl.className='rj '+(best.hit===1?'p':'g')}
    else{combo=0;mgBeep(180,.08,.1);jEl.textContent='Мимо';jEl.className='rj m'}
    cEl.textContent=combo>1?'Комбо ×'+combo:''};
  const loop=()=>{const now=performance.now()-t0;const W=track.clientWidth,ringX=W*.18;
    for(const n of notes){const dt=n.t-now;if(!n.el&&dt<lead&&n.hit==null){n.el=document.createElement('i');notesEl.appendChild(n.el)}
      if(n.el){const x=ringX+dt/lead*(W-ringX);n.el.style.transform=`translateX(${x}px)`;if(dt<-GOOD&&n.hit==null){n.hit=0;combo=0;n.el.classList.add('miss');jEl.textContent='Мимо';jEl.className='rj m';cEl.textContent=''}
        if(dt<-400){n.el.remove();n.el=null}}}
    if(now>T[T.length-1]+600){end();return}raf=requestAnimationFrame(loop)};
  tap.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;if(!started){started=true;tap.textContent='Жми!';t0=performance.now();mgBeep(440,.05,.05);raf=requestAnimationFrame(loop);return}judge()});
  const kd=e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();tap.dispatchEvent(new PointerEvent('pointerdown'))}};document.addEventListener('keydown',kd);
  const prev=window.appBack;const quit=()=>{document.removeEventListener('keydown',kd);if(!started){w.remove();window.appBack=prev;res(null);return}end()};
  w.querySelector('.mgx').onclick=quit;window.appBack=()=>{quit();return true};
  const mo=new MutationObserver(()=>{if(!document.body.contains(w)){document.removeEventListener('keydown',kd);mo.disconnect()}});mo.observe(document.body,{childList:true});
})}

/* ---------- cooking ---------- */
const RECIPES=[
 {n:'Кимчи-чигэ',ing:['🥬 Кимчи','🥓 Свинина','🧈 Тофу','🌿 Зелёный лук']},
 {n:'Токпокки',ing:['🍡 Рисовые клёцки','🌶 Кочхуджан','🍥 Рыбные пластины','🥚 Яйцо']},
 {n:'Пибимпап',ing:['🍚 Рис','🥕 Овощи','🍳 Яичница','🌶 Кочхуджан']},
 {n:'Рамён «как у мамы»',ing:['💧 Вода','🍜 Лапша','🥚 Яйцо','🌿 Зелёный лук']},
 {n:'Пхаджон',ing:['🌾 Мука','💧 Вода','🌿 Зелёный лук','🦑 Кальмар']},
 {n:'Кимпаб',ing:['🟩 Лист нори','🍚 Рис','🥕 Овощи','🍳 Омлет']},
];
const EXTRA_ING=['🧀 Сыр','🍫 Шоколад','🍓 Клубника','🧂 Соль','🍌 Банан','🥛 Молоко'];
function cookGame(){return new Promise(res=>{
  if(window.__noType){res(Math.random());return}
  const R=pick(RECIPES);const pool=shuffle([...R.ing,...shuffle(EXTRA_ING).slice(0,2)]);
  const w=mgShell(R.n,'Готовка');const b=w.querySelector('.mgb');let step=0,miss=0,left=15,iv=0,orderScore=0,done=false;
  const prev=window.appBack;const fin=s=>{if(done)return;done=true;clearInterval(iv);cancelAnimationFrame(raf);
    b.innerHTML=`<div class="mgres"><b>${mgGrade(s)}</b><span>${s>=.7?'Пахнет так, что соседи стучат в дверь.':s>=.45?'Съедобно. Даже вкусно, если не придираться.':'Ну… зато ты попробовал{|а}.'.replace('{|а}',S&&S.pg==='f'?'а':'')}</span></div><button type="button" class="rtap">Готово</button>`;
    b.querySelector('.rtap').onclick=()=>{w.remove();window.appBack=prev;res(s)};window.appBack=()=>{w.remove();window.appBack=prev;res(s);return true}};
  let raf=0;
  const heat=()=>{clearInterval(iv);const zone=Math.max(.12,Math.min(.3,.12+(S?S.st.cook:20)/500));const z0=.5-zone/2;
    b.innerHTML=`<p class="mgtip">Теперь огонь. Останови стрелку в зелёной зоне.</p><div class="hbar"><div class="hz" style="left:${z0*100}%;width:${zone*100}%"></div><div class="hn"></div></div><button type="button" class="rtap">Стоп!</button>`;
    const nd=b.querySelector('.hn');let x=0,dir=1,last=performance.now();const sp=.9;
    const mv=t=>{const dt=(t-last)/1000;last=t;x+=dir*sp*dt;if(x>1){x=1;dir=-1}if(x<0){x=0;dir=1}nd.style.left=(x*100)+'%';raf=requestAnimationFrame(mv)};raf=requestAnimationFrame(mv);
    b.querySelector('.rtap').addEventListener('pointerdown',e=>{e.preventDefault();cancelAnimationFrame(raf);const d=Math.abs(x-.5);const hs=d<=zone/4?1:d<=zone/2?.75:d<=zone?.35:.1;mgBeep(hs>=.75?880:220,.15);
      b.querySelector('.hbar').classList.add(hs>=.75?'good':'bad');setTimeout(()=>fin(Math.round((orderScore*.55+hs*.45)*100)/100),650)},{once:true})};
  b.innerHTML=`<p class="mgtip">Добавляй ингредиенты по рецепту, по порядку. Лишнее не трогай.</p>
   <ol class="crec">${R.ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="ctime"><i></i></div><div class="cgrid">${pool.map((x,i)=>`<button type="button" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
  const bar=b.querySelector('.ctime i');
  iv=setInterval(()=>{left-=.1;bar.style.width=Math.max(0,left/15*100)+'%';if(left<=0){orderScore=Math.max(0,step/4-miss*.15);heat()}},100);
  b.querySelector('.cgrid').addEventListener('click',e=>{const bt=e.target.closest('button');if(!bt||bt.disabled)return;const it=pool[+bt.dataset.i];
    if(it===R.ing[step]){bt.disabled=true;bt.classList.add('ok');b.querySelectorAll('.crec li')[step].classList.add('ok');step++;mgBeep(520+step*90,.08);
      if(step===4){orderScore=Math.max(0,1-miss*.2)*(left>5?1:.85);setTimeout(heat,350)}}
    else{miss++;bt.classList.remove('bad');void bt.offsetWidth;bt.classList.add('bad');mgBeep(160,.1,.1)}});
  w.querySelector('.mgx').onclick=()=>{if(step===0&&!done){clearInterval(iv);w.remove();window.appBack=prev;res(null)}else fin(Math.max(0,step/4-miss*.15)*.55)};
  window.appBack=()=>{w.querySelector('.mgx').click();return true};
})}

async function examQuiz(title){const subj=SUBJ.find(n=>title.includes(n))||pick(S.subjects);const bank=QUIZ[subj];if(!bank)return 0;
  S.qseen=S.qseen||{};const fresh=bank.filter(q=>!S.qseen[q[0]]);const qs=shuffle(fresh.length>=3?fresh:bank).slice(0,3);let ok=0,bonus=0;
  for(let k=0;k<qs.length;k++){const [q,a,wr]=qs[k];S.qseen[q]=1;const opts=shuffle([a,...wr]);const hint=S.st.study>=60?wr[0]:null;
    const i=await ask(`${subj} · вопрос ${k+1} из ${qs.length}. ${q}`,opts.map(o=>({t:o,h:o===hint?'вряд ли — подсказывает учёба':undefined,dis:o===hint,why:'Учёба подсказывает, что это неверно'})),{who:null});
    if(opts[i]===a){ok++;bonus+=4;await say('Верно.')}else{bonus-=2;await say(`Неверно. Правильный ответ: ${a}.`)}}
  if(ok===qs.length){S.flags.quizTop=1;mood(4)}
  chip(`${bonus>=0?'+':''}${bonus} баллов за ответы`,bonus>=0?'pos':'neg');return bonus}

ra|Ты выглядишь как человек, которому сегодня нужен котик. Он бесплатный.": "mira_x2", "mira|Я Харин. Днём варю кофе, вечером рисую на стенах. Легально! Почти всегда.": "mira_x3", "dana|Хороший приём! Ты играешь?": "dana_x2", "dana|Минджи, капитан волейбольной команды. Нам на пробежке не хватает людей, которые не ноют. Ты не ноешь?": "dana_x3", "wei|Сегодня учим базу. Если упадёшь — это тоже база. Падать надо красиво.": "wei_a1", "wei|Ты поймала ритм! Я говорил, что у тебя крепкие нервы. И ноги.": "wei_a2", "wei|Это видео наберёт миллион. Ну, тысячу. Ну, мама посмотрит.": "wei_a3", "wei|Несерьёзно? Попробуй постоять на одной руке. Серьёзно.": "wei_a4", "wei|Острота «чуть-чуть» по-чэндуски. Предупреждаю: это не «чуть-чуть».": "wei_a5", "wei|Ты не заплакала! Ну, заплакала, но с достоинством. Уважаю.": "wei_a6", "wei|Ты накормила половину этажа. Теперь они думают, что ты хозяйка.": "wei_a7", "wei|Пиццу? На моём хого? Это больно.": "wei_a8", "wei|Я уехал в Сеул за неделю до их главного баттла. Команда вышла без меня и проиграла. С тех пор со мной никто из них не разговаривает.": "wei_a9", "wei|Ты помогла найти слова без оправданий. Отправил. Они прочитали! Пока молчат, но прочитали.": "wei_a10", "wei|Позвонить... Да. Ты права. Пора перестать прятаться за смайликами.": "wei_a11", "wei|Так нельзя. Это мои люди. Я думал, ты понимаешь.": "wei_a12", "wei|Нам нужен ещё один человек на сцене. Простая связка, восемь тактов. Ты знаешь её. Ты видела её сто раз.": "wei_a13", "wei|Ты вышла! Ты станцевала! Мы взяли второе место, но для меня ты первая.": "wei_a14", "wei|Я слышал тебя через музыку. Ты кричала моё имя. Это лучше кубка.": "wei_a15", "wei|Понимаю. Я просто надеялся.": "wei_a16", "aigerim|Ты... видел?": "aigerim_a1", "aigerim|Не льсти. ...Правда лучшее? Ладно. Это вебтун. Никто о нём не знает, и пусть так и остаётся.": "aigerim_a2", "aigerim|Спасибо. Родители считают, что рисунки — это для детей. Так что я рисую между лекциями по дипломатии.": "aigerim_a3", "aigerim|Очень смешно. Забудь, что видел.": "aigerim_a4", "aigerim|По моему плану я еду учить японский для карьеры в министерстве. Этот план я написала в четырнадцать лет и ни разу не меняла.": "aigerim_a5", "aigerim|А я хочу туда, потому что там рисуют мангу. Студии, издательства... Это глупо?": "aigerim_a6", "aigerim|Ты первый, кто так сказал.": "aigerim_a7", "aigerim|План А и план Б сразу. Мне нравится, как ты думаешь.": "aigerim_a8", "aigerim|Да. Он всегда работает. Поэтому мне так страшно его менять.": "aigerim_a9", "aigerim|Наконец кто-то не сказал «миленько». Я перепишу середину. Спасибо.": "aigerim_a10", "aigerim|Так не бывает. Но спасибо.": "aigerim_a11", "aigerim|Я рисовала её три месяца.": "aigerim_a12", "aigerim|«Почему вы хотите учиться в Японии?» Потому что мне страшно всю жизнь делать только то, что я однажды запланировала.": "aigerim_a13", "aigerim|...Это же правда. Ладно. Пишу правду.": "aigerim_a14", "aigerim|Ты не обязан был. Но я рада, что ты здесь.": "aigerim_a15", "aigerim|В следующем году у меня не хватит смелости.": "aigerim_a16", "mira|Оцени по десятибалльной. Только честно.": "mira_a1", "mira|Подлиза! Но приятно.": "mira_a2", "mira|Ха! Справедливо. Учту.": "mira_a3", "mira|Эй! Это было искусство!": "mira_a4", "mira|Это Сохи. Мы вместе учились на худграфе. Её уже выставляют в галереях, а я варю кофе. Я ушла, потому что устала быть «подругой той самой Сохи».": "mira_a5", "mira|...Спасибо. Мне надо было это услышать.": "mira_a6", "mira|Ты странный. Хороший странный.": "mira_a7", "mira|И ты туда же.": "mira_a8", "mira|Будешь помогать? Предупреждаю: краска не отстирывается.": "mira_a9", "mira|У тебя краска на носу. Не трогай! Так даже лучше.": "mira_a10", "mira|Ты моя группа поддержки из одного человека.": "mira_a11", "mira|Скучнооо.": "mira_a12", "mira|Семьдесят пять тысяч вон на рамы. Я коплю на студию, мне жалко...": "mira_a13", "mira|Я верну. Каждую вону. И буду рисовать тебя бесплатно всю жизнь.": "mira_a14", "mira|Из старых поддонов? Это же гениально!": "mira_a15", "mira|Ага. Как всегда.": "mira_a16", "dana|Дыши носом! И не смотри на меня так. Я не тренер, я хуже.": "dana_a1", "dana|Вот это я понимаю! Завтра повторим.": "dana_a2", "dana|Честность засчитана. Идём шагом.": "dana_a3", "dana|Кофе — не спорт.": "dana_a4", "dana|Чего смотришь? Всё нормально.": "dana_a5", "dana|...Ладно. Схожу. Если там ерунда — с тебя шоколадка.": "dana_a6", "dana|Спасибо. Не говори тренеру.": "dana_a7", "dana|Вот и отлично.": "dana_a8", "dana|Я столько лет к этому шла. А теперь сижу и смотрю, как прыгают другие.": "dana_a9", "dana|Ты будешь со мной делать эти скучные упражнения? Каждый день? ...Ненормальный. Спасибо.": "dana_a10", "dana|Пауза... Звучит не так страшно.": "dana_a11", "dana|Ты меня вообще не знаешь.": "dana_a12", "dana|Я тебя слышала через весь зал! Мы прошли!": "dana_a13", "dana|«МИНДЖИ, ПРЫГАЙ!» Серьёзно? ...Повешу его дома.": "dana_a14", "dana|Пришёл. Ну и хорошо.": "dana_a15", "arman|Готово. Только, пожалуйста, не держи сорок вкладок. Ему больно.": "arman_a1", "arman|Правда хочешь? Я могу. Я хорошо объясняю. Наверное.": "arman_a2", "arman|Мне... никогда не покупали кофе. Спасибо.": "arman_a3", "arman|Я просто хотел помочь.": "arman_a4", "arman|...Я никому его не показывал. Только тебе.": "arman_a5", "arman|Им же тоже нужно! Ты гений.": "arman_a6", "arman|Ну... спасибо. Теперь я не усну.": "arman_a7", "arman|Я проверил всё. Оно не работает.": "arman_a8", "arman|Точка с запятой! Ты меня спасла.": "arman_a9", "arman|Я забыл, что люди едят. Спасибо.": "arman_a10", "arman|Я не бросаю.": "arman_a11", "arman|Деньги большие. Но бабушки не будут платить. Они не умеют.": "arman_a12", "arman|Грант... Точно! Ты лучшая.": "arman_a13", "arman|Компромисс. Попробую.": "arman_a14", "arman|Я не ради денег начинал.": "arman_a15", "timur|Эй! Ты меня обманула! Реванш!": "timur_a1", "timur|Наконец-то кто-то ценит мой юмор!": "timur_a2", "timur|Скучно? Мне? Ауч.": "timur_a3", "timur|А? Я не спал! ...Ладно, спал.": "timur_a4", "timur|У родителей магазин на рынке, дела плохо. Я по ночам на складе. Только никому, ладно?": "timur_a5", "timur|Ты уже помогла. Тем, что спросила.": "timur_a6", "timur|Я официально тебя обожаю. В смысле... ну, ты поняла.": "timur_a7", "timur|Это единственное, что у меня своё.": "timur_a8", "timur|Ты сделаешь нам страницу?! Мама, слышала?": "timur_a9", "timur|Ты таскала коробки. Ради нас. Я не забуду.": "timur_a10", "timur|Спасибо, что зашла.": "timur_a11", "timur|...Правда? Тогда это не проигрыш.": "timur_a12", "timur|Спасибо, что не говоришь «это просто игра».": "timur_a13", "timur|Для тебя — может быть.": "timur_a14", "daniyar|Держи крепче. ...У тебя хорошие руки. Для гитары, в смысле.": "daniyar_a1", "daniyar|Наглость. Мне нравится.": "daniyar_a2", "daniyar|Очень смешно.": "daniyar_a3", "daniyar|Может, он прав. Кому нужен ещё один гитарист.": "daniyar_a4", "daniyar|...Мне никто такого не говорил.": "daniyar_a5", "daniyar|Совмещать. Попробую.": "daniyar_a6", "daniyar|И ты туда же.": "daniyar_a7", "daniyar|«Без адвоката»? Ха! Беру.": "daniyar_a8", "daniyar|Я видел. Весь вечер видел только тебя.": "daniyar_a9", "daniyar|Ты ушла. Ну и ладно.": "daniyar_a10", "daniyar|Если я нажму «отправить», отец со мной год не будет разговаривать.": "daniyar_a11", "daniyar|Вместе? Ты пойдёшь со мной к нему? Ты сумасшедшая. Хорошо.": "daniyar_a12", "daniyar|Любое? ...Тогда я попробую.": "daniyar_a13", "daniyar|ТЫ ЧТО СДЕЛАЛА?! ...Ладно. Может, так и надо было.": "daniyar_a14", "sanzhar|Ты съела всё?! Даже я бы не смог.": "sanzhar_a1", "sanzhar|Честная! Переделаю ради тебя.": "sanzhar_a2", "sanzhar|Ну ладно...": "sanzhar_a3", "sanzhar|Ерунда. Каждый день так.": "sanzhar_a4", "sanzhar|Мне... очень нравится, когда ты ругаешься.": "sanzhar_a5", "sanzhar|Уже не болит. Совсем.": "sanzhar_a6", "sanzhar|До какой свадьбы? ...Шучу. Почти.": "sanzhar_a7", "sanzhar|Там будут повара из ресторанов. А я кто? Студент с кривыми круассанами.": "sanzhar_a8", "sanzhar|С тобой не страшно. Месим тесто!": "sanzhar_a9", "sanzhar|Лучшие в городе... Ты их со всеми сравнивала?": "sanzhar_a10", "sanzhar|Да. Наверное.": "sanzhar_a11", "sanzhar|Денег хватит на полгода аренды. Если не получится — всё потеряю.": "sanzhar_a12", "sanzhar|Первой и самой любимой. В смысле... покупательницей.": "sanzhar_a13", "sanzhar|Онлайн-пекарня без аренды? Это умно!": "sanzhar_a14", "sanzhar|Ты права. Мечты — это дорого.": "sanzhar_a15", "lucas|Здесь написано «подпись», «печать» и что-то очень строгое. Я боюсь подписать отказ от почки.": "lucas_a1", "lucas|Ты спасла меня от бюрократии. Во Франции за это ставят памятник.": "lucas_a2", "lucas|Две спасительницы за день. Сеул ко мне добр.": "lucas_a3", "lucas|Смешно. Но я правда боюсь.": "lucas_a4", "lucas|Видишь эту крышу? Ей двести лет, а она до сих пор улыбается. Как ты.": "lucas_a5", "lucas|Рука твёрдая. Ты рисуешь лучше половины моего курса.": "lucas_a6", "lucas|Ты знаешь больше, чем мой путеводитель. И рассказываешь красивее.": "lucas_a7", "lucas|Ладно. Я просто порисую.": "lucas_a8", "lucas|Бабушка в Лионе заболела. Мама говорит, всё под контролем. Но я здесь, а она там.": "lucas_a9", "lucas|Ты даже не спросила «уверен ли ты». Спасибо, что понимаешь.": "lucas_a10", "lucas|Она сказала, что у меня красивая подруга. И что я должен тебя беречь.": "lucas_a11", "lucas|Наверное.": "lucas_a12", "lucas|Я рассчитывал на три дня. Осталось два. И одна рука, потому что второй я держу кофе.": "lucas_a13", "lucas|Ты клеишь крышу ровнее меня. Это унизительно и прекрасно.": "lucas_a14", "lucas|Ты принесла рамён и ушла. Самое романтичное, что со мной случалось.": "lucas_a15", "lucas|Попроще? Это библиотека, а не коробка из-под обуви.": "lucas_a16", "junso|Красные тюльпаны — «признание». Жёлтые — «улыбка». А эти, голубые, — «я жду тебя».": "junso_a1", "junso|У тебя чутьё. Эти цветы сами хотят стоять рядом.": "junso_a2", "junso|Про меня? Наверное, мох. Тихий, зелёный, держит влагу. ...Не смейся.": "junso_a3", "junso|Может быть. Но ветер тоже бывает красивым.": "junso_a4", "junso|Бабушка держала это место сорок лет. Я не хочу быть тем, кто его закроет.": "junso_a5", "junso|Онлайн... Бабушка скажет, что цветам нужны руки. Но руки — мои, а страница — твоя. Давай.": "junso_a6", "junso|Люди будут приходить не за цветами, а за временем. Ты гений.": "junso_a7", "junso|Может. Но я ещё не готов это слышать.": "junso_a8", "junso|Постоянный покупатель, дедушка Пак. Каждую субботу брал жене гвоздики. Её больше нет.": "junso_a9", "junso|Спасибо, что не говорила ничего. Иногда это самое правильное.": "junso_a10", "junso|Ты пошла со мной. Дедушка Пак сказал, что у меня хорошая... ну. Хорошая спутница.": "junso_a11", "junso|Сейчас не время. Прости.": "junso_a12", "junso|Ты пришла. В пять утра. Ради пионов и меня. Я запомню это.": "junso_a13", "junso|Купил. Самый розовый. Он ждёт тебя на прилавке.": "junso_a14", "junso|Ничего. Пионы были хорошие. Жаль, что ты их не видела.": "junso_a15", "wei|Смотри и запоминай! А потом повторяй. Я подстрахую.": "wei_e1", "wei|Ты сделала её с первого раза! Всё, ты в команде. Без отбора.": "wei_e2", "wei|Ты упала на финальном движении. Но с таким лицом, что мы все тебе аплодировали.": "wei_e3", "wei|Свет, ракурс, замедление! Этот клип станет нашей визиткой.": "wei_e4", "wei|Ты накормила всю команду. Они теперь зовут тебя «капитан».": "wei_e5", "wei|Я танцую с девяти лет. Но так легко мне ещё никогда не было.": "wei_e6", "aigerim|Это обложка для конкурса коротких комиксов. Я никому её не показывала. Даже себе, если честно.": "aigerim_e1", "aigerim|Сиреневое небо... Да. Именно так выглядит вечер, когда не хочется домой.": "aigerim_e2", "aigerim|Хм. Зелёное небо — смело. Я подумаю. Спасибо, что не молчишь.": "aigerim_e3", "aigerim|«Тихий отдел». Звучит как то, что я рисую. Записываю.": "aigerim_e4", "aigerim|Идеально не бывает. Но спасибо.": "aigerim_e5", "aigerim|Знаешь, рядом с тобой я рисую быстрее. Наверное, потому что не страшно.": "aigerim_e6", "mira|Не смотри так! Это не грязь, это художественный акцент.": "mira_e1", "mira|Ты красишь ровнее, чем я! Это возмутительно. Оставайся.": "mira_e2", "mira|Ты закрасил мою подпись... Ладно, будет «Харин и тот, кто всё испортил».": "mira_e3", "mira|Ты принёс рамён в два часа ночи. Я выйду за тебя замуж. Шучу. Ешь.": "mira_e4", "mira|Сними мой лучший ракурс! У меня его нет, но сними.": "mira_e5", "mira|Когда стена будет готова, я нарисую там маленькую фигурку. Угадай, кого.": "mira_e6", "dana|Сто подач! Я сделала сто подач! Теперь твоя очередь принимать.": "dana_e1", "dana|Ты принял мою подачу! Никто из команды не принимает мою подачу!": "dana_e2", "dana|Ой! Прости-прости! Ты живой? Мяч в лицо — это знак уважения, честно.": "dana_e3", "dana|Кричи громче! Под твои вопли я подаю лучше!": "dana_e4", "dana|Ты подумал о воде. Я об этом никогда не думаю. Спасибо.": "dana_e5", "dana|В субботу приходи. Буду подавать в твою сторону.": "dana_e6", "arman|Смотри, работает! Ну, почти. Он падает, если нажать кнопку. Любую.": "arman_e1", "arman|Ты нашла его! Одна пропущенная скобка. Ты... ты потрясающая.": "arman_e2", "arman|Не нашли... Но с тобой даже баги не такие страшные.": "arman_e3", "arman|Это кимчи-чигэ? Ты готовишь? Я буду дебажить только с такой едой.": "arman_e4", "arman|Ты уснула... Я не двигался два часа. Код подождёт.": "arman_e5", "arman|Если мы выиграем, я назову проект твоим именем. Если проиграем — тоже.": "arman_e6", "timur|Даю фору: три очка. Ну, может, пять. Ты же пришла.": "timur_e1", "timur|Ты меня обыграла?! Никому не говори. Хотя нет, говори всем!": "timur_e2", "timur|Проиграла, но с каким боем! С тобой даже проигрывать весело.": "timur_e3", "timur|Это нечестно! Ты спросила про мою собаку в момент броска!": "timur_e4", "timur|Ну и ладно. Буду играть для зрителя. Для одного.": "timur_e5", "timur|Знаешь, я сюда хожу каждый вечер. Теперь буду ходить, чтобы встретить тебя.": "timur_e6", "daniyar|Ты попала в гармонию. С первого раза. Останься в группе. Шучу. Нет, не шучу.": "daniyar_e1", "daniyar|Мимо нот, но так искренне, что я почти заплакал. От смеха.": "daniyar_e2", "daniyar|Белая рубашка вместо кожанки? Смело. Попробую. Ради тебя.": "daniyar_e3", "daniyar|Шляпа с пером? ...Нет. Но спасибо, что думаешь обо мне.": "daniyar_e4", "daniyar|Один слушатель — и полный зал в голове.": "daniyar_e5", "daniyar|Эту песню я написал после того, как ты впервые пришла на репетицию.": "daniyar_e6", "sanzhar|Смотри, какие красивые! Ну, кроме того. И того. Остальные красивые.": "sanzhar_e1", "sanzhar|Ты сделала слои! Двадцать семь слоёв! Ты прирождённый пекарь!": "sanzhar_e2", "sanzhar|Это... лепёшка. Очень вкусная лепёшка. Назовём её «авторская».": "sanzhar_e3", "sanzhar|«Круассан, который пёк влюблённый пекарь». Эй! Кто разрешил это писать?": "sanzhar_e4", "sanzhar|Ты съела мою ярмарочную выручку. Это лучший отзыв.": "sanzhar_e5", "sanzhar|Я впервые пеку не один. Оказывается, так тесто поднимается лучше.": "sanzhar_e6", "lucas|Скажи что-нибудь по-французски. Мне не хватает дома.": "lucas_e1", "lucas|«Il pleut, mais je suis content». Твой акцент... Скажи ещё раз. Пожалуйста.": "lucas_e2", "lucas|Ты сказала «я дождливый круассан». Это лучшее, что я слышал за месяц.": "lucas_e3", "lucas|Ты нарисовала нас под одним зонтом. Я не вырву эту страницу никогда.": "lucas_e4", "lucas|Теперь я хочу туда. С гидом. С тобой.": "lucas_e5", "lucas|Дома говорят: дождь — повод сидеть дольше. Я раньше не понимал зачем.": "lucas_e6", "junso|Это первый. Остальные будем собирать вместе.": "junso_e1", "junso|Ты поставила рядом пион и ромашку. «Нежность» и «верность». Ты знала?": "junso_e2", "junso|Колючки наружу... Это букет-ёжик. Я поставлю его на прилавок. Пусть охраняет.": "junso_e3", "junso|Сирень — «первая любовь». Не смотри так, это просто ботаника.": "junso_e4", "junso|В этом фартуке я выгляжу... как настоящий хозяин. Спасибо.": "junso_e5", "junso|Бабушка говорила: цветы растут лучше, когда с ними разговаривают. Похоже, я тоже.": "junso_e6", "dana|Ну всё. Теперь точно нельзя проиграть.": "dana_f7", "dana|Ты увидел дыру в их защите! Мы выиграли сет из-за тебя!": "dana_f8", "dana|Ты кричал «влево!», когда надо было вправо. Но мы выиграли. Не благодаря, а вопреки.": "dana_f9", "mom|Доченька, ты прислала маме конфеты? Ты у меня самая внимательная.": "mom_x19", "lilia|Ты новенькая? Тут тихо. Говори шёпотом или не говори вообще.": "lilia_x2", "emma|Привет! Помоги, пожалуйста. Я третий раз еду не в ту сторону.": "emma_x2", "emma|Я Эмма, из Стокгольма. Будешь моей корейской подругой? Мне очень нужна корейская подруга.": "emma_x3", "nari|Ты смотрела? Ладно, смотри дальше. Только молча.": "nari_x2", "nari|Я Нари. Стримлю. Если умеешь играть — садись рядом. Если не умеешь — тоже садись.": "nari_x3", "rin|Прости, я вслух? Проверяю диалог.": "rin_x2", "rin|Сато Рин, из Киото. Пишу сценарии. Можно я буду записывать, как ты говоришь? У тебя живая речь.": "rin_x3", "rin|Героиня признаётся в любви, а звучит так, будто читает прогноз погоды. Помоги.": "rin_a1", "rin|«Я заметила, что жду среды, потому что в среду ты приходишь». Это... лучше моего. Можно украду?": "rin_a2", "rin|Ты играл героиню. С выражением. Я записала это в память навсегда.": "rin_a3", "rin|«Нормально» — худшее слово для сценариста.": "rin_a4", "rin|Я смотрела его двенадцать раз. Хочу узнать, что увидишь ты.": "rin_a5", "rin|Ты заметил! Молчание — главная реплика фильма. Ты понимаешь кино.": "rin_a6", "rin|Честно. Режиссёр бы оценил. Он тоже снимал медленно.": "rin_a7", "rin|Понятно. Тогда в следующий раз посмотрим что-нибудь со взрывами.": "rin_a8", "rin|Это из киноклуба в Киото. Хотят снова показать мой первый фильм. На премьере зал смеялся в самых грустных местах, и я сбежала через запасной выход.": "rin_a9", "rin|Ты расписал мне реплики как сцену. Я позвоню завтра и скажу «да». Наверное.": "rin_a10", "rin|Спасибо. Тишина с тобой не неловкая. Это редкость.": "rin_a11", "rin|Легко сказать. Я так уже год ни на что не соглашаюсь.": "rin_a12", "rin|Все мои финалы грустные. Герои расстаются, уезжают, молчат. Я не умею писать счастливые.": "rin_a13", "rin|«Она не уехала. Она купила второй зонт». Это наш финал. Я отправила.": "rin_a14", "rin|Ты принёс онигири из круглосуточного. Почти как дома. Спасибо.": "rin_a15", "rin|Без финала? Это как фильм без последнего кадра.": "rin_a16", "lilia|Ты первый, кто не стал болтать во время песни.": "lilia_a1", "lilia|Это я. Никому не говори.": "lilia_a2", "lilia|Я знаю. Грустное честнее.": "lilia_a3", "lilia|«Город не спит, потому что ему тоже страшно»... Беру.": "lilia_a4", "lilia|...Ты понимаешь, что я теперь не смогу это не использовать?": "lilia_a5", "lilia|Это должно было быть смешно?": "lilia_a6", "lilia|Там двести человек. Я не смогу.": "lilia_a7", "lilia|...Хорошо. Смотри только на меня.": "lilia_a8", "lilia|Ладно. Ладно. Я иду.": "lilia_a9", "lilia|Ты в меня не веришь?": "lilia_a10", "lilia|Может, это знак, что пора перестать мечтать.": "lilia_a11", "lilia|Это четыреста километров... Ты серьёзно? ...Ты серьёзно.": "lilia_a12", "lilia|Ты правда так думаешь?": "lilia_a13", "lilia|Ну вот и я так думаю.": "lilia_a14", "emma|Я хотела заказать «что-то не острое». Мне принесли что-то очень острое. Дважды.": "emma_a1", "emma|Ты как живой переводчик! Теперь я знаю, что такое «маун». Это «больно».": "emma_a2", "emma|Ты доверяешь мне свой обед? Это почти шведская помолвка.": "emma_a3", "emma|Очень по-корейски. Сочувствие уровня «острое».": "emma_a4", "emma|Я хочу снять Сеул, который не показывают туристам. Ты будешь моим гидом?": "emma_a5", "emma|Тут пахнет краской и временем. Это лучший кадр за месяц.": "emma_a6", "emma|Город как на ладони! Ты знаешь секретные места.": "emma_a7", "emma|Это... как в Стокгольме. Но ладно, тут хотя бы тепло.": "emma_a8", "emma|Сегодня в Швеции праздник середины лета. Все танцуют вокруг шеста с цветами. А я тут одна.": "emma_a9", "emma|Ты танцуешь «маленьких лягушат»? Ради меня? Я сейчас заплачу. От смеха. И не только.": "emma_a10", "emma|Спасибо, что не говоришь «не грусти». Иногда надо грустить.": "emma_a11", "emma|Ха. Да. Кимчи. Утешение века.": "emma_a12", "emma|Я написала через переводчик. Редактор сказал, что звучит как инструкция к холодильнику.": "emma_a13", "emma|«Бабушка торгуется за редиску, как за судьбу». Это ты придумал? Это гениально.": "emma_a14", "emma|Ты всех знаешь в этом городе! Спасибо.": "emma_a15", "emma|Мило? Это мой первый шанс напечататься!": "emma_a16", "nari|Если проиграем — ты покупаешь рамён. Если выиграем — тоже ты.": "nari_a1", "nari|Ты слушаешь колл! Ты первый, кто слушает колл!": "nari_a2", "nari|Мы проиграли, но чат умер со смеху. Это тоже победа.": "nari_a3", "nari|Сдаваться? В моей смене?": "nari_a4", "nari|Ты за меня заступился. Перед тремя сотнями зрителей. Спасибо.": "nari_a5", "nari|Да. Пять минут. Посиди со мной, ладно?": "nari_a6", "nari|Нормально... Да, наверное.": "nari_a7", "nari|Онлайн я никого не боюсь. А вживую... у меня руки потеют, когда кассир спрашивает «пакет нужен?».": "nari_a8", "nari|Если ты будешь в зале, я буду смотреть только на тебя. Ну, на экран. Но знать, что ты там.": "nari_a9", "nari|Ха. Ладно. Ради этой фразы стоило рассказать.": "nari_a10", "nari|Я так и думала, что ты скажешь «не надо». Все так говорят.": "nari_a11", "nari|Это был твой колл! Мы прошли! Мы — это я и ты!": "nari_a12", "nari|Я слышала тебя через наушники. Это незаконно. Это лучшее.": "nari_a13", "nari|Ты ушёл. Я видела.": "nari_a14", "rin|Пришёл только ты. Значит, это частный показ.": "rin_e1", "rin|Ты заметил, что дождь начинается ровно на признании. Никто никогда не замечает.": "rin_e2", "rin|Ты перепутал героев местами. Но твоя версия сюжета даже интереснее.": "rin_e3", "rin|«Двое в пустом кинозале». Это же мы. Я запишу.": "rin_e4", "rin|Ты принёс солёный и сладкий. Ты подумал обо мне. Спасибо.": "rin_e5", "rin|В Киото я всегда смотрела кино одна. Оказывается, вдвоём фильм длиннее. В хорошем смысле.": "rin_e6", "lilia|Тут не хватает голоса. Я пишу текст, но по-английски у меня выходит как у робота.": "lilia_e1", "lilia|«Light leaks through the static». Это ты придумал? Это теперь припев.": "lilia_e2", "lilia|Хм. Грамматика странная. Но атмосфера есть. Я оставлю пару слов.": "lilia_e3", "lilia|Быстрее... Да, в бридже. Ты слышишь музыку.": "lilia_e4", "lilia|Может, ты прав. Тишина тоже голос.": "lilia_e5", "lilia|Этот трек называется «413». Не спрашивай почему.": "lilia_e6", "emma|Не двигайся! Ты стоишь в идеальном свете. Ну вот, подвинулся.": "emma_e1", "emma|Ого. Ты умеешь стоять в кадре. Это фото будет на выставке.": "emma_e2", "emma|Ты моргнул на всех двенадцати кадрах. Это талант. Странный, но талант.": "emma_e3", "emma|«Ветер на Хангане пахнет весной». Я выучу это наизусть.": "emma_e4", "emma|Меня? Никто никогда не снимает фотографа... Спасибо.": "emma_e5", "emma|В Стокгольме закаты длинные. Но этот — мой любимый. Потому что ты рядом.": "emma_e6", "nari|Я знала! Я знала, что мы вытащим!": "nari_e1", "nari|Ты закрыл матч! Ты! Мой дуэт! Я сейчас всех тут обниму. Начну с тебя.": "nari_e2", "nari|Не вытащили... Но ты играл так, будто от этого зависит моя жизнь. Спасибо.": "nari_e3", "nari|Чат в восторге от «голоса за кадром». Они требуют тебя на постоянку.": "nari_e4", "nari|Ты кормил меня кимпабом между раундами. Это заботливо. И немного стыдно.": "nari_e5", "nari|Обычно я играю, чтобы не думать. С тобой я играю, чтобы было что вспоминать.": "nari_e6", "aigerim|Уже час никто не подошёл. Может, мои комиксы никому не нужны.": "aigerim_f7", "aigerim|Ты кричал «лучшая манга Сеула!» так громко, что пришли даже охранники. И купили!": "aigerim_f8", "aigerim|Ты смутил всех вокруг. Но одна девочка купила зин из жалости к тебе. Это считается.": "aigerim_f9", "aigerim|Теперь к столу подходят! Ты рисуешь лучше, чем говоришь, что не умеешь.": "aigerim_f10", "aigerim|Ты мой первый покупатель. Я подпишу. «Первому читателю». Навсегда.": "aigerim_f11", "aigerim|Я продала двадцать штук. Двадцать человек унесут домой мою историю. И один — меня саму. Это ты, если что.": "aigerim_f12", "mira|Я придумала: весна, кошки и Сеул ночью. Ты рису const MODES={90:{n:'Полная весна',d:'90 дней · каждый день по порядку',txt:'девяносто дней'},42:{n:'Быстрая весна',d:'42 дня · по 14 дней в месяце',txt:'сорок два дня'},21:{n:'Экспресс-весна',d:'21 день · по 7 дней в месяце',txt:'двадцать один день'}};
const BASE_GAIN=0.8; // general slowdown of friendship / stats gain
const MODE=()=>(S&&S.mode)||90;
const DSTEP=()=>DAYS/MODE();
const GM=()=>MODE()===90?BASE_GAIN:BASE_GAIN*DSTEP()*0.85;
function modeSched(m){
  if(m===90)return Array.from({length:DAYS},(_,i)=>i+1);
  const k=m/3,M=[[1,31],[32,61],[62,90]],out=[];
  for(const [a,b] of M)for(let i=0;i<k;i++)out.push(Math.round(a+i*(b-a)/(k-1)));
  const snap=t=>{let bi=0;out.forEach((d,i)=>{if(Math.abs(d-t)<Math.abs(out[bi]-t))bi=i});if(!out.includes(t))out[bi]=t};
  snap(40);snap(80);
  return [...new Set(out)].sort((x,y)=>x-y);
}
function nextDay(d){S.pd=(S.pd||d)+1;if(MODE()===90)return d+1;const sc=modeSched(MODE());const n=sc.find(x=>x>d);return n||DAYS+1}
function daysLeft(){if(MODE()===90)return DAYS-S.day+1;return modeSched(MODE()).filter(x=>x>=S.day).length}
function weekTick(){const wd=(S.day-1)%7;if(MODE()===90)return wd===6;return ((S.pd||1)%7)===0}
function invP(){return MODE()===90?0.33:Math.min(0.75,0.33*Math.pow(DSTEP(),0.6))}
function calDays(){
  const last=(S.lastCal!=null)?S.lastCal:S.day-1;
  let L=Object.keys(CAL).map(Number).filter(d=>d>last&&d<=S.day);
  if(MODE()!==90&&L.includes(80))for(const d of [81,82])if(!L.includes(d)&&CAL[d])L.push(d);
  L.sort((a,b)=>a-b);S.lastCal=Math.max(S.day,...L,last);return L;
}

async function bdPartyInd(id){const B=BDS[id];
  const close=S.rel[id].aff;if(close<25)return false;
  const i=await ask(`${CH[id].n} пишет: «${B.inv}»`,[{t:'Конечно приду',h:'праздник вечером'},{t:'Не получится, просто поздравить'}],{who:id,exp:'h'});
  S.bd[id].done=1;msgOut(id,'С днём рождения! 🎂🎉');
  if(i===1){aff(id,3);await line(id,'n','Жаль... Но спасибо, что вспомнил{|а}.');return true}
  setScene(BG['cg_bd_'+id]?'cg_bd_'+id:B.bg,'eve');setWho(id,'h');
  await say(B.n,id,'h');
  const gifts=Object.keys(GIFTS).filter(k=>S.gifts[k]);
  const opts=B.o.map(o=>({t:o[0],h:typeof o[2]==='object'?`${o[1]}: ${pct(o[2].k,o[2].dc)}`:''}));
  opts.push({t:'Подарить подарок из сумки',h:gifts.length?gifts.map(k=>GIFTS[k].n).join(', '):'в сумке пусто',dis:!gifts.length,why:'В сумке нет подарков'});
  const k=await ask('Как поздравишь?',opts,{who:id,exp:'h'});
  let g,ln,ex='b';
  if(k===3){const gk=pick(gifts);S.gifts[gk]--;g=8;ln=`${GIFTS[gk].n}? Ты правда думал{|а} обо мне. Спасибо.`}
  else{const o=B.o[k];if(typeof o[2]==='object'){if(roll(o[2].k,o[2].dc)){g=12;stat(o[2].k,2);ln=o[3]}else{g=6;ln=o[4];ex='h'}}
    else{const R=ROM[id];if(R.likes.includes(o[2])){g=12;ln=o[3]}else if(R.dis===o[2]){g=3;ln=o[3];ex='n'}else{g=7;ln=o[3];ex='h'}}}
  aff(id,g);mood(8);S.energy=Math.max(0,S.energy-1);S.flags.bdParty=1;
  await line(id,ex,ln);setScene('home','day');return true}
{const _bp=bdParty;bdParty=async function(id){if(BDS[id]&&S.rel[id]){await bdPartyInd(id);return}return _bp.apply(this,arguments)}}

 цель. И ты.": "timur_g14", "timur|Ты правда так думаешь? Тогда, может, я тоже попробую так думать.": "timur_g15", "timur|Мы плакали над «Тренером Картером»! Оба! Никому не говори.": "timur_g16", "timur|Колено заживёт. А то, что ты пришла, когда мне было плохо, я буду помнить всегда.": "timur_g17", "daniyar|Деньги, туры, клипы. Но они хотят, чтобы я пел чужие песни. Про чужие чувства.": "daniyar_g13", "daniyar|Ты говоришь, как я думаю, но боюсь сказать. Спасибо.": "daniyar_g14", "daniyar|Половина песен наши, половина их? Это может сработать. Ты умная.": "daniyar_g15", "daniyar|Это та, что про тебя. Похоже, я уже решил, что не продамся.": "daniyar_g16", "daniyar|Если когда-нибудь будет большой концерт, первый ряд — твой. Навсегда.": "daniyar_g17", "sanzhar|Её нет уже два года. Но когда я пеку по её тетради, будто она рядом.": "sanzhar_g13", "sanzhar|Получилось как у неё. Даже трещинка сверху такая же. Спасибо.": "sanzhar_g14", "sanzhar|Никто не спрашивал. Я говорил час и не заметил. Ты умеешь слушать.": "sanzhar_g15", "sanzhar|Первая страница не её почерком. Она бы одобрила. Ей бы ты понравилась.": "sanzhar_g16", "sanzhar|Бабушка говорила: «Пеки для того, кого хочешь накормить всю жизнь». Я, кажется, понял, о чём она.": "sanzhar_g17", "lucas|Это мечта. Но я впервые не хочу уезжать из города, где живу.": "lucas_g13", "lucas|Ты говоришь «подожду», как будто это легко. Я запомню.": "lucas_g14", "lucas|Сеульские бюро... Я не думал об этом. Ты открываешь мне двери.": "lucas_g15", "lucas|Ты правда приедешь? Тогда я нарисую тебе карту всех кафе.": "lucas_g16", "lucas|Где бы я ни был, мой блокнот всё равно будет начинаться с тебя.": "lucas_g17", "junso|Это сад моего деда. Здесь я понял, что хочу растить цветы. Я никогда никого сюда не приводил.": "junso_g13", "junso|Вместе? Каждую субботу? Тогда здесь снова будут цветы.": "junso_g14", "junso|Это красный пион. Помнишь, что он значит? Не отвечай. Просто помни.": "junso_g15", "junso|Ты не говоришь лишнего. Как цветы. Мне это нравится.": "junso_g16", "junso|Цветы растут медленно. Но если ухаживать, они возвращаются каждую весну. Я хочу, чтобы так было с нами.": "junso_g17", "wei|Если они просто отвернутся? Я заслужил. Я не знаю, что делать. Я правда не знаю.": "wei_g13", "wei|Ты просто сказала им: «Он скучал». И капитан меня обнял. Обнял!": "wei_g14", "wei|Ты поздоровалась с ними по-корейски, по-китайски и по-английски сразу. Они рассмеялись. Это начало.": "wei_g15", "wei|Я вышел в их круг, и они подхватили. Восемь тактов — и будто не было этого года. Что это было?!": "wei_g16", "wei|Я сказал всё. Рука не дрожала, потому что её держала ты.": "wei_g17", "wei|Капитан уехал и написал: «Танцуй. И береги ту девушку». Кажется, он всё понял раньше меня.": "wei_g18"});
Object.assign(VO_LINES,{"rin|Я смотрела этот фильм двадцать раз. Сегодня впервые не помню, чем он кончается.": "bd_rin_0", "rin|Ты заметил отражение в окне? Никто никогда не замечает. С днём рождения меня.": "bd_rin_2", "wei|Ты сделала эту связку! Все кричат! Лучший подарок — партнёр по танцу.": "bd_wei_0", "wei|Вы все вместе считали до трёх? Я сейчас расплачусь, а я не плачу. Это перец.": "bd_wei_2", "aigerim|Ты поёшь фальшиво. Мне нравится. Это первый день рождения, который я не запланировала.": "bd_aigerim_0", "aigerim|...Ладно. Только тебе. Это комикс. Про девочку, которая боится показывать комиксы. Он для тебя.": "bd_aigerim_2", "mira|Это я?! Я такая красивая? Не отвечай. Оставим на стене навсегда.": "bd_mira_0", "mira|Обычно я варю кофе всем. А сегодня кто-то сварил его мне. Он ужасный. Я его допью.": "bd_mira_2", "dana|Ты взял мою подачу?! Ладно, ты заслужил кусок торта первым.": "bd_dana_0", "dana|Поставьте меня! ...Ладно, ещё раз!": "bd_dana_2", "lilia|Ты услышал ошибку во втором куплете? Ты единственный, кому я верю.": "bd_lilia_0", "lilia|Мы только что написали новый трек. В мой день рождения. Я назову его твоим именем.": "bd_lilia_2", "arman|Бабушка плачет и говорит, что ты хорошо на меня влияешь. Это правда.": "bd_arman_0", "arman|Наверное... этот. Я раньше не знал, что отвечу так.": "bd_arman_2", "timur|Ты выиграла! Загадывай желание. ...Подожди, у меня же день рождения. Ладно, загадывай.": "bd_timur_0", "timur|Это ужасно. Расскажи ещё раз, я запишу.": "bd_timur_2", "daniyar|Ты первый, кто это просит. ...Ладно. Эта песня никогда не звучала вслух.": "bd_daniyar_0", "daniyar|Наши голоса звучат вместе. Я напишу для них песню. Это не обсуждается.": "bd_daniyar_2", "sanzhar|Ты испёкла торт... пекарю. Это самое смелое, что я видел. И он вкусный. Правда.": "bd_sanzhar_0", "sanzhar|Ты угадала все пять! Нет, четыре. Нет, все пять! Ты мой лучший дегустатор.": "bd_sanzhar_2", "emma|Ты сказал это так красиво! Повтори, я запишу на диктофон!": "bd_emma_0", "emma|Ты бежишь как в фильме! Я проиграла, но это мой лучший день рождения!": "bd_emma_2", "nari|Мы взяли топ-1 в мой день рождения! Чат сходит с ума, я тоже!": "bd_nari_0", "nari|Без камеры я тихая, ты знаешь. ...Спасибо. Офлайн это даже лучше.": "bd_nari_2", "lucas|Ты нарисовала мой любимый дом... Он кривой. Он идеальный. Я оставлю его в блокноте навсегда.": "bd_lucas_0", "lucas|Это самое романтичное обещание, которое я слышал. Мы будем искать долго.": "bd_lucas_2", "junso|Гардения — тайная любовь. Ты знаешь язык цветов? ...Теперь знаю, что знаешь.": "bd_junso_0", "junso|Обычно мне хорошо молчать одному. С тобой — лучше.": "bd_junso_2"});
