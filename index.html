<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="90 дней весны">
<meta name="theme-color" content="#F4EEF5"><link rel="manifest" href="manifest.webmanifest">

</head><body>
<title>90 дней весны</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-sized game column (D-day header, illustrated scene, story panel with choices) beside a "профиль" side panel; on phones the panel becomes a sheet. */
:root{
  --bg:#efe9f1; --bg2:#e3ecf6; --surface:#ffffff; --surface2:#f6f3f8; --ink:#1d1b2e; --muted:#665f7a; --line:#e2dbe7;
  --accent:#e2557e; --accent-ink:#ffffff; --gold:#e8a800; --love:#d9467a; --good:#24935f; --bad:#cf4b45;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif; --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111c;--bg2:#101523;--surface:#1d1928;--surface2:#272233;--ink:#efeaf5;--muted:#a69db8;--line:#352e44;--accent:#ff7a9f;--accent-ink:#2a0812;--gold:#f2c23a;--love:#ff7aa3;--good:#4cc48a;--bad:#ef6f69;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111c;--bg2:#101523;--surface:#1d1928;--surface2:#272233;--ink:#efeaf5;--muted:#a69db8;--line:#352e44;--accent:#ff7a9f;--accent-ink:#2a0812;--gold:#f2c23a;--love:#ef6b97;--good:#4cc48a;--bad:#ef6f69;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100%;color:var(--ink);font:15px/1.5 var(--f-body)}
.app{display:flex;gap:20px;justify-content:center;align-items:flex-start;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px}
.game{flex:1 1 460px;max-width:500px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:clip;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 24px 60px -20px rgba(60,20,70,.35);display:flex;flex-direction:column;overflow:clip}
.hud{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;padding:12px 16px 10px}
.heroav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--surface2);box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent)}
.heroav img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.heroav svg{width:100%;height:auto}
.heroav:empty,.money:empty{visibility:hidden}
.logo{position:absolute;z-index:2;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 4px 20px rgba(40,10,40,.6);pointer-events:none}
.logo b{font:800 clamp(30px,8.5vw,46px)/1 var(--f-display);letter-spacing:-.03em;text-align:center}
.logo span{font:600 13px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;opacity:.92}
.logo[hidden]{display:none}
.dday{font:800 24px/1 var(--f-display);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dday small{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
.date{min-width:0;line-height:1.25}
.date b{display:block;font-weight:700}
.date span{font-size:13px;color:var(--muted)}
.money{font-weight:700;font-size:13.5px;padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 12px}
.meter .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:linear-gradient(180deg,#ffd45c,var(--gold))}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.stage{position:relative;flex-shrink:0;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:#222}
.stage .scene,.stage .scene svg,.stage .scene img{position:absolute;inset:0;width:100%;height:100%}
.stage .scene img{object-fit:cover;display:block;animation:bgin .5s ease-out}
@keyframes bgin{from{opacity:.4;transform:scale(1.03)}}
.stage .scene .tint{position:absolute;inset:0;pointer-events:none}
.tint.day{background:linear-gradient(180deg,rgba(150,200,255,.16),rgba(255,255,255,.04));mix-blend-mode:soft-light}
.tint.eve{background:linear-gradient(180deg,rgba(150,90,200,.22),rgba(255,120,110,.18));mix-blend-mode:multiply}
.tint.night{background:linear-gradient(180deg,rgba(25,30,90,.72),rgba(10,10,40,.62));mix-blend-mode:multiply}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(10,5,20,.35)),linear-gradient(0deg,rgba(10,5,20,.35),transparent 30%)}
.stage .portrait{position:absolute;bottom:0;right:4%;width:46%;max-width:240px;aspect-ratio:3/4;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.stage .portrait svg{width:100%;height:100%;display:block}
.stage .portrait.photo{width:auto;height:88%;top:6%;bottom:auto;right:4%;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.92);filter:none;box-shadow:0 14px 30px rgba(10,5,25,.45),0 0 0 6px color-mix(in srgb,var(--pc,#fff) 35%,transparent);z-index:1}
.stage .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.stage .portrait.in{animation:pin .32s ease-out}
@keyframes pin{from{transform:translateY(6%);opacity:0}}
.loctag:empty{display:none}
.loctag{position:absolute;z-index:2;left:12px;top:12px;background:rgba(15,20,35,.62);color:#fff;font:600 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.toasts{position:absolute;z-index:2;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:52%}
.toast{background:rgba(255,255,255,.95);color:#1b2034;font:700 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;animation:tin 2.6s ease-out forwards;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.neg{color:#b33a35}
@keyframes tin{0%{transform:translateY(8px);opacity:0}10%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
.story{position:relative;margin-top:-14px;border-radius:20px 20px 0 0;background:var(--surface);z-index:3;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font:700 13.5px/1 var(--f-display);letter-spacing:.01em;padding:7px 12px;border-radius:999px;color:#fff!important;background:var(--pc,var(--accent));box-shadow:0 4px 12px -4px var(--pc,var(--accent))}
.who span{font-size:12px;color:var(--muted)}
.txt{margin:0;font-size:16px;line-height:1.55;text-wrap:pretty}
.txt.fade{animation:tf .25s ease-out}
@keyframes tf{from{opacity:0;transform:translateY(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.pos{color:var(--good)}.chip.neg{color:var(--bad)}.chip.love{color:var(--love)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;min-width:0;transition:border-color .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .t{font-weight:600;line-height:1.3}
.opt .h{font-size:12.5px;color:var(--muted);line-height:1.35}
.opt .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:color-mix(in srgb,var(--accent) 14%,transparent);font:700 11px/1 var(--f-display);color:var(--accent);margin-right:8px;vertical-align:1px}
.opt.next{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#8a5cf0));box-shadow:0 10px 22px -10px var(--accent);border-color:var(--accent);color:var(--accent-ink);align-items:center;text-align:center}
.opt.next .t{font-weight:700}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt.tile{min-height:96px;justify-content:flex-end;background-color:#2a2238;background-size:cover;background-position:center;color:#fff;border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 16px -10px rgba(30,10,40,.6);text-shadow:0 1px 6px rgba(0,0,0,.55)}
.opt.tile .t{font-weight:700}
.opt.tile .h{color:rgba(255,255,255,.86)}
.opt.tile .n{background:rgba(255,255,255,.24);color:#fff}
.opt.tile.dis{opacity:.55;filter:grayscale(.7) brightness(.8)}
.opt.tile:hover{border-color:transparent;box-shadow:inset 0 0 0 2px var(--accent),0 10px 22px -10px rgba(30,10,40,.7)}
.txt .ghost{opacity:0}
.opt.next .h{color:inherit;opacity:.85}
.pre .meters{display:none}
.pre .heroav:empty{display:none}
.phd{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.phd i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.phd i.past{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.phd i.now{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.stage{cursor:pointer}
.opt.person{border-color:color-mix(in srgb,var(--love) 45%,var(--line))}
.opt.person .t::before{content:"♥ ";color:var(--love)}
.opt.back{background:transparent}
.opt .faces{display:flex;gap:4px;margin-top:4px}
.opt .faces i{font-style:normal;font-size:11px;font-weight:700;color:#fff;padding:3px 7px;border-radius:999px}
.namein{display:flex;gap:8px}
.namein input{flex:1;min-width:0;font:500 16px var(--f-body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.namein button{font:700 14px var(--f-body);padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.profbtn{display:none}
.side{flex:0 1 380px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(20,30,60,.08)}
.side h2{font:700 13px/1.3 var(--f-display);margin:18px 0 10px;letter-spacing:.01em}
.side h2:first-child{margin-top:0}
.me{display:flex;gap:12px;align-items:center}
.me .av{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--surface2);flex:none;border:1px solid var(--line)}
.me .av svg{width:100%;height:auto;margin-top:-6px}
.me b{font:700 17px/1.2 var(--f-display)}
.me span{font-size:13px;color:var(--muted)}
.stat{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}
.stat .bar{height:7px}
.stat em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12.5px;padding:5px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);line-height:1.3}
.trait.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;min-width:0}
.slot span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.slot b{font-weight:600}
.inv{display:flex;flex-direction:column;gap:6px}
.inv .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.inv button{font:600 12px var(--f-body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.inv button:disabled{opacity:.45;cursor:default}
.inv button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rel .row{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.rel .av{grid-row:1/3;width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--surface2)}
.rel .av svg{width:100%;height:auto;margin-top:-3px}
.rel .nm{font-weight:600;font-size:14px}
.rel .st{font-size:12px;color:var(--muted);text-align:right}
.rel .st.pair{color:var(--love);font-weight:700}
.rel .bar{grid-column:2/4;height:5px}
.grades{width:100%;border-collapse:collapse;font-size:13.5px}
.grades td{padding:5px 0;border-bottom:1px solid var(--line)}
.grades td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ends{display:flex;flex-wrap:wrap;gap:6px}
.ends span{font-size:12px;padding:4px 8px;border-radius:7px;border:1px dashed var(--line);color:var(--muted)}
.ends span.got{border-style:solid;color:var(--ink);background:var(--surface2)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));display:flex;flex-direction:column;gap:8px}
.card .k{font:700 11px/1 var(--f-display);color:var(--accent);letter-spacing:.08em}
.card h3{margin:0;font:800 22px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0}
.closeprof{display:none}
@media (max-width:900px){
  .app{flex-direction:column;align-items:center}
  .game{flex:none;width:100%}
  .side{display:none;position:fixed;inset:0;z-index:20;border-radius:0;overflow:auto;max-width:none;padding-block:20px;padding-inline:16px}
  .side.open{display:block}
  .profbtn{display:inline-flex;align-items:center;font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
  .closeprof{display:inline-flex;float:right;font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
  .hud{grid-template-columns:auto auto 1fr auto auto}
}
@media (max-width:520px){
  .app{padding:0}
  .game{border-radius:0;border:0;box-shadow:none;min-height:100vh;min-height:100dvh;max-width:none}
  .hud{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .story{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));flex:1}
  .opt.tile{min-height:84px}
  .hud{grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"av dd date prof" "av dd money prof";row-gap:4px;column-gap:10px;padding:12px 14px 10px}
  .heroav{grid-area:av}.dday{grid-area:dd}.date{grid-area:date}.money{grid-area:money;justify-self:start;font-size:12.5px;padding:3px 9px}.profbtn{grid-area:prof}
  .date b{font-size:14px;line-height:1.2}.date span{font-size:12px}
  .profbtn{font-size:12px!important;padding:6px 10px!important}
  .dday{font-size:21px}
  .meters{padding-inline:14px}
  .story{padding:16px 14px 18px}
  .opts.grid{grid-template-columns:1fr}
}
@media (max-width:420px){.opts.grid{grid-template-columns:1fr 1fr}.txt{font-size:15.5px}.hud{gap:8px;padding-inline:12px}.dday{font-size:20px}}
@media (prefers-reduced-motion:reduce){.txt.fade,.toast,.stage .portrait.in{animation:none}}
.sndbtn{position:absolute;z-index:3;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(15,20,35,.55);color:#fff;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sndbtn.off{color:rgba(255,255,255,.6)}
.sndbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pnwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(12,8,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:pnin .2s ease-out}
@keyframes pnin{from{opacity:0}}
.pn{width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:0 24px 60px rgba(10,5,25,.45);overflow:hidden}
.pnh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.pnh small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pnh b{font:800 22px/1.1 var(--f-display);letter-spacing:-.02em}
.pnx{border:0;background:var(--surface2);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0}
.pnb{overflow-y:auto;padding:8px 20px 4px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.pnb section{padding:12px 0 2px;border-top:1px dashed var(--line)}
.pnb section:first-child{border-top:0}
.pnb h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:700 15px/1.2 var(--f-body)}
.pnb .pv{font:800 15px/1 var(--f-display);color:var(--accent)}
.pnb .pnew{font:700 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:999px}
.pnb em{margin-left:auto;font:500 12.5px/1 var(--f-body);color:var(--muted);font-style:normal}
.pnb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.pnb li{font-size:14px;line-height:1.45}
.pnb section:not(.new) li{color:var(--muted)}
.pnok{margin:12px 20px 18px;padding:12px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);cursor:pointer}
.prow{cursor:pointer;border-radius:12px;transition:background .15s}
.prow:hover,.prow:focus-visible{background:var(--surface2);outline:none}
.pn.prof .pfh{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 18%,var(--surface)),var(--surface))}
.pn.prof .pfh img,.pn.prof .pfsvg{width:96px;height:128px;object-fit:cover;border-radius:14px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px color-mix(in srgb,var(--pc) 55%,transparent)}
.pn.prof .pfsvg svg{width:100%;height:100%}
.pn.prof .pfh img.zoomable{cursor:zoom-in;transition:transform .15s}

  let m=1;for(const s of ['gadget','cloth','acc']){const it=eq(s);if(it?.m?.[k])m*=it.m[k]}
  if(k==='game'&&has('esports'))m*=1.15;if(k==='style'&&has('fashion'))m*=1.15;if(k==='charm'&&has('fashion'))m*=1.05;if(k==='lang'&&has('polyglot'))m*=1.15;

  n=Math.max(1,Math.round(n*m));const before=S.st[k];S.st[k]=clamp(S.st[k]+n,0,100);const d=S.st[k]-before;if(d)chip(`+${d} ${STAT_N[k]}`,'pos');

function ask(text,opts,o={}){
  return new Promise(res=>{
    if(o.who!==undefined)setWho(o.who,o.exp||'n');
    const t=$('#txt');typeText(t,fx(text));
    renderChips();
    const box=$('#opts');box.className='opts'+(o.grid?' grid':'');box.innerHTML='';
    opts.forEach((op,i)=>{
      if(typeof op==='string')op={t:op};
      const b=document.createElement('button');b.type='button';b.className='opt'+(op.cls?' '+op.cls:'')+(op.dis?' dis':'');
      b.innerHTML=`<span class="t">${opts.length>1&&!op.cls?.includes('next')?`<span class="n">${i+1}</span>`:''}${esc(fx(op.t))}</span>${op.h?`<span class="h">${esc(fx(op.h))}</span>`:''}${op.faces?`<span class="faces">${op.faces.map(id=>`<i style="background:${CH[id].col}">${esc(CH[id].n)}</i>`).join('')}</span>`:''}`;
      if(op.dis)b.setAttribute('aria-disabled','true');
      b.addEventListener('click',()=>{if(TYPE&&opts.length===1){TYPE.fin();return}if(op.dis){toast(op.why||'Сейчас недоступно',true);return}if(TYPE)TYPE.fin();if(pending!==res)return;pending=null;res(i)});
      box.appendChild(b);
    });
    pending=res;updHud();renderSide();
    if(window.innerWidth<700&&o.scroll!==false)$('.story').scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}
async function say(text,who,exp){await ask(text,[{t:'Далее',cls:'next'}],{who:who===undefined?undefined:who,exp})}
async function line(id,exp,text){await say(text,id,exp)}
async function narr(text){await say(text,curWho||null,$('#portrait').dataset.k?.slice(-1)||'n')}
function askName(def){return new Promise(res=>{
  $('#txt').textContent='Как тебя зовут?';renderChips();
  const box=$('#opts');box.className='opts';box.innerHTML=`<form class="namein"><input id="nameIn" maxlength="14" placeholder="${esc(def)}" autocomplete="off" aria-label="Имя"><button type="submit">Готово</button></form>`;
  const f=box.querySelector('form');setTimeout(()=>$('#nameIn')?.focus(),60);
  f.addEventListener('submit',e=>{e.preventDefault();res(($('#nameIn').value.trim()||def).slice(0,14))});
})}
document.querySelector('.stage').addEventListener('click',()=>{if(TYPE){TYPE.fin();return}const b=document.querySelectorAll('#opts .opt');if(b.length===1&&b[0].classList.contains('next'))b[0].click()});
document.querySelector('.story').addEventListener('click',e=>{if(TYPE&&!e.target.closest('.opt'))TYPE.fin()});
window.appBack=()=>{const sd=$('#side');if(sd.classList.contains('open')){sd.classList.remove('open');return true}return false};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const btns=[...document.querySelectorAll('#opts .opt')];if(!btns.length)return;
  if(/^[1-9]$/.test(e.key)){const b=btns[+e.key-1];if(b){e.preventDefault();b.click()}}
  else if((e.key==='Enter'||e.key===' ')&&btns.length===1){e.preventDefault();btns[0].click()}
});

/* ================= talk & romance ================= */
async function steps(id,arr){
  for(const s of arr){
    if(s[0]==='bg'){setScene(s[1],'night'===s[2]?'night':'eve');continue}
    if(s[0]==='cg'){setScene(s[1]);setWho(id,'h');continue}
    if(s[0]==='n'){await narr(s[1]);continue}
    if(s[0]==='say'){await line(s[1],s[2],s[3]);continue}
    if(s[0]==='c'){
      const i=await ask(s[1],s[2].map(o=>({t:o[0],h:[typeof o[4]==='number'?`−${fmt(o[4])}`:'',o[5]?`${STAT_N[o[5].k]}: шанс ${pct(o[5].k,o[5].dc)}`:''].filter(Boolean).join(' · ')})),{who:id,exp:'n'});const o=s[2][i];
      if(typeof o[4]==='number'){if(S.money>=o[4])money(-o[4]);else{await line(id,'s','Подожди, у тебя же нет столько денег... Ничего. Придумаем что-нибудь.');continue}}
      if(typeof o[4]==='string'&&STAT_N[o[4]])stat(o[4],3);
      if(typeof o[1]==='number'){let d=o[1],ex=o[2],tx=o[3];if(o[5]&&!roll(o[5].k,o[5].dc)){d=Math.min(d,2);ex=o[5].fail[0];tx=o[5].fail[1]}if(S.rel[id])aff(id,d);else fr(id,Math.round(d*0.7));if(o[6]&&o[6].b)for(const [bk,bv] of Object.entries(o[6].b))bump(bk,bv);if(tx)await line(id,ex,tx)}
      else if(o[1]==='yes'){S.partner=id;S.rel[id].aff=Math.max(S.rel[id].aff,90);mood(15);await line(id,o[2],o[3]);await narr('Теперь вы пара. По утрам будут приходить тёплые сообщения, а настроение станет держаться лучше.')}
      else{aff(id,-6);await line(id,o[2],o[3]);return 'no'}
      continue}
    await line(id,s[0],s[1]);
  }
}
function present(loc){
  if(!S)return [];const out=[];const sl=S.slot,we=isWeekend(S.day)||isHoliday(S.day);
  const ids=[...romIds(),...frIds()];
  for(const id of ids){const sch=(ROM[id]||FRIEND[id]).sched;
    if(sch.some(([l,t,w])=>l===loc&&(t==='any'&&sl<=3||t==='day'&&sl<=2||t==='eve'&&sl>=3)&&(w==='any'||(w==='wd'&&!we)||(w==='we'&&we))&&(l!=='uni'||classDay(S.day)))&&S.pres[id]<0.8)out.push(id)}
  if(loc==='river'&&we&&S.slot===3)for(const id of romIds())if(S.rel[id].met&&S.pres[id]>0.65&&!out.includes(id))out.push(id);
  return out.filter(id=>!S.talked[id]);
}
async function talkTo(id){
  S.talked[id]=true;
  if(FRIEND[id])return friendTalk(id);
  const R=ROM[id],r=S.rel[id];
  if(!r.met){r.met=true;await steps(id,R.intro);aff(id,5);await say('Вы обменялись номерами. Теперь можно писать с телефона.',id,'h');return}
  if(r.arc<5&&r.aff>=ARC_AT[r.arc]&&!(r.arc>=3&&S.partner&&S.partner!==id)&&arcReady(id)){
    r.arcDay=S.day;const prev=$('#scene').dataset.k;const res=await steps(id,R.arcs[r.arc]);if(res!=='no')r.arc++;
    if(prev)setScene(prev.replace(/(day|eve|night)$/,''),prev.match(/(day|eve|night)$/)[1]);return}
  const s=stage(id);
  for(;;){
    const opts=[{t:'Поболтать',h:'симпатия, настроение'},{t:'Подарить подарок',h:Object.keys(GIFTS).some(k=>S.gifts[k])?'из сумки':'в сумке пусто',dis:!Object.keys(GIFTS).some(k=>S.gifts[k]),why:'Подарки продаются в торговом центре'}];
    const canDate=r.aff>=30&&S.slot<=3;opts.push({t:'Позвать на прогулку',h:r.aff>=30?'займёт этот ход':'нужна симпатия 30',dis:!canDate,why:'Пока рано звать на свидание'});
    opts.push({t:'Попрощаться',cls:'back'});
    const i=await ask(R.greet[s],opts,{who:id,exp:s>=3?'b':'h'});
    if(i===0){await chat(id);return}
    if(i===1){await giveGift(id);return}
    if(i===2){await date(id);return 'date'}
    return;
  }
}
async function toneReact(id,tone,big){
  const R=ROM[id];let d,e,t;
  if(R.likes.includes(tone)){d=big;e='b';t=pick(R.react.good)}else if(R.dis===tone){d=-3;e='a';t=pick(R.react.bad)}else{d=2;e='n';t=pick(R.react.ok)}
  if(d>0&&S.st.charm>=40)d+=2;if(d>0&&S.st.style>=45)d+=1;if(d>0&&S.mood<25)d=Math.max(1,d-2);if(d>0&&eq('acc')===ITEMS.ring)d+=1;
  aff(id,d);await line(id,e,t);
}
async function chat(id){
  const r=S.rel[id];let pool=QS.map((q,i)=>i).filter(i=>!r.asked.includes(i));if(!pool.length){r.asked=[];pool=QS.map((q,i)=>i)}
  const qi=pick(pool);r.asked.push(qi);const q=QS[qi];
  const order=shuffle(['smart','fun','bold','sweet']);
  const i=await ask(q.q,order.map(t=>({t:q.a[t]})),{who:id,exp:'n'});
  await toneReact(id,order[i],5);mood(3);
}
async function giveGift(id){
  const R=ROM[id];const keys=Object.keys(GIFTS).filter(k=>S.gifts[k]);
  const i=await ask('Что подаришь?',keys.map(k=>({t:`${GIFTS[k].n} ×${S.gifts[k]}`})).concat([{t:'Передумать',cls:'back'}]),{who:id,exp:'n'});
  if(i===keys.length)return;const k=keys[i];S.gifts[k]--;
  if(k==='bento'&&R.gLike!==k){aff(id,9);await line(id,'b','Ты сам{|а} это приготовил{|а}? ...Это лучше любого магазина.'.replace('{|а}',S.pg==='f'?'а':'').replace('{|а}',S.pg==='f'?'а':''));return}
  if(R.gLike===k){aff(id,11);await line(id,'b',R.gift.like)}else if(R.gDis===k){aff(id,1);await line(id,'a',R.gift.bad)}else{aff(id,5);await line(id,'h',R.gift.ok)}
}
async function date(id){
  const R=ROM[id];const keys=Object.keys(DATES);
  const i=await ask('Куда пойдёте?',keys.map(k=>({t:DATES[k].n,h:DATES[k].p?fmt(DATES[k].p)+', 2 энергии':'бесплатно, 2 энергии',dis:S.money<DATES[k].p||S.energy<2,why:S.energy<2?'Нужно 2 энергии':'Не хватает денег'})).concat([{t:'Передумать',cls:'back'}]),{who:id,exp:'h'});
  if(i===keys.length)return;const D=DATES[keys[i]];
  if(D.p)money(-D.p);S.energy-=2;S.slot++;S.rel[id].dates++;
  setScene(D.bg,'eve');const fav=R.fav===keys[i];
  if(fav)aff(id,6);await line(id,fav?'b':'h',fav?R.date.fav:R.date.ok);
  if(S.st.style>=50){aff(id,2);await narr(pick(['Ты сегодня выглядишь особенно хорошо, и это замечают.','Твой образ явно попал в точку.']))}
  const o=shuffle(D.o);const k=await ask(D.q,o.map(x=>({t:x[0]})),{who:id,exp:'n'});
  if(o[k][2]&&S.rel[id].aff<45&&!R.likes.includes('bold')){aff(id,-3);await line(id,'a','Эм... не так быстро.')}
  else await toneReact(id,o[k][1],10);
  mood(12);await say('Вечер получился хорошим.',id,'h');
}
async function friendTalk(id){
  const F=FRIEND[id];if(!S.fmet[id]){S.fmet[id]=true;if(F.intro){await steps(id,F.intro);fr(id,6);await say('Вы обменялись номерами. Теперь можно писать с телефона.',id,'h');return}}
  const a=S.farc[id];
  if(a<F.arcs.length&&S.fr[id]>=FR_AT[a]&&frArcReady(id)){const res=await steps(id,F.arcs[a]);S.farc[id]++;(S.farcD=S.farcD||{})[id]=S.day;return}
  await line(id,'h',pick(F.greet));if(S.mood<30){fr(id,1);await say('Разговор не клеится: ты слишком уставш{ий|ая}.',id,'n');return}fr(id,3);mood(4);
  await say(pick(F.chat||(id==='beka'?['Вы полчаса обсуждаете, почему у соседей сверху вечно что-то падает.','Чанмин показывает новый мем. Ты смеёшься так, что болит живот.','Пьёте чай из одной кружки — вторую кто-то унёс.']:['Суа пересказывает новости потока. Половина из них — правда.','Вы вместе ругаете расписание. Становится легче.'])),id,'l');
}

    const i=await ask('Телефон. Кому написать?',list.map(id=>({t:CH[id].n,h:S.texted[id]?'уже переписывались сегодня':(S.rel[id]?STAGE_N[stage(id)]:id==='mom'?'позвонить':'написать')})).concat([{t:'Убрать телефон',cls:'back'}]),{who:null});

function actAvail(a){
  if(a.sl&&!a.sl.includes(S.slot))return {hide:true};
  if(a.wd&&!classDay(S.day))return {hide:true};
  if(a.req&&!a.req())return a.reqTxt?{dis:true,why:a.reqTxt}:{hide:true};
  if((a.e||0)>S.energy)return {dis:true,why:`Нужно ${a.e} энергии`};
  if(a.money&&S.money<a.money)return {dis:true,why:'Не хватает денег'};
  return {};
}
async function locMenu(key){
  const L=LOCS[key];setScene(key);
  for(;;){
    if(S.slot>=NSLOT)return;
    const acts=L.acts().map(a=>({a,v:actAvail(a)})).filter(x=>!x.v.hide);
    const ppl=present(key).filter(id=>!FRIEND[id]||id!=='kamila'||S.fmet.kamila||true);
    const opts=[...ppl.map(id=>({t:`Подойти: ${(S.rel[id]?!S.rel[id].met:(ROM[id]&&!S.fmet[id]))?(CH[id].p.g==='f'?'незнакомка':'незнакомец'):CH[id].n}`,h:S.rel[id]?(S.rel[id].met?STAGE_N[stage(id)]:ROM[id].about):(S.fmet[id]?'Дружба · '+S.fr[id]:FRIEND[id].about),cls:'person'})),
      ...acts.map(({a,v})=>({t:a.t,h:[typeof a.h==='function'?a.h():a.h,a.e?`−${a.e} эн.`:'',a.money?`−${fmt(a.money)}`:''].filter(Boolean).join(' · '),dis:v.dis,why:v.why})),{t:'Уйти отсюда',cls:'back'}];
    const i=await ask(`${L.n}. ${L.d}`,opts,{who:null});
    if(i<ppl.length){const r=await talkTo(ppl[i]);if(S.slot>=NSLOT||r==='date')return;setScene(key);continue}
    const j=i-ppl.length;if(j===acts.length)return;
    const a=acts[j].a;
    if(a.money){window.__mtag=a.t;money(-a.money);window.__mtag=null}if(a.e)S.energy-=a.e;
    await a.run();
    if(!a.free){const was=S.slot;S.slot++;if(was===NSLOT-1)S.debt=1;await miniEvent(key);if(was===NSLOT-1&&Math.random()<0.3)await nightStore();await checkTraits();return}
    setScene(key);
  }
}

/* ================= exams ================= */
function letter(s){return s>=90?'A':s>=75?'B':s>=60?'C':s>=50?'D':'F'}
function examScore(bonus){
  const att=S.att.total?S.att.went/S.att.total:1;const prep=S.studyDays.filter(d=>d>S.day-8).length;
  let sc=6+S.st.study*0.75+att*15+Math.min(prep,8)*1.8+bonus+(rnd(17)-8);if(has('skipper'))sc-=5;if(eq('gadget')?.m?.study)sc+=2;
  return clamp(Math.round(sc),0,100);
}
async function examMorning(title){
  setScene('exam','day');
  const i=await ask(`${title}. Как начнёшь утро?`,[{t:'Повторить конспект за завтраком',h:'+5 баллов, −2 энергии'},{t:'Спокойно выспаться',h:'+2 балла, настроение +'},{t:'Списать у соседа',h:`Обаяние: шанс ${pct('charm',50)}`}]);
  if(i===0){S.energy=Math.max(0,S.energy-2);return 5}
  if(i===1){mood(4);return 2}
  if(roll('charm',50)){await say('Сосед незаметно двигает листок ближе. Повезло.');return 10}
  mood(-10);await say('Преподаватель кашляет за твоей спиной. Работу забирают, придётся отвечать устно.');return -15;
}
async function midterm(){
  const b=await examMorning('Рубежный контроль');const s=examScore(b);S.mid=s;S.slot=2;
  await say(`Результат рубежного контроля: ${s} баллов из 100. Оценка ${letter(s)}.`,ME(),s>=60?'h':s>=50?'n':'s');
  if(s>=85)await line('prof','h','Отличная работа. Так держать.');else if(s<50)await line('prof','a','Я жду от вас большего. Вы можете лучше.');
  if(s<50){mood(-12);await say('Неприятно. До летней сессии ещё полтора месяца — время есть.')}else if(s>=85){mood(8);await say('Преподаватель ставит тебя в пример группе. Ты стараешься не улыбаться слишком широко.')}
  if(S.fmet.kamila&&S.farc.kamila===1&&S.fr.kamila>=FR_AT[1]){await steps('kamila',FRIEND.kamila.arcs[1]);S.farc.kamila++}
}
async function finalExam(k){
  const n=S.subjects[k];const b=await examMorning(`Экзамен: ${n}`);const s=examScore(b+(n==='Английский язык'?Math.round(S.st.lang/10):n==='Философия'?Math.round(S.st.charm/15):0));
  S.fin.push({n,s});S.slot=2;mood(s>=60?4:-8);
  await say(`${n}: ${s} баллов. Оценка ${letter(s)}.${s<50?' Придётся пересдавать.':''}`,ME(),s>=75?'h':s>=50?'n':'s');
}
async function retakes(){
  const bad=S.fin.filter(f=>f.s<50);if(!bad.length)return;
  setScene('exam','day');await say(`Сегодня пересдача: ${bad.map(f=>f.n).join(', ')}. Это последний шанс.`,null);
  for(const f of bad){const s=examScore(10);if(s>=50){f.s=50;await say(`${f.n}: пересдано на ${s}. В зачётку идёт 50 — но зачёт есть.`)}else{S.flags.expelled=true;await say(`${f.n}: ${s}. Не сдано.`)}}
  S.slot=2;
}

  t('bald',(c.study||0)>=30,'Утром на расчёске подозрительно много волос. Зубрёжка оставляет следы.');
  t('bookworm',(c.study||0)>=20,'Библиотекарша здоровается с тобой по имени. Учёба даётся легче.');
  t('coffee',(c.coffee||0)>=12,'Без кофе ты больше не человек. Зато с кофе — почти супергерой.');
  t('sporty',(c.sport||0)>=14,'Тело привыкло к нагрузке. Сил стало больше.');

async function partnerDrama(){if(!S||!S.partner||S.slot>=NSLOT||S.day<5)return;const P=S.partner;const cd=S.day-(S.flags.dramaDay||-99);if(cd<6*DSTEP())return;
  const gap=S.day-(S.seen[P]||S.day);
  if(gap>=5*DSTEP()){S.flags.dramaDay=S.day;setWho(P,'s');
    await line(P,'s',`Мы не виделись ${gap} дней. Я начинаю думать, что ${GN(P,'я тебе не нужен','я тебе не нужна')}.`);
    const g=hasGift();const opts=[{t:'Извиниться и пообещать свидание на выходных',h:'♥ +'},{t:'Объяснить, что завал с учёбой и работой',h:`Обаяние: шанс ${pct('charm',40)}`}];
    if(g)opts.push({t:`Подарить: ${GIFTS[g].n}`,h:'♥ ++'});opts.push({t:`Сказать, что ${GN(P,'он','она')} драматизирует`,h:'♥ −−'});
    const i=await ask('Что ответишь?',opts,{who:P,exp:'s'});const last=opts.length-1;
    if(i===0){aff(P,6);await line(P,'h','Ладно... Но место выбираю я. И ты не опаздываешь.')}
    else if(i===1){if(roll('charm',40)){aff(P,3);await line(P,'b','Понимаю. Просто пиши мне чаще, хорошо? Даже глупости.')}else{aff(P,-4);await line(P,'a','У всех завал. Но время на важных людей как-то находят.')}}
    else if(g&&i===2){S.gifts[g]--;aff(P,9);await line(P,'b','Ты купил{|а} это для меня? ...Ладно. Прощаю. Но только потому, что это мило.')}
    else{aff(P,-10);await line(P,'a','Вот как. Ясно.')}
    S.seen[P]=S.day;if(i===last&&S.rel[P].aff<60||S.rel[P].aff<25)await breakUp(P);return}
  if((S.flags.jeal||0)>=12&&S.flags.jealId&&S.rel[S.flags.jealId]&&Math.random()<.55){const R=S.flags.jealId;S.flags.jeal=0;S.flags.dramaDay=S.day;

    const i=await ask('Что ответишь?',[{t:`«Мы просто друзья. У меня есть только ты»`,h:'♥ +'},{t:`Предложить погулять втроём, чтобы не было секретов`,h:`Обаяние: шанс ${pct('charm',45)}`},{t:'Отшутиться',h:'♥ −'},{t:`Признаться, что тебя тянет к ${ACC[R]}`,h:'честно, но больно'}],{who:P,exp:'a'});
    if(i===0){aff(P,4);await line(P,'b','Прости. Я просто очень этим дорожу.')}
    else if(i===1){if(roll('charm',45)){aff(P,5);aff(R,2);await say(`Вечер втроём неожиданно удаётся: ${CH[P].n} и ${CH[R].n} спорят о фильмах и хохочут. Ревность растворяется где-то между вторым и третьим кофе.`)}else{aff(P,-3);await line(P,'s','Было очень неловко. Давай больше так не делать.')}}
    else if(i===2){aff(P,-3);await line(P,'a','Мне не смешно.')}
    else{aff(P,-15);await line(P,'s','Спасибо, что честно. Это лучше, чем врать.');if(S.rel[P].aff<70)await breakUp(P)}
    S.seen[P]=S.day}
}

  const t=MGAC.currentTime,o=MGAC.createOscillator(),g=MGAC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.connect(g);g.connect(MGAC.destination);o.start(t);o.stop(t+(d||.12)+.02)}catch(e){}}
function mgShell(title,sub){const w=document.createElement('div');w.className='mgwrap';w.setAttribute('role','dialog');w.setAttribute('aria-label',title);

/* ---------- rhythm ---------- */
function rhythmGame(title,diff){return new Promise(res=>{
  if(window.__noType){res(Math.random());return}
  const w=mgShell(title,'Ритм-игра');const b=w.querySelector('.mgb');
  b.innerHTML=`<p class="mgtip">Жми на кнопку, когда нота входит в круг. Чем точнее, тем лучше.</p>
   <div class="rtrack"><div class="rring"></div><div class="rnotes"></div></div>
   <div class="rstat"><span class="rj"></span><span class="rc"></span></div>
   <button type="button" class="rtap">Старт</button>`;
  const notesEl=b.querySelector('.rnotes'),tap=b.querySelector('.rtap'),jEl=b.querySelector('.rj'),cEl=b.querySelector('.rc'),track=b.querySelector('.rtrack');
  const beat=60000/(diff==='hard'?118:100),lead=1700,N=20;let T=[],t=beat*2;
  for(let i=0;i<N;i++){T.push(t);t+=beat*(Math.random()<.3?0.5:(Math.random()<.2?1.5:1))}
  const notes=T.map(tt=>({t:tt,hit:null,el:null}));let t0=0,raf=0,score=0,combo=0,done=false,started=false;const PER=70,GOOD=150;
  const end=()=>{if(done)return;done=true;cancelAnimationFrame(raf);const s=Math.min(1,score/N);
    b.innerHTML=`<div class="mgres"><b>${mgGrade(s)}</b><span>Точность ${Math.round(s*100)}%</span></div><button type="button" class="rtap">Готово</button>`;
    const prev2=window.appBack;b.querySelector('.rtap').onclick=()=>{w.remove();window.appBack=prev;res(s)};window.appBack=()=>{w.remove();window.appBack=prev;res(s);return true}};
  const judge=()=>{const now=performance.now()-t0;let best=null,bd=1e9;for(const n of notes){if(n.hit!=null)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n}}
    if(best&&bd<=GOOD){best.hit=bd<=PER?1:.6;score+=best.hit;combo++;best.el&&best.el.classList.add('ok');mgBeep(best.hit===1?880:660,.1);jEl.textContent=best.hit===1?'Идеально':'Хорошо';jEl.className='rj '+(best.hit===1?'p':'g')}
    else{combo=0;mgBeep(180,.08,.1);jEl.textContent='Мимо';jEl.className='rj m'}
    cEl.textContent=combo>1?'Комбо ×'+combo:''};
  const loop=()=>{const now=performance.now()-t0;const W=track.clientWidth,ringX=W*.18;
    for(const n of notes){const dt=n.t-now;if(!n.el&&dt<lead&&n.hit==null){n.el=document.createElement('i');notesEl.appendChild(n.el)}
      if(n.el){const x=ringX+dt/lead*(W-ringX);n.el.style.transform=`translateX(${x}px)`;if(dt<-GOOD&&n.hit==null){n.hit=0;combo=0;n.el.classList.add('miss');jEl.textContent='Мимо';jEl.className='rj m';cEl.textContent=''}
        if(dt<-400){n.el.remove();n.el=null}}}
    if(now>T[T.length-1]+600){end();return}raf=requestAnimationFrame(loop)};
  tap.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;if(!started){started=true;tap.textContent='Жми!';t0=performance.now();mgBeep(440,.05,.05);raf=requestAnimationFrame(loop);return}judge()});
  const kd=e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();tap.dispatchEvent(new PointerEvent('pointerdown'))}};document.addEventListener('keydown',kd);
  const prev=window.appBack;const quit=()=>{document.removeEventListener('keydown',kd);if(!started){w.remove();window.appBack=prev;res(null);return}end()};
  w.querySelector('.mgx').onclick=quit;window.appBack=()=>{quit();return true};
  const mo=new MutationObserver(()=>{if(!document.body.contains(w)){document.removeEventListener('keydown',kd);mo.disconnect()}});mo.observe(document.body,{childList:true});
})}

 "mira_a15", "mira|Ага. Как всегда.": "mira_a16", "dana|Дыши носом! И не смотри на меня так. Я не тренер, я хуже.": "dana_a1", "dana|Вот это я понимаю! Завтра повторим.": "dana_a2", "dana|Честность засчитана. Идём шагом.": "dana_a3", "dana|Кофе — не спорт.": "dana_a4", "dana|Чего смотришь? Всё нормально.": "dana_a5", "dana|...Ладно. Схожу. Если там ерунда — с тебя шоколадка.": "dana_a6", "dana|Спасибо. Не говори тренеру.": "dana_a7", "dana|Вот и отлично.": "dana_a8", "dana|Я столько лет к этому шла. А теперь сижу и смотрю, как прыгают другие.": "dana_a9", "dana|Ты будешь со мной делать эти скучные упражнения? Каждый день? ...Ненормальный. Спасибо.": "dana_a10", "dana|Пауза... Звучит не так страшно.": "dana_a11", "dana|Ты меня вообще не знаешь.": "dana_a12", "dana|Я тебя слышала через весь зал! Мы прошли!": "dana_a13", "dana|«МИНДЖИ, ПРЫГАЙ!» Серьёзно? ...Повешу его дома.": "dana_a14", "dana|Пришёл. Ну и хорошо.": "dana_a15", "arman|Готово. Только, пожалуйста, не держи сорок вкладок. Ему больно.": "arman_a1", "arman|Правда хочешь? Я могу. Я хорошо объясняю. Наверное.": "arman_a2", "arman|Мне... никогда не покупали кофе. Спасибо.": "arman_a3", "arman|Я просто хотел помочь.": "arman_a4", "arman|...Я никому его не показывал. Только тебе.": "arman_a5", "arman|Им же тоже нужно! Ты гений.": "arman_a6", "arman|Ну... спасибо. Теперь я не усну.": "arman_a7", "arman|Я проверил всё. Оно не работает.": "arman_a8", "arman|Точка с запятой! Ты меня спасла.": "arman_a9", "arman|Я забыл, что люди едят. Спасибо.": "arman_a10", "arman|Я не бросаю.": "arman_a11", "arman|Деньги большие. Но бабушки не будут платить. Они не умеют.": "arman_a12", "arman|Грант... Точно! Ты лучшая.": "arman_a13", "arman|Компромисс. Попробую.": "arman_a14", "arman|Я не ради денег начинал.": "arman_a15", "timur|Эй! Ты меня обманула! Реванш!": "timur_a1", "timur|Наконец-то кто-то ценит мой юмор!": "timur_a2", "timur|Скучно? Мне? Ауч.": "timur_a3", "timur|А? Я не спал! ...Ладно, спал.": "timur_a4", "timur|У родителей магазин на рынке, дела плохо. Я по ночам на складе. Только никому, ладно?": "timur_a5", "timur|Ты уже помогла. Тем, что спросила.": "timur_a6", "timur|Я официально тебя обожаю. В смысле... ну, ты поняла.": "timur_a7", "timur|Это единственное, что у меня своё.": "timur_a8", "timur|Ты сделаешь нам страницу?! Мама, слышала?": "timur_a9", "timur|Ты таскала коробки. Ради нас. Я не забуду.": "timur_a10", "timur|Спасибо, что зашла.": "timur_a11", "timur|...Правда? Тогда это не проигрыш.": "timur_a12", "timur|Спасибо, что не говоришь «это просто игра».": "timur_a13", "timur|Для тебя — может быть.": "timur_a14", "daniyar|Держи крепче. ...У тебя хорошие руки. Для гитары, в смысле.": "daniyar_a1", "daniyar|Наглость. Мне нравится.": "daniyar_a2", "daniyar|Очень смешно.": "daniyar_a3", "daniyar|Может, он прав. Кому нужен ещё один гитарист.": "daniyar_a4", "daniyar|...Мне никто такого не говорил.": "daniyar_a5", "daniyar|Совмещать. Попробую.": "daniyar_a6", "daniyar|И ты туда же.": "daniyar_a7", "daniyar|«Без адвоката»? Ха! Беру.": "daniyar_a8", "daniyar|Я видел. Весь вечер видел только тебя.": "daniyar_a9", "daniyar|Ты ушла. Ну и ладно.": "daniyar_a10", "daniyar|Если я нажму «отправить», отец со мной год не будет разговаривать.": "daniyar_a11", "daniyar|Вместе? Ты пойдёшь со мной к нему? Ты сумасшедшая. Хорошо.": "daniyar_a12", "daniyar|Любое? ...Тогда я попробую.": "daniyar_a13", "daniyar|ТЫ ЧТО СДЕЛАЛА?! ...Ладно. Может, так и надо было.": "daniyar_a14", "sanzhar|Ты съела всё?! Даже я бы не смог.": "sanzhar_a1", "sanzhar|Честная! Переделаю ради тебя.": "sanzhar_a2", "sanzhar|Ну ладно...": "sanzhar_a3", "sanzhar|Ерунда. Каждый день так.": "sanzhar_a4", "sanzhar|Мне... очень нравится, когда ты ругаешься.": "sanzhar_a5", "sanzhar|Уже не болит. Совсем.": "sanzhar_a6", "sanzhar|До какой свадьбы? ...Шучу. Почти.": "sanzhar_a7", "sanzhar|Там будут повара из ресторанов. А я кто? Студент с кривыми круассанами.": "sanzhar_a8", "sanzhar|С тобой не страшно. Месим тесто!": "sanzhar_a9", "sanzhar|Лучшие в городе... Ты их со всеми сравнивала?": "sanzhar_a10", "sanzhar|Да. Наверное.": "sanzhar_a11", "sanzhar|Денег хватит на полгода аренды. Если не получится — всё потеряю.": "sanzhar_a12", "sanzhar|Первой и самой любимой. В смысле... покупательницей.": "sanzhar_a13", "sanzhar|Онлайн-пекарня без аренды? Это умно!": "sanzhar_a14", "sanzhar|Ты права. Мечты — это дорого.": "sanzhar_a15", "lucas|Здесь написано «подпись», «печать» и что-то очень строгое. Я боюсь подписать отказ от почки.": "lucas_a1", "lucas|Ты спасла меня от бюрократии. Во Франции за это ставят памятник.": "lucas_a2", "lucas|Две спасительницы за день. Сеул ко мне добр.": "lucas_a3", "lucas|Смешно. Но я правда боюсь.": "lucas_a4", "lucas|Видишь эту крышу? Ей двести лет, а она до сих пор улыбается. Как ты.": "lucas_a5", "lucas|Рука твёрдая. Ты рисуешь лучше половины моего курса.": "lucas_a6", "lucas|Ты знаешь больше, чем мой путеводитель. И рассказываешь красивее.": "lucas_a7", "lucas|Ладно. Я просто порисую.": "lucas_a8", "lucas|Бабушка в Лионе заболела. Мама говорит, всё под контролем. Но я здесь, а она там.": "lucas_a9", "lucas|Ты даже не спросила «уверен ли ты». Спасибо, что понимаешь.": "lucas_a10", "lucas|Она сказала, что у меня красивая подруга. И что я должен тебя беречь.": "lucas_a11", "lucas|Наверное.": "lucas_a12", "lucas|Я рассчитывал на три дня. Осталось два. И одна рука, потому что второй я держу кофе.": "lucas_a13", "lucas|Ты клеишь крышу ровнее меня. Это унизительно и прекрасно.": "lucas_a14", "lucas|Ты принесла рамён и ушла. Самое романтичное, что со мной случалось.": "lucas_a15", "lucas|Попроще? Это библиотека, а не коробка из-под обуви.": "lucas_a16", "junso|Красные тюльпаны — «признание». Жёлтые — «улыбка». А эти, голубые, — «я жду тебя».": "junso_a1", "junso|У тебя чутьё. Эти цветы сами хотят стоять рядом.": "junso_a2", "junso|Про меня? Наверное, мох. Тихий, зелёный, держит влагу. ...Не смейся.": "junso_a3", "junso|Может быть. Но ветер тоже бывает красивым.": "junso_a4", "junso|Бабушка держала это место сорок лет. Я не хочу быть тем, кто его закроет.": "junso_a5", "junso|Онлайн... Бабушка скажет, что цветам нужны руки. Но руки — мои, а страница — твоя. Давай.": "junso_a6", "junso|Люди будут приходить не за цветами, а за временем. Ты гений.": "junso_a7", "junso|Может. Но я ещё не готов это слышать.": "junso_a8", "junso|Постоянный покупатель, дедушка Пак. Каждую субботу брал жене гвоздики. Её больше нет.": "junso_a9", "junso|Спасибо, что не говорила ничего. Иногда это самое правильное.": "junso_a10", "junso|Ты пошла со мной. Дедушка Пак сказал, что у меня хорошая... ну. Хорошая спутница.": "junso_a11", "junso|Сейчас не время. Прости.": "junso_a12", "junso|Ты пришла. В пять утра. Ради пионов и меня. Я запомню это.": "junso_a13", "junso|Купил. Самый розовый. Он ждёт тебя на прилавке.": "junso_a14", "junso|Ничего. Пионы были хорошие. Жаль, что ты их не видела.": "junso_a15", "wei|Смотри и запоминай! А потом повторяй. Я подстрахую.": "wei_e1", "wei|Ты сделала её с первого раза! Всё, ты в команде. Без отбора.": "wei_e2", "wei|Ты упала на финальном движении. Но с таким лицом, что мы все тебе аплодировали.": "wei_e3", "wei|Свет, ракурс, замедление! Этот клип станет нашей визиткой.": "wei_e4", "wei|Ты накормила всю команду. Они теперь зовут тебя «капитан».": "wei_e5", "wei|Я танцую с девяти лет. Но так легко мне ещё никогда не было.": "wei_e6", "aigerim|Это обложка для конкурса коротких комиксов. Я никому её не показывала. Даже себе, если честно.": "aigerim_e1", "aigerim|Сиреневое небо... Да. Именно так выглядит вечер, когда не хочется домой.": "aigerim_e2", "aigerim|Хм. Зелёное небо — смело. Я подумаю. Спасибо, что не молчишь.": "aigerim_e3", "aigerim|«Тихий отдел». Звучит как то, что я рисую. Записываю.": "aigerim_e4", "aigerim|Идеально не бывает. Но спасибо.": "aigerim_e5", "aigerim|Знаешь, рядом с тобой я рисую быстрее. Наверное, потому что не страшно.": "aigerim_e6", "mira|Не смотри так! Это не грязь, это художественный акцент.": "mira_e1", "mira|Ты красишь ровнее, чем я! Это возмутительно. Оставайся.": "mira_e2", "mira|Ты закрасил мою подпись... Ладно, будет «Харин и тот, кто всё испортил».": "mira_e3", "mira|Ты принёс рамён в два часа ночи. Я выйду за тебя замуж. Шучу. Ешь.": "mira_e4", "mira|Сними мой лучший ракурс! У меня его нет, но сними.": "mira_e5", "mira|Когда стена будет готова, я нарисую там маленькую фигурку. Угадай, кого.": "mira_e6", "dana|Сто подач! Я сделала сто подач! Теперь твоя очередь принимать.": "dana_e1", "dana|Ты принял мою подачу! Никто из команды не принимает мою подачу!": "dana_e2", "dana|Ой! Прости-прости! Ты живой? Мяч в лицо — это знак уважения, честно.": "dana_e3", "dana|Кричи громче! Под твои вопли я подаю лучше!": "dana_e4", "dana|Ты подумал о воде. Я об этом никогда не думаю. Спасибо.": "dana_e5", "dana|В субботу приходи. Буду подавать в твою сторону.": "dana_e6", "arman|Смотри, работает! Ну, почти. Он падает, если нажать кнопку. Любую.": "arman_e1", "arman|Ты нашла его! Одна пропущенная скобка. Ты... ты потрясающая.": "arman_e2", "arman|Не нашли... Но с тобой даже баги не такие страшные.": "arman_e3", "arman|Это кимчи-чигэ? Ты готовишь? Я буду дебажить только с такой едой.": "arman_e4", "arman|Ты уснула... Я не двигался два часа. Код подождёт.": "arman_e5", "arman|Если мы выиграем, я назову проект твоим именем. Если проиграем — тоже.": "arman_e6", "timur|Даю фору: три очка. Ну, может, пять. Ты же пришла.": "timur_e1", "timur|Ты меня обыграла?! Никому не говори. Хотя нет, говори всем!": "timur_e2", "timur|Проиграла, но с каким боем! С тобой даже проигрывать весело.": "timur_e3", "timur|Это нечестно! Ты спросила про мою собаку в момент броска!": "timur_e4", "timur|Ну и ладно. Буду играть для зрителя. Для одного.": "timur_e5", "timur|Знаешь, я сюда хожу каждый вечер. Теперь буду ходить, чтобы встретить тебя.": "timur_e6", "daniyar|Ты попала в гармонию. С первого раза. Останься в группе. Шучу. Нет, не шучу.": "daniyar_e1", "daniyar|Мимо нот, но так искренне, что я почти заплакал. От смеха.": "daniyar_e2", "daniyar|Белая рубашка вместо кожанки? Смело. Попробую. Ради тебя.": "daniyar_e3", "daniyar|Шляпа с пером? ...Нет. Но спасибо, что думаешь обо мне.": "daniyar_e4", "daniyar|Один слушатель — и полный зал в голове.": "daniyar_e5", "daniyar|Эту песню я написал после того, как ты впервые пришла на репетицию.": "daniyar_e6", "sanzhar|Смотри, какие красивые! Ну, кроме того. И того. Остальные красивые.": "sanzhar_e1", "sanzhar|Ты сделала слои! Двадцать семь слоёв! Ты прирождённый пекарь!": "sanzhar_e2", "sanzhar|Это... лепёшка. Очень вкусная лепёшка. Назовём её «авторская».": "sanzhar_e3", "sanzhar|«Круассан, который пёк влюблённый пекарь». Эй! Кто разрешил это писать?": "sanzhar_e4", "sanzhar|Ты съела мою ярмарочную выручку. Это лучший отзыв.": "sanzhar_e5", "sanzhar|Я впервые пеку не один. Оказывается, так тесто поднимается лучше.": "sanzhar_e6", "lucas|Скажи что-нибудь по-французски. Мне не хватает дома.": "lucas_e1", "lucas|«Il pleut, mais je suis content». Твой акцент... Скажи ещё раз. Пожалуйста.": "lucas_e2", "lucas|Ты сказала «я дождливый круассан». Это лучшее, что я слышал за месяц.": "lucas_e3", "lucas|Ты нарисовала нас под одним зонтом. Я не вырву эту страницу никогда.": "lucas_e4", "lucas|Теперь я хочу туда. С гидом. С тобой.": "lucas_e5", "lucas|Дома говорят: дождь — повод сидеть дольше. Я раньше не понимал зачем.": "lucas_e6", "junso|Это первый. Остальные будем собирать вместе.": "junso_e1", "junso|Ты поставила рядом пион и ромашку. «Нежность» и «верность». Ты знала?": "junso_e2", "junso|Колючки наружу... Это букет-ёжик. Я поставлю его на прилавок. Пусть охраняет.": "junso_e3", "junso|Сирень — «первая любовь». Не смотри так, это просто ботаника.": "junso_e4", "junso|В этом фартуке я выгляжу... как настоящий хозяин. Спасибо.": "junso_e5", "junso|Бабушка говорила: цветы растут лучше, когда с ними разговаривают. Похоже, я тоже.": "junso_e6", "dana|Ну всё. Теперь точно нельзя проиграть.": "dana_f7", "dana|Ты увидел дыру в их защите! Мы выиграли сет из-за тебя!": "dana_f8", "dana|Ты кричал «влево!», когда надо было вправо. Но мы выиграли. Не благодаря, а вопреки.": "dana_f9", "mom|Доченька, ты прислала маме конфеты? Ты у меня самая внимательная.": "mom_x19", "lilia|Ты новенькая? Тут тихо. Говори шёпотом или не говори вообще.": "lilia_x2", "emma|Привет! Помоги, пожалуйста. Я третий раз еду не в ту сторону.": "emma_x2", "emma|Я Эмма, из Стокгольма. Будешь моей корейской подругой? Мне очень нужна корейская подруга.": "emma_x3", "nari|Ты смотрела? Ладно, смотри дальше. Только молча.": "nari_x2", "nari|Я Нари. Стримлю. Если умеешь играть — садись рядом. Если не умеешь — тоже садись.": "nari_x3", "rin|Прости, я вслух? Проверяю диалог.": "rin_x2", "rin|Сато Рин, из Киото. Пишу сценарии. Можно я буду записывать, как ты говоришь? У тебя живая речь.": "rin_x3", "rin|Героиня признаётся в любви, а звучит так, будто читает прогноз погоды. Помоги.": "rin_a1", "rin|«Я заметила, что жду среды, потому что в среду ты приходишь». Это... лучше моего. Можно украду?": "rin_a2", "rin|Ты играл героиню. С выражением. Я записала это в память навсегда.": "rin_a3", "rin|«Нормально» — худшее слово для сценариста.": "rin_a4", "rin|Я смотрела его двенадцать раз. Хочу узнать, что увидишь ты.": "rin_a5", "rin|Ты заметил! Молчание — главная реплика фильма. Ты понимаешь кино.": "rin_a6", "rin|Честно. Режиссёр бы оценил. Он тоже снимал медленно.": "rin_a7", "rin|Понятно. Тогда в следующий раз посмотрим что-нибудь со взрывами.": "rin_a8", "rin|Это из киноклуба в Киото. Хотят снова показать мой первый фильм. На премьере зал смеялся в самых грустных местах, и я сбежала через запасной выход.": "rin_a9", "rin|Ты расписал мне реплики как сцену. Я позвоню завтра и скажу «да». Наверное.": "rin_a10", "rin|Спасибо. Тишина с тобой не неловкая. Это редкость.": "rin_a11", "rin|Легко сказать. Я так уже год ни на что не соглашаюсь.": "rin_a12", "rin|Все мои финалы грустные. Герои расстаются, уезжают, молчат. Я не умею писать счастливые.": "rin_a13", "rin|«Она не уехала. Она купила второй зонт». Это наш финал. Я отправила.": "rin_a14", "rin|Ты принёс онигири из круглосуточного. Почти как дома. Спасибо.": "rin_a15", "rin|Без финала? Это как фильм без последнего кадра.": "rin_a16", "lilia|Ты первый, кто не стал болтать во время песни.": "lilia_a1", "lilia|Это я. Никому не говори.": "lilia_a2", "lilia|Я знаю. Грустное честнее.": "lilia_a3", "lilia|«Город не спит, потому что ему тоже страшно»... Беру.": "lilia_a4", "lilia|...Ты понимаешь, что я теперь не смогу это не использовать?": "lilia_a5", "lilia|Это должно было быть смешно?": "lilia_a6", "lilia|Там двести человек. Я не смогу.": "lilia_a7", "lilia|...Хорошо. Смотри только на меня.": "lilia_a8", "lilia|Ладно. Ладно. Я иду.": "lilia_a9", "lilia|Ты в меня не веришь?": "lilia_a10", "lilia|Может, это знак, что пора перестать мечтать.": "lilia_a11", "lilia|Это четыреста километров... Ты серьёзно? ...Ты серьёзно.": "lilia_a12", "lilia|Ты правда так думаешь?": "lilia_a13", "lilia|Ну вот и я так думаю.": "lilia_a14", "emma|Я хотела заказать «что-то не острое». Мне принесли что-то очень острое. Дважды.": "emma_a1", "emma|Ты как живой переводчик! Теперь я знаю, что такое «маун». Это «больно».": "emma_a2", "emma|Ты доверяешь мне свой обед? Это почти шведская помолвка.": "emma_a3", "emma|Очень по-корейски. Сочувствие уровня «острое».": "emma_a4", "emma|Я хочу снять Сеул, который не показывают туристам. Ты будешь моим гидом?": "emma_a5", "emma|Тут пахнет краской и временем. Это лучший кадр за месяц.": "emma_a6", "emma|Город как на ладони! Ты знаешь секретные места.": "emma_a7", "emma|Это... как в Стокгольме. Но ладно, тут хотя бы тепло.": "emma_a8", "emma|Сегодня в Швеции праздник середины лета. Все танцуют вокруг шеста с цветами. А я тут одна.": "emma_a9", "emma|Ты танцуешь «маленьких лягушат»? Ради меня? Я сейчас заплачу. От смеха. И не только.": "emma_a10", "emma|Спасибо, что не говоришь «не грусти». Иногда надо грустить.": "emma_a11", "emma|Ха. Да. Кимчи. Утешение века.": "emma_a12", "emma|Я написала через переводчик. Редактор сказал, что звучит как инструкция к холодильнику.": "emma_a13", "emma|«Бабушка торгуется за редиску, как за судьбу». Это ты придумал? Это гениально.": "emma_a14", "emma|Ты всех знаешь в этом городе! Спасибо.": "emma_a15", "emma|Мило? Это мой первый шанс напечататься!": "emma_a16", "nari|Если проиграем — ты покупаешь рамён. Если выиграем — тоже ты.": "nari_a1", "nari|Ты слушаешь колл! Ты первый, кто слушает колл!": "nari_a2", "nari|Мы проиграли, но чат умер со смеху. Это тоже победа.": "nari_a3", "nari|Сдаваться? В моей смене?": "nari_a4", "nari|Ты за меня заступился. Перед тремя сотнями зрителей. Спасибо.": "nari_a5", "nari|Да. Пять минут. Посиди со мной, ладно?": "nari_a6", "nari|Нормально... Да, наверное.": "nari_a7", "nari|Онлайн я никого не боюсь. А вживую... у меня руки потеют, когда кассир спрашивает «пакет нужен?».": "nari_a8", "nari|Если ты будешь в зале, я буду смотреть только на тебя. Ну, на экран. Но знать, что ты там.": "nari_a9", "nari|Ха. Ладно. Ради этой фразы стоило рассказать.": "nari_a10", "nari|Я так и думала, что ты скажешь «не надо». Все так говорят.": "nari_a11", "nari|Это был твой колл! Мы прошли! Мы — это я и ты!": "nari_a12", "nari|Я слышала тебя через наушники. Это незаконно. Это лучшее.": "nari_a13", "nari|Ты ушёл. Я видела.": "nari_a14", "rin|Пришёл только ты. Значит, это частный показ.": "rin_e1", "rin|Ты заметил, что дождь начинается ровно на признании. Никто никогда не замечает.": "rin_e2", "rin|Ты перепутал героев местами. Но твоя версия сюжета даже интереснее.": "rin_e3", "rin|«Двое в пустом кинозале». Это же мы. Я запишу.": "rin_e4", "rin|Ты принёс солёный и сладкий. Ты подумал обо мне. Спасибо.": "rin_e5", "rin|В Киото я всегда смотрела кино одна. Оказывается, вдвоём фильм длиннее. В хорошем смысле.": "rin_e6", "lilia|Тут не хватает голоса. Я пишу текст, но по-английски у меня выходит как у робота.": "lilia_e1", "lilia|«Light leaks through the static». Это ты придумал? Это теперь припев.": "lilia_e2", "lilia|Хм. Грамматика странная. Но атмосфера есть. Я оставлю пару слов.": "lilia_e3", "lilia|Быстрее... Да, в бридже. Ты слышишь музыку.": "lilia_e4", "lilia|Может, ты прав. Тишина тоже голос.": "lilia_e5", "lilia|Этот трек называется «413». Не спрашивай почему.": "lilia_e6", "emma|Не двигайся! Ты стоишь в идеальном свете. Ну вот, подвинулся.": "emma_e1", "emma|Ого. Ты умеешь стоять в кадре. Это фото будет на выставке.": "emma_e2", "emma|Ты моргнул на всех двенадцати кадрах. Это талант. Странный, но талант.": "emma_e3", "emma|«Ветер на Хангане пахнет весной». Я выучу это наизусть.": "emma_e4", "emma|Меня? Никто никогда не снимает фотографа... Спасибо.": "emma_e5", "emma|В Стокгольме закаты длинные. Но этот — мой любимый. Потому что ты рядом.": "emma_e6", "nari|Я знала! Я знала, что мы вытащим!": "nari_e1", "nari|Ты закрыл матч! Ты! Мой дуэт! Я сейчас всех тут обниму. Начну с тебя.": "nari_e2", "nari|Не вытащили... Но ты играл так, будто от этого зависит моя жизнь. Спасибо.": "nari_e3", "nari|Чат в восторге от «голоса за кадром». Они требуют тебя на постоянку.": "nari_e4", "nari|Ты кормил меня кимпабом между раундами. Это заботливо. И немного стыдно.": "nari_e5", "nari|Обычно я играю, чтобы не думать. С тобой я играю, чтобы было что вспоминать.": "nari_e6", "aigerim|Уже час никто не подошёл. Может, мои комиксы никому не нужны.": "aigerim_f7", "aigerim|Ты кричал «лучшая манга Сеула!» так громко, что пришли даже охранники. И купили!": "aigerim_f8", "aigerim|Ты смутил всех вокруг. Но одна девочка купила зин из жалости к тебе. Это считается.": "aigerim_f9", "aigerim|Теперь к столу подходят! Ты рисуешь лучше, чем говоришь, что не умеешь.": "aigerim_f10", "aigerim|Ты мой первый покупатель. Я подпишу. «Первому читателю». Навсегда.": "aigerim_f11", "aigerim|Я продала двадцать штук. Двадцать человек унесут домой мою историю. И один — меня саму. Это ты, если что.": "aigerim_f12", "mira|Я придумала: весна, кошки и Сеул ночью. Ты рисуешь кошек. Только не таких страшных, как в прошлый раз.": "mira_f7", "mira|Это лучшая кошка на стене! Она смотрит прямо в душу. Оставляем.": "mira_f8", "mira|Это... енот? Ладно, пусть будет енот-гость. Он всё равно милый.": "mira_f9", "mira|Ты держал стремянку два часа и ни разу не пожаловался. Кто ты такой вообще?": "mira_f10", "mira|Мы все в краске, и это самый счастливый вечер месяца!": "mira_f11", "mira|Каждое утро я буду открывать кафе и видеть эту стену. И вспоминать, кто рисовал со мной.": "mira_f12", "dana|Ты накормил всю команду. Теперь они спрашивают, когда ты придёшь ещё.": "dana_f10", "dana|«Минджи — ракета»? Ты нарисовал плакат? Я его сохраню.": "dana_f11", "dana|Раньше я играла, чтобы не подвести тренера. Сегодня я играла, чтобы ты увидел. Это другое чувство.": "dana_f12", "lilia|Послушай припев. Честно. Мне нужен человек, который не будет хвалить из вежливости.": "lilia_f7", "lilia|Ты напел это, и всё сложилось! Как ты это сделал? Ладно, не отвечай. Просто пой ещё.": "lilia_f8", "lilia|Ты напел мелодию из рекламы рамёна. Но ритм верный. Я поняла, что ты имел в виду.": "lilia_f9", "lilia|«Lights don’t lie, but I do». Это звучит как настоящая песня. Спасибо.": "lilia_f10", "lilia|Больно. Но ты прав. Спасибо, что не соврал.": "lilia_f11", "lilia|Я назову трек по времени, когда мы его доделали. «2:47». Только мы будем знать, что это значит.": "lilia_f12", "emma|Смотри, бабушка жарит бинтэтток! Я должна это съесть и сфотографировать. В таком порядке.": "emma_f7", "emma|Бабушка разрешила снимать и дала нам добавку! Ты волшебник.": "emma_f8", "emma|Ты сказал что-то не то, и бабушка начала тебя кормить. Тоже результат.": "emma_f9", "emma|Мы съели живого осьминога! Ну, почти живого. Это мой лучший день в Корее.": "emma_f10", "emma|Ты мой личный ассистент. Плата — портрет на плёнку.": "emma_f11", "emma|Через год я забуду, как пахли эти пирожки. Но не забуду, кто держал меня за рукав, чтобы я не потерялась.": "emma_f12", "nari|Без чата странно. Тихо. Но мне нравится эта тишина.": "nari_f7", "nari|Мы прошли его с тридцатой попытки! Ты не сдался ни разу. Я тоже.": "nari_f8", "nari|Мы застряли на боссе, но ты так смешно ругался, что я забыла о счёте.": "nari_f9", "nari|Ты приготовил мне рамён с яйцом. Как мама делала. Я сейчас не плачу, это пар.": "nari_f10", "nari|Ты учишься быстрее, чем я думала. Скоро будешь моим дуэтом не из жалости.": "nari_f11", "nari|Знаешь, ты первый человек, которого я пустила сюда. В комнату и вообще.": "nari_f12", "rin|Твой герой — человек, который всегда говорит правду. Мне кажется, тебе не придётся играть.": "rin_f7", "rin|Ты дошёл до финальной реплики, и я забыла, что это читка. Это было по-настоящему.": "rin_f8", "rin|Ты перепутал страницы и признался в любви официанту. Он покраснел. Сцена удалась.": "rin_f9", "rin|Твоя реплика лучше. Я поменяю. И напишу тебя в соавторы. Мелким шрифтом.": "rin_f10", "rin|Ты сыграл бабушку! И кота! Я смеялась так, что нас выгнали. Ну, почти.": "rin_f11", "rin|Обычно я пишу героев из головы. Теперь у одного из них твой голос.": "rin_f12", "arman|Если завтра оно упадёт при всех, я уйду из программирования. В пекари. К Доюну.": "arman_f7", "arman|Ты нашла три бага за десять минут! Ты страшный человек. Спасибо.": "arman_f8", "arman|Ты сломала приложение так, как я не мог представить. Это тоже полезно. Наверное.": "arman_f9", "arman|Я проснулся, и баг оказался очевидным. Ты спасла проект тем, что выключила меня.": "arman_f10", "arman|Теперь оно выглядит как настоящее приложение! Даже если внутри хаос.": "arman_f11", "arman|Я всегда думал, что код пишут в одиночку. Оказывается, с тобой он компилируется лучше.": "arman_f12", "timur|Правило одно: если промажешь, я покупаю мороженое. Если попадёшь — тоже я. Мне просто нравится покупать тебе мороженое.": "timur_f7", "timur|Трёшка! Ты попала трёшку! Я на тебе женюсь. Ой. Я сказал это вслух?": "timur_f8", "timur|Мяч улетел в реку. Мы час его доставали. Лучший матч в моей жизни.": "timur_f9", "timur|Они смеялись и промахивал const MODES={90:{n:'Полная весна',d:'90 дней · каждый день по порядку',txt:'девяносто дней'},42:{n:'Быстрая весна',d:'42 дня · по 14 дней в месяце',txt:'сорок два дня'},21:{n:'Экспресс-весна',d:'21 день · по 7 дней в месяце',txt:'двадцать один день'}};
const BASE_GAIN=0.8; // general slowdown of friendship / stats gain
const MODE=()=>(S&&S.mode)||90;
const DSTEP=()=>DAYS/MODE();
const GM=()=>MODE()===90?BASE_GAIN:BASE_GAIN*DSTEP()*0.85;
function modeSched(m){
  if(m===90)return Array.from({length:DAYS},(_,i)=>i+1);
  const k=m/3,M=[[1,31],[32,61],[62,90]],out=[];
  for(const [a,b] of M)for(let i=0;i<k;i++)out.push(Math.round(a+i*(b-a)/(k-1)));
  const snap=t=>{let bi=0;out.forEach((d,i)=>{if(Math.abs(d-t)<Math.abs(out[bi]-t))bi=i});if(!out.includes(t))out[bi]=t};
  snap(40);snap(80);
  return [...new Set(out)].sort((x,y)=>x-y);
}
function nextDay(d){S.pd=(S.pd||d)+1;if(MODE()===90)return d+1;const sc=modeSched(MODE());const n=sc.find(x=>x>d);return n||DAYS+1}
function daysLeft(){if(MODE()===90)return DAYS-S.day+1;return modeSched(MODE()).filter(x=>x>=S.day).length}
function weekTick(){const wd=(S.day-1)%7;if(MODE()===90)return wd===6;return ((S.pd||1)%7)===0}
function invP(){return MODE()===90?0.33:Math.min(0.75,0.33*Math.pow(DSTEP(),0.6))}
function calDays(){
  const last=(S.lastCal!=null)?S.lastCal:S.day-1;
  let L=Object.keys(CAL).map(Number).filter(d=>d>last&&d<=S.day);
  if(MODE()!==90&&L.includes(80))for(const d of [81,82])if(!L.includes(d)&&CAL[d])L.push(d);
  L.sort((a,b)=>a-b);S.lastCal=Math.max(S.day,...L,last);return L;
}

function genWx(seed){const r=rng32(seed),out=[null];
  for(let d=1;d<=DAYS;d++){const m=d<=31?0:d<=61?1:2;
    const P=[[['sun',.32],['cloud',.28],['rain',.12],['dust',.14],['snow',.14]],[['sun',.4],['cloud',.24],['rain',.2],['dust',.16]],[['sun',.5],['cloud',.2],['rain',.2],['storm',.1]]][m];
    let x=r(),k=P[P.length-1][0];for(const [n,p] of P){if(x<p){k=n;break}x-=p}
    if(k==='snow'&&d>18)k='rain';
    if([1,35,70,90].includes(d))k='sun';
    let t=Math.round(2+d*0.24+(r()*6-3));if(k==='rain'||k==='storm')t-=2;if(k==='snow')t=Math.min(t-3,2);
    out.push({k,t})}

  await say('Утро. По коридору гремит голос коменданта: «Плановая проверка комнат! Четвёртый этаж — первый!»');
  await line('beka','o',catTx('Кот! {cat}! Куда мы денем кота?!'));
  const opts=[{t:'Спрятать в шкафу',h:`шанс ${Math.round((.45+(S.cat.love||0)/250)*100)}%`},{t:'Честно показать кота и уговорить',h:`Обаяние: ${pct('charm',45)}`}];
  const suaOk=S.fmet.kamila&&S.fr.kamila>=35;if(suaOk)opts.push({t:'Попросить Суа отвлечь коменданта',h:'Суа поможет'});
  const i=await ask('Что делаешь?',opts);
  let ok=false;
  if(i===0){ok=Math.random()<.45+(S.cat.love||0)/250;await say(catTx(ok?'Комендант заглядывает в шкаф и видит только куртки. {cat} сидит в рукаве твоего пуховика и не дышит. Профессионал.':'Из шкафа раздаётся оскорблённое «мяу». Комендант медленно поворачивается.'))}
  else if(i===1){ok=roll('charm',45);if(ok){S.cat.legal=1;await say(catTx('Комендант долго смотрит на {cat}. {cat} долго смотрит на коменданта. «...Ладно. Но если найду шерсть в коридоре, он мой». Кажется, вам только что разрешили.'))}}
  else{ok=true;fr('kamila',3);await line('kamila','h','Я староста. Я умею задавать коменданту вопросы сорок минут подряд.')}
  if(ok){mood(6);return}
  money(-10000);mood(-5);S.cat.legal=1;
  await say(catTx('Штраф 10 000 ₩ и объяснительная. Но на выходе комендант бормочет: «Ладно, пусть живёт. Только чтобы я его не видел», — и украдкой чешет {cat} за ухом.'));
}
async function catDay(){if(!S||S.day<2||CAL[S.day])return;
  const c=S.cat;
  if(!c){if(S.day>=12&&!S.flags.catNo){await catMeet(false);return}if(S.flags.catNo&&!S.flags.catNo2&&S.day>=S.flags.catNo+8){await catMeet(true);return}return}
  if(c.st==='fed'&&S.day>=c.day+Math.max(3,Math.round(3*DSTEP()))){await catAdopt();return}
  if(c.st==='home'&&S.day>=58&&!S.flags.catCheck){await catInspect();return}
  if(c.st==='home'&&Math.random()<.2){setScene('home','day');setWho(null);c.love=Math.min(100,(c.love||0)+2);mood(2);await say(catTx(pick(CAT_MORN)))}
}
{const _ha=LOCS.home.acts;LOCS.home.acts=()=>{const a=_ha();if(S&&S.cat&&S.cat.st==='home')a.splice(1,0,A({t:'Поиграть с котом',free:true,h:()=>`${S.cat.n} · настроение +, не тратит время`,req:()=>S.catDay!==S.day,reqTxt:'Кот уже наигрался и спит',run:async()=>{S.catDay=S.day;S.cat.love=Math.min(100,(S.cat.love||0)+6);mood(6);count('cat');await say(catTx(pick(CAT_PLAY)))}}));return a}}

async function bdPartyInd(id){const B=BDS[id];
  const close=S.rel[id].aff;if(close<25)return false;
  const i=await ask(`${CH[id].n} пишет: «${B.inv}»`,[{t:'Конечно приду',h:'праздник вечером'},{t:'Не получится, просто поздравить'}],{who:id,exp:'h'});
  S.bd[id].done=1;msgOut(id,'С днём рождения! 🎂🎉');msgIn(id,pick(i===1?BD_THX_NO:BD_THX),id,1);
  if(i===1){aff(id,3);await line(id,'n','Жаль... Но спасибо, что вспомнил{|а}.');return true}
  setScene(BG['cg_bd_'+id]?'cg_bd_'+id:B.bg,'eve');setWho(id,'h');
  await say(B.n,id,'h');
  const gifts=Object.keys(GIFTS).filter(k=>S.gifts[k]);
  const opts=B.o.map(o=>({t:o[0],h:typeof o[2]==='object'?`${o[1]}: ${pct(o[2].k,o[2].dc)}`:''}));
  opts.push({t:'Подарить подарок из сумки',h:gifts.length?gifts.map(k=>GIFTS[k].n).join(', '):'в сумке пусто',dis:!gifts.length,why:'В сумке нет подарков'});
  const k=await ask('Как поздравишь?',opts,{who:id,exp:'h'});
  let g,ln,ex='b';
  if(k===3){const gk=pick(gifts);S.gifts[gk]--;g=8;ln=`${GIFTS[gk].n}? Ты правда думал{|а} обо мне. Спасибо.`}
  else{const o=B.o[k];if(typeof o[2]==='object'){if(roll(o[2].k,o[2].dc)){g=12;stat(o[2].k,2);ln=o[3]}else{g=6;ln=o[4];ex='h'}}
    else{const R=ROM[id];if(R.likes.includes(o[2])){g=12;ln=o[3]}else if(R.dis===o[2]){g=3;ln=o[3];ex='n'}else{g=7;ln=o[3];ex='h'}}}
  aff(id,g);mood(8);S.energy=Math.max(0,S.energy-1);S.flags.bdParty=1;
  await line(id,ex,ln);setScene('home','day');return true}
{const _bp=bdParty;bdParty=async function(id){if(BDS[id]&&S.rel[id]){await bdPartyInd(id);return}return _bp.apply(this,arguments)}}

Object.assign(VO_LINES,{"sanzhar|Это хлеб с кимчи. Это с сыром и мёдом. Это... я сам не знаю. Пробуй.": "sanzhar_f7", "sanzhar|Хлеб с яблоком и корицей в форме сердца! Мы назовём его твоим именем. Ну, почти.": "sanzhar_f8", "sanzhar|Он сгорел снаружи и сырой внутри. Как моё сердце сейчас. Шучу. Наверное.": "sanzhar_f9", "sanzhar|Ты сказала, что с кимчи — гениально, а с мёдом — ужас. Ты права в обоих случаях.": "sanzhar_f10", "sanzhar|Теперь у булочек есть лица! Покупатели будут в восторге.": "sanzhar_f11", "sanzhar|Я всегда пёк для других. А сегодня пёк, чтобы ты улыбнулась. Получилось?": "sanzhar_f12", "lucas|Нарисуй, что видишь. Не красиво — честно. Я хочу знать, как ты видишь этот город.": "lucas_f7", "lucas|У тебя город живой. У меня — архитектура. У тебя — люди. Я учусь у тебя.": "lucas_f8", "lucas|Это... башня? Похоже на морковку. Мне нравится морковка. Оставь.": "lucas_f9", "lucas|Теперь у каждой крыши есть история. Я перерисую всё заново.": "lucas_f10", "lucas|Ты правда купила замок? Тогда я выброшу ключ в самый дальний куст.": "lucas_f11", "lucas|В Париже я рисовал соборы. Здесь я впервые рисую человека. Угадай кого.": "lucas_f12", "junso|Белый пион — застенчивость. Розовый — счастливый брак. Красный... скажу потом.": "junso_f7", "junso|Ты собрала его так, будто знала эту пару сто лет. У тебя талант к нежности.": "junso_f8", "junso|Букет получился немного сумасшедший. Невеста сказала, что это лучший. Ты удачливая.": "junso_f9", "junso|Твой почерк — как букет. Гости будут хранить эти открытки.": "junso_f10", "junso|Красный — «я не могу перестать о тебе думать». Почему я покраснел? Не знаю. Цветочная пыльца.": "junso_f11", "junso|Обычно я молчу, пока работаю. С тобой хочется рассказать про каждый цветок.": "junso_f12", "wei|Это я в шесть лет. В костюме панды. Не смейся. Ладно, смейся.": "wei_f7", "wei|Мапо тофу как у мамы! Я сейчас позвоню ей и скажу, что ты лучшая.": "wei_f8", "wei|Слишком остро даже для меня! Но мы съели всё. Это любовь.": "wei_f9", "wei|Никто раньше не спрашивал про бабушку. Теперь ты знаешь, откуда я.": "wei_f10", "wei|Ты сказала «ни хао, мама»! Она ответила тридцатью стикерами.": "wei_f11", "wei|Здесь, в Сеуле, я часто скучаю по дому. А с тобой эта кухня тоже немного дом.": "wei_f12", "aigerim|Если там «нет», я вернусь к старому плану. Если «да»... я не знаю, что тогда.": "aigerim_g13", "aigerim|«Мы хотим опубликовать вашу историю». Это «да»! Это «да», и ты первый, кто это видит!": "aigerim_g14", "aigerim|Даже если там «нет»? Ты правда так думаешь? Тогда я открою.": "aigerim_g15", "aigerim|Ты купил торт ещё до письма? А если бы был отказ? Ты в меня верил. Это лучше любого письма.": "aigerim_g16", "aigerim|В четырнадцать я решила, что стану дипломатом. А теперь хочу рисовать истории. И чтобы одна из них была про нас.": "aigerim_g17", "mira|Я рисовала его месяц. По памяти. Знаешь, как сложно рисовать человека, о котором всё время думаешь?": "mira_g13", "mira|Лучшая, потому что я рисовала с любовью. Ой. Это я вслух?": "mira_g14", "mira|Вдвоём? Тогда тебе придётся позировать. Долго. Очень долго.": "mira_g15", "mira|Ты пахнешь кофе. Как моя жизнь. Не отпускай пока.": "mira_g16", "mira|Обычно я рисую то, что хочу запомнить. Тебя я хочу не только помнить.": "mira_g17", "dana|Сборная — это мечта. Но это значит уехать на всё лето. И я боюсь, что… ну… ты понимаешь.": "dana_g13", "dana|Правда? Тогда я выиграю для тебя медаль. Хотя бы маленькую.": "dana_g14", "dana|Каждое утро в шесть? Ты сам предложил, назад дороги нет!": "dana_g15", "dana|Ты правда приедешь? Тогда я буду искать тебя на трибуне, как сегодня.": "dana_g16", "dana|Я привыкла бежать к мячу. А сейчас хочется бежать к тебе.": "dana_g17", "lilia|Я всегда сидела за пультом. Сцена — это другое. Там все смотрят.": "lilia_g13", "lilia|Твоя рука тёплая. Всё. Я иду.": "lilia_g14", "lilia|Тогда я буду петь только для одного человека в зале.": "lilia_g15", "lilia|Ты сказал «не бойся, они все в трусах». Я пою, и мне смешно. Спасибо.": "lilia_g16", "lilia|Последняя песня была про тебя. Ты понял? Не отвечай. Я знаю, что понял.": "lilia_g17", "emma|Это ты. В первый день, у метро, когда показывал мне дорогу. Я сняла тебя тайком.": "emma_g13", "emma|Потому что на нём человек, который изменил мой Сеул.": "emma_g14", "emma|Нет! Это главная работа. Но я напечатаю тебе копию. Подписанную.": "emma_g15", "emma|Теперь у нас есть фото фото. Это очень по-нашему.": "emma_g16", "emma|В Стокгольме я снимала пустые улицы. Здесь я научилась снимать людей. Одного особенно.": "emma_g17", "nari|Они все смотрят. В чате было легче, там не видно, как я краснею.": "nari_g13", "nari|Ты разогрел зал! Теперь они смеются, а не смотрят. Я могу дышать.": "nari_g14", "nari|Наш сигнал «держись». Ты помнишь. Я справлюсь.": "nari_g15", "nari|Турнир! Я умею играть, а не говорить. Ты гений!": "nari_g16", "nari|Сто человек сегодня узнали, какая я офлайн. А ты знал это раньше всех.": "nari_g17", "rin|Если они не засмеются в нужном месте, я сбегу через запасной выход.": "rin_g13", "rin|Ты засмеялся, и весь зал за тобой! Ты мой самый важный зритель.": "rin_g14", "rin|Я не помню, как прошёл фильм. Я помню только твою руку.": "rin_g15", "rin|Ты встал первым. Потом встали все. Я этого никогда не забуду.": "rin_g16", "rin|В титрах есть строчка «Спасибо человеку, который всегда говорит правду». Это про тебя.": "rin_g17", "arman|Я рассчитал пик метеоров с точностью до минуты. Осталось три минуты. Я волнуюсь сильнее, чем перед хакатоном.": "arman_g13", "arman|Ты загадала, чтобы я спал больше? Это самое заботливое желание во Вселенной.": "arman_g14", "arman|Ты правда слушаешь! Обычно на этом месте люди засыпают.": "arman_g15", "arman|Я забыл про метеоры. Все расчёты насмарку. Не жалею.": "arman_g16", "arman|Я всегда считал вероятности. Вероятность встретить тебя была ничтожной. И всё равно случилось.": "arman_g17", "timur|Без баскетбола я не знаю, кто я. Просто высокий парень с плохими оценками.": "timur_g13", "timur|Ты расписала упражнения по дням! Теперь у меня есть авится.": "junso_g16", "junso|Цветы растут медленно. Но если ухаживать, они возвращаются каждую весну. Я хочу, чтобы так было с нами.": "junso_g17", "wei|Если они просто отвернутся? Я заслужил. Я не знаю, что делать. Я правда не знаю.": "wei_g13", "wei|Ты просто сказала им: «Он скучал». И капитан меня обнял. Обнял!": "wei_g14", "wei|Ты поздоровалась с ними по-корейски, по-китайски и по-английски сразу. Они рассмеялись. Это начало.": "wei_g15", "wei|Я вышел в их круг, и они подхватили. Восемь тактов — и будто не было этого года. Что это было?!": "wei_g16", "wei|Я сказал всё. Рука не дрожала, потому что её держала ты.": "wei_g17", "wei|Капитан уехал и написал: «Танцуй. И береги ту девушку». Кажется, он всё понял раньше меня.": "wei_g18"});
Object.assign(VO_LINES,{"rin|Я смотрела этот фильм двадцать раз. Сегодня впервые не помню, чем он кончается.": "bd_rin_0", "rin|Ты заметил отражение в окне? Никто никогда не замечает. С днём рождения меня.": "bd_rin_2", "wei|Ты сделала эту связку! Все кричат! Лучший подарок — партнёр по танцу.": "bd_wei_0", "wei|Вы все вместе считали до трёх? Я сейчас расплачусь, а я не плачу. Это перец.": "bd_wei_2", "aigerim|Ты поёшь фальшиво. Мне нравится. Это первый день рождения, который я не запланировала.": "bd_aigerim_0", "aigerim|...Ладно. Только тебе. Это комикс. Про девочку, которая боится показывать комиксы. Он для тебя.": "bd_aigerim_2", "mira|Это я?! Я такая красивая? Не отвечай. Оставим на стене навсегда.": "bd_mira_0", "mira|Обычно я варю кофе всем. А сегодня кто-то сварил его мне. Он ужасный. Я его допью.": "bd_mira_2", "dana|Ты взял мою подачу?! Ладно, ты заслужил кусок торта первым.": "bd_dana_0", "dana|Поставьте меня! ...Ладно, ещё раз!": "bd_dana_2", "lilia|Ты услышал ошибку во втором куплете? Ты единственный, кому я верю.": "bd_lilia_0", "lilia|Мы только что написали новый трек. В мой день рождения. Я назову его твоим именем.": "bd_lilia_2", "arman|Бабушка плачет и говорит, что ты хорошо на меня влияешь. Это правда.": "bd_arman_0", "arman|Наверное... этот. Я раньше не знал, что отвечу так.": "bd_arman_2", "timur|Ты выиграла! Загадывай желание. ...Подожди, у меня же день рождения. Ладно, загадывай.": "bd_timur_0", "timur|Это ужасно. Расскажи ещё раз, я запишу.": "bd_timur_2", "daniyar|Ты первый, кто это просит. ...Ладно. Эта песня никогда не звучала вслух.": "bd_daniyar_0", "daniyar|Наши голоса звучат вместе. Я напишу для них песню. Это не обсуждается.": "bd_daniyar_2", "sanzhar|Ты испёкла торт... пекарю. Это самое смелое, что я видел. И он вкусный. Правда.": "bd_sanzhar_0", "sanzhar|Ты угадала все пять! Нет, четыре. Нет, все пять! Ты мой лучший дегустатор.": "bd_sanzhar_2", "emma|Ты сказал это так красиво! Повтори, я запишу на диктофон!": "bd_emma_0", "emma|Ты бежишь как в фильме! Я проиграла, но это мой лучший день рождения!": "bd_emma_2", "nari|Мы взяли топ-1 в мой день рождения! Чат сходит с ума, я тоже!": "bd_nari_0", "nari|Без камеры я тихая, ты знаешь. ...Спасибо. Офлайн это даже лучше.": "bd_nari_2", "lucas|Ты нарисовала мой любимый дом... Он кривой. Он идеальный. Я оставлю его в блокноте навсегда.": "bd_lucas_0", "lucas|Это самое романтичное обещание, которое я слышал. Мы будем искать долго.": "bd_lucas_2", "junso|Гардения — тайная любовь. Ты знаешь язык цветов? ...Теперь знаю, что знаешь.": "bd_junso_0", "junso|Обычно мне хорошо молчать одному. С тобой — лучше.": "bd_junso_2"});
