Object.assign(VO_LINES,{"rin|Ты написал про меня сцену? Я... Можно я сыграю её сама? С тобой.": "bd_rin_1", "wei|Ты съела его?! Всё, ты почётный житель Чэнду. Без визы.": "bd_wei_1", "aigerim|Ты расписал мне пожелания до конца года? Это самое организованное признание в моей жизни.": "bd_aigerim_1", "mira|Ты попал мне в волосы! Война! ...Это лучший день рождения в моей жизни.": "bd_mira_1", "dana|...Ты заметил? Я никому не говорила. Спасибо. Правда.": "bd_dana_1", "lilia|На сцене? ...С тобой — может быть. Это самый страшный и лучший подарок.": "bd_lilia_1", "arman|Открываю приложение, а там торт и твоё имя? Ты разобралась в моём коде?! Это лучший коммит в истории.": "bd_arman_1", "timur|Ты сняла рекламу?! Сто лайков за час! Мама тоже лайкнула, но остальные — не мама!": "bd_timur_1", "daniyar|Ты слушала мои записи? Все? ...Я думал, этого никто не замечает.": "bd_daniyar_1", "sanzhar|«Пекарня Доюна». Ты написала это так, будто она уже есть. Может, и будет.": "bd_sanzhar_1", "emma|Меня никто не снимает, я всегда за камерой. Этот кадр будет у меня в рамке.": "bd_emma_1", "nari|Весь экран в тортиках! Ты взломал мой чат? Я тебя обожаю.": "bd_nari_1", "lucas|Joyeux anniversaire... с твоим акцентом. Я сейчас растаю, как масло.": "bd_lucas_1", "junso|Бабушка скажет, что это лучший букет в её жизни. И что ты ей нравишься.": "bd_junso_1", "rin|Прости, я вслух? Я пишу диалог и проверяю, как он звучит. Звучит плохо.": "rin_n1", "rin|Сато Рин. Из Киото, по обмену. Учусь на кинофакультете и пишу сценарий про Сеул.": "rin_n2", "rin|Можно я иногда буду записывать, что ты говоришь? Ты разговариваешь как герой фильма. В хорошем смысле.": "rin_n3", "wei|Не испугалась? Отлично! Значит, у тебя крепкие нервы. Нам такие нужны.": "wei_n1", "wei|Ли Вэй. Из Чэнду, по обмену. Учу экономику днём, а вечером танцую здесь. Ну, в основном танцую.": "wei_n2", "wei|Хочешь попробовать? Первое движение бесплатно. Второе тоже. Дальше — ужин из хого на всю команду.": "wei_n3", "aigerim|Не подкрадывайся так, пожалуйста.": "aigerim_n1", "aigerim|Юна. Международные отношения, второй курс. Если ищешь розетку — она под столом. Все ищут розетку.": "aigerim_n2", "mira|Это ты, когда заходил. Нахмуренный такой.": "mira_n1", "mira|Я Харин. Бариста, художница и главный враг скучных лиц. Заходи ещё — следующий кот будет добрее.": "mira_n2", "dana|Реакция есть. Уже неплохо.": "dana_n1", "dana|Минджи, волейбол, второй курс. Нам на пробежке не хватает людей, которые не ноют. Ты не ноешь?": "dana_n2", "lilia|Чэвон. Пишу музыку, которую пока никто не понимает. Ключевое слово — «пока».": "lilia_n1", "arman|А? Это не мой. Просто не могу пройти мимо синего экрана.": "arman_n1", "arman|Джиху. Если что-то сломается — я рядом. В смысле... с компьютером. Ну и вообще.": "arman_n2", "timur|Привет! Сыграем один на один? Я поддамся. Чуть-чуть.": "timur_n1", "timur|Тэян. Баскетбол, экономфак и лучшие шутки на этом берегу Хангана.": "timur_n2", "daniyar|Если пришла слушать — садись. Если болтать — дверь там.": "daniyar_n1", "daniyar|...Шучу. Наполовину. Хёну. Юрфак днём, гитара ночью. Угадай, что из этого я люблю.": "daniyar_n2", "sanzhar|Это был живот или гром? Держи круассан, он кривой, его всё равно не продать.": "sanzhar_n1", "sanzhar|Я Доюн. Пеку здесь по утрам, учусь на технолога. Вкусно — главная наука.": "sanzhar_n2", "emma|Ой! Прости. Ты не знаешь, как попасть в Хондэ? Мой корейский... пока только «аннёнхасэё» и «ещё одну порцию».": "emma_n1", "emma|Я Эмма. Из Стокгольма. Приехала по обмену на семестр и уже третий раз еду не в ту сторону.": "emma_n2", "emma|Если покажешь дорогу, я сфотографирую тебя на плёнку. Это высшая награда в моей стране.": "emma_n3", "nari|Ты... слышал? Это не я. Это мой персонаж.": "nari_n1", "nari|Нари. Стримлю по вечерам. Офлайн я не такая громкая. Офлайн я вообще не очень.": "nari_n2", "nari|Садись. Посмотрим, как ты играешь.": "nari_n3", "lucas|Пардон. Ты не знаешь, как по-корейски «можно ещё один круассан, но настоящий»?": "lucas_n1", "lucas|Шучу. Местные кр const SET_KEY='vesna90-set';
function getSet(){try{return Object.assign({fs:1,spd:'norm',theme:'auto',mus:1,vo:1},JSON.parse(localStorage.getItem(SET_KEY)||'{}'))}catch(e){return {fs:1,spd:'norm',theme:'auto',mus:1,vo:1}}}
function applySet(){const s=getSet();const r=document.documentElement;
  r.style.setProperty('--fs',s.fs);
  window.__tspd=s.spd==='fast'?5:2;window.__noType=s.spd==='inst';
  if(s.theme==='auto')delete r.dataset.theme;else r.dataset.theme=s.theme;
  window.__mvol=s.mus;window.__vvol=s.vo;try{MUS.setVol&&MUS.setVol(s.mus)}catch(e){}}
function saveSet(p){try{localStorage.setItem(SET_KEY,JSON.stringify(Object.assign(getSet(),p)))}catch(e){}applySet()}
applySet();
function modal(title,sub,body,onMount){return new Promise(res=>{const w=document.createElement('div');w.className='pnwrap';w.setAttribute('role','dialog');w.setAttribute('aria-label',title);
  w.innerHTML=`<div class="pn"><div class="pnh"><div><small>${esc(sub)}</small><b>${esc(title)}</b></div><button type="button" class="pnx" aria-label="Закрыть">✕</button></div><div class="pnb">${body}</div><button type="button" class="pnok">Готово</button></div>`;
  document.body.appendChild(w);const prev=window.appBack;const close=()=>{w.remove();window.appBack=prev;res()};window.appBack=()=>{close();return true};
  w.querySelector('.pnx').onclick=close;w.querySelector('.pnok').onclick=close;w.addEventListener('click',e=>{if(e.target===w)close()});
  if(onMount)onMount(w,close)})}
function showSettings(){const s=getSet();
  const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button type="button" data-v="${v}" class="${String(s[k])===String(v)?'on':''}">${t}</button>`).join('')}</div>`;

/* ---------- save transfer ---------- */
async function packCode(obj){const txt=JSON.stringify(obj);try{if(window.CompressionStream){const cs=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return 'V90Z:'+btoa(s)}}catch(e){}
  return 'V90J:'+btoa(unescape(encodeURIComponent(txt)))}
async function unpackCode(code){code=String(code).trim().replace(/\s+/g,'');
  if(code.startsWith('V90Z:')){const bin=atob(code.slice(5));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
  if(code.startsWith('V90J:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
  throw new Error('bad')}
function showTransfer(){
  const sl=[1,2,3].map(n=>{try{return JSON.parse(localStorage.getItem(slotKey(n))||'null')}catch(e){return null}});
  const body=`<p class="ptip" style="text-align:left">Скопируй код сохранения на одном устройстве и вставь на другом, например из браузера в приложение на телефоне. Галерея, достижения и словарик переносятся вместе с кодом.</p>
   <h3 class="trh">Сохранить</h3><div class="trs">${sl.map((s,i)=>`<button type="button" class="trb" data-exp="${i+1}" ${s&&s.day?'':'disabled'}>Слот ${i+1}${s&&s.day?`: ${esc(s.name)}, ${esc(dateOf(s.day))}`:': пусто'}</button>`).join('')}</div>
   <textarea class="trt" id="trOut" readonly placeholder="Здесь появится код"></textarea><button type="button" class="trb alt" id="trCopy" disabled>Скопировать код</button>
   <h3 class="trh">Загрузить</h3><textarea class="trt" id="trIn" placeholder="Вставь код сюда"></textarea>
   <div class="trs">${[1,2,3].map(n=>`<button type="button" class="trb" data-imp="${n}">В слот ${n}</button>`).join('')}</div><p class="ptip" id="trMsg"></p>`;
  return modal('Перенос сохранений','Между устройствами',body,w=>{
    const out=w.querySelector('#trOut'),cp=w.querySelector('#trCopy'),msg=w.querySelector('#trMsg');
    w.querySelectorAll('[data-exp]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.exp;out.value='…';out.value=await packCode({v:VER,s:sl[n-1],m:loadMeta()});cp.disabled=false;out.select()});
    cp.onclick=async()=>{try{await navigator.clipboard.writeText(out.value);cp.textContent='Скопировано ✓'}catch(e){out.focus();out.select();try{document.execCommand('copy');cp.textContent='Скопировано ✓'}catch(e2){cp.textContent='Выдели код и скопируй вручную'}}};
    w.querySelectorAll('[data-imp]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.imp;try{const d=await unpackCode(w.querySelector('#trIn').value);if(!d||!d.s||!d.s.day)throw 0;
      if(sl[n-1]&&sl[n-1].day&&!confirmOverwrite(b))return;
      localStorage.setItem(slotKey(n),JSON.stringify(d.s));
      if(d.m){const m=loadMeta();for(const k of ['cg','endings','ach','words'])m[k]=Object.assign({},m[k]||{},d.m[k]||{});m.runs=Math.max(m.runs||0,d.m.runs||0);if(d.m.card)m.card=1;saveMeta(m)}
      msg.textContent=`Готово! Весна «${d.s.name}» загружена в слот ${n}. Выбери этот слот на главном экране.`;msg.style.color='var(--good)'}catch(e){msg.textContent='Код не подошёл. Проверь, что он скопирован целиком.';msg.style.color='var(--bad)'}})})}
function confirmOverwrite(b){if(b.dataset.sure)return true;b.dataset.sure=1;b.textContent='Точно заменить? Нажми ещё раз';return false}

  try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}

    if(navigator.share){await navigator.share({title:'Сохранение «90 дней весны»',text:t});return 'ok'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}

  try{const u=URL.createObjectURL(new Blob([t],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'ok'}catch(e){return 'no'}}
